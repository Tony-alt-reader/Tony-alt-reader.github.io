{"id":"added-karenrlawrencetheodysseyofstyleinulysses","d":"A focused critical argument treats changing style as the novel's action; use it to test, not preempt, a difficult episode.","s":false},{"id":"added-flannobrienthethirdpoliceman","d":"An impossible explanatory system traps a narrator, making a comic companion for readers learning to tolerate unstable reference.","s":false},{"id":"338798","d":"Ulysses follows a day in Dublin through a succession of narrative procedures. It is the terminal work because you must retain people, places and emotional stakes while the means of telling keep changing.","s":false}]},{"id":"beckett","group":"03 · Language, form and modernism","title":"Voices that cannot stop","question":"How little does a narrative need in order to continue?","why":"These are books that can't stop talking. Hamsun's starving narrator opens the path; Beckett's plays strip theatre down to waiting, memory and repetition; his early novels show the voice taking shape. Kenner is your critical guide. Sokolov, Bernhard and Krasznahorkai each build sentences that keep going past where a sentence should end. The Beckett trilogy closes the path. Ask, each time, what actually drives the prose forward when plot no longer does.","assignment":"Write 900 words comparing what sustains narrative movement in The Unnamable and one earlier rung.","criteria":"Name three specific changes in voice, syntax or situation. Show how the text renews attention when ordinary forward action is weak; saying that nothing happens is only the starting observation. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"12279","sources":[],"rungs":[{"id":"32585","d":"Hunger follows an impoverished writer whose self-descriptions shift with bodily need and pride. It opens the path with a voice unable to give itself a stable position.","s":false},{"id":"added-samuelbeckettthelostones","d":"A tightly described enclosure reduces collective life to movements and rules; track how precision can increase uncertainty.","s":false,"o":true},{"id":"103894581","d":"The Stronghold organises a life around waiting for an event that might justify it. Its sustained postponement makes duration itself available for analysis.","s":false,"o":true},{"id":"added-samuelbeckettkrappslasttape","d":"A man listens to his earlier voice, turning autobiography into a theatrical conflict between incompatible presents.","s":false},{"id":"17716","d":"Waiting for Godot turns waiting into dialogue, routines and bodily action. Read aloud to locate movement within apparent repetition.","s":false},{"id":"added-samuelbecketthappydays","d":"Routine speech continues under an impossible physical constraint, extending the plays' investigation of persistence.","s":false,"o":true},{"id":"added-samuelbeckettendgame","d":"Endgame concentrates dependence, exhaustion and control into an enclosed stage. Its restricted arrangement helps isolate what each utterance changes.","s":false},{"id":"added-samuelbeckettmurphy","d":"Murphy combines philosophical preoccupation with comic action and bodily circumstance. It gives you an earlier, more socially populated Beckett before the trilogy’s narrowing worlds.","s":false},{"id":"added-samuelbeckettwatt","d":"Enumerations and failed explanations stretch comedy into an investigation of what language can organize.","s":false},{"id":"added-samuelbeckettproust","d":"Beckett's early critical essay makes memory and habit into problems that his fiction will handle differently.","s":false,"o":true},{"id":"added-hughkennerthebecketttrilogy","d":"Kenner offers a sustained reading of the terminal novels' voices, useful after you have experienced their resistance firsthand.","s":false},{"id":"added-dinobuzzatithetartarsteppe","d":"A life organized around waiting provides a more conventional narrative counterpart to Beckett's suspended action.","s":false,"o":true},{"id":"22716548","d":"A School for Fools lets a divided voice disturb chronology and identity. It is an independent comparison for a narrative in which stable persons and sequences cannot be assumed.","s":false},{"id":"added-christiangaillyaneveningattheclub","d":"Compressed, rhythmically driven prose tests how much narrative can happen through movement of voice alone.","s":false,"o":true},{"id":"added-thomasbernhardextinction","d":"A relentless speaker uses family history as an occasion for revision and attack, an alternative to Beckett's dwindling voice.","s":false},{"id":"11455485","d":"Satantango follows a beleaguered community through expectation, manipulation and recurrent movement. Its long sentences give persistence a very different rhythm from Beckett’s.","s":false},{"id":"added-jamesknowlsondamnedtofame","d":"A biography puts the experiments in contact with work, war and ordinary relationships without treating life as a decoding key.","s":false,"o":true},{"id":"added-martinesslinthetheatreoftheabsurd","d":"An influential critical category groups unlike writers together; decide where it helps and where it obscures Beckett's specifics.","s":false,"o":true},{"id":"12279","d":"Molloy, Malone Dies and The Unnamable progressively unsettle narrative location, bodies and the authority to speak. Read them as three novels with pauses between; the whole trilogy is this terminal rung.","s":false}]},{"id":"japan","group":"04 · Comparative literature","title":"Japan: intimacy under pressure","question":"How do private desires meet a changing social world?","why":"Modern Japanese fiction keeps returning to a private self pressed between duty, desire and a society watching it. Sōseki's Kokoro sets the pattern; Kawabata, Dazai and Tanizaki write intimacy in very different registers; Abe and Ōe push it toward allegory and crisis. Tanizaki's essay on shadows and Karatani's account of how Japanese literature invented interiority give you two ways to think about the tradition. Mishima ends the path with a confession that is also a performance: compare it with every narrator before it.","assignment":"Compare the narrator’s self-presentation in Confessions of a Mask with one voice earlier in the path, in 1,000 words.","criteria":"Use passages about concealment or recognition. Distinguish what social convention demands from what the narrator claims it demands; include one detail that resists a neat cultural explanation. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"62794","sources":[],"rungs":[{"id":"added-natsumesosekikokoro","d":"Kokoro builds a relationship around a withheld history and a consequential confession. It supplies a restrained model of disclosure for the rest of the path.","s":false},{"id":"added-natsumesosekibotchan","d":"A teacher's blunt judgments make modernization into social comedy, contrasting with Kokoro's withheld confession.","s":false,"o":true},{"id":"14028","d":"Snow Country follows an unequal attachment through sharply selected perceptions. Attend to the gap between beautiful description and adequate understanding of another person.","s":false},{"id":"added-natsumesosekiiamacat","d":"An observer outside human status games makes intellectual life ridiculous, widening the course beyond solemn introspection.","s":false,"o":true},{"id":"194740","d":"The Setting Sun locates social decline inside a family’s changing lives. It brings postwar dislocation into a more intimate register than a general account of national transformation.","s":false},{"id":"added-junichirotanizakiinpraiseofshadows","d":"An essay on light and material life supplies a situated aesthetic argument, not a universal explanation of Japanese art.","s":false},{"id":"added-junichirotanizakithemakiokasisters","d":"Family negotiations register historical change through domestic detail, offering an expansive contrast to the shorter novels.","s":false},{"id":"added-koboabethewomaninthedunes","d":"The Woman in the Dunes confines a man inside an exhausting arrangement of labour and dependence. Its physical premise makes freedom a concrete narrative problem.","s":false},{"id":"added-yasunarikawabatathemasterofgo","d":"A contest becomes a narrated transition between values, requiring attention to what the observer cannot simply declare.","s":false,"o":true},{"id":"37004370","d":"The Memory Police imagines a society in which things disappear and memory becomes dangerous. It shifts the comparison toward institutions that regulate what can be retained.","s":false,"o":true},{"id":"added-kenzaburooeapersonalmatter","d":"A father's rationalizations place responsibility inside a changing self-image, an ethical pressure point beside Mishima.","s":false},{"id":"added-johnwdowerembracingdefeat","d":"A history of occupied Japan gives institutional and material context for the postwar novels' social worlds.","s":false,"o":true},{"id":"6713015","d":"Hotel Iris follows desire inside a disturbing and unequal relationship. Read its handling of voice and power beside the more reticent intimacies earlier in the path.","s":false,"o":true},{"id":"added-donaldrichieatractateonjapaneseaesthetics","d":"A brief, explicitly interpretive account of aesthetic habits offers claims to test against particular scenes and objects.","s":false,"o":true},{"id":"574927","d":"Death in Midsummer and Other Stories samples Mishima’s methods across shorter forms. Read the title story and three others, comparing how each controls revelation.","s":false},{"id":"added-kojinkaratanioriginsofmodernjapaneseliterature","d":"Karatani treats interiority and landscape as historical constructions, challenging the assumption that a literary self is simply found.","s":false},{"id":"62804","d":"Sun & Steel links the writer’s account of language to bodily discipline. Treat it as a crafted self-interpretation to test against the fiction, not a definitive explanation of it.","s":false},{"id":"added-minaemizumuraatruenovel","d":"A modern retelling across social classes and decades makes the imported novel form itself part of Japanese history.","s":false,"o":true},{"id":"62794","d":"Confessions of a Mask follows a narrator’s struggle to understand and present his desires. It is terminal because confession itself becomes a form whose truth and performance cannot easily be separated.","s":false}]},{"id":"latin-america","group":"04 · Comparative literature","title":"The archive, the dictator and the missing person","question":"What can fiction recover when the record is broken?","why":"Latin American fiction keeps circling absences: disappeared people, unwritten archives, dictators who are everywhere and nowhere. Borges supplies the infinite library; Carpentier and Rulfo give you history and the dead speaking; García Márquez, Vargas Llosa and Puig take on the dictator and the prison cell. Donoso's Obscene Bird is the nightmare version. Rama explains how writing became power in Latin America. Bolaño ends the path with two vast books built around what cannot be found. Track what each book lets you assemble, and what stays missing.","assignment":"Compare how The Savage Detectives and 2666 organise an absence. Write 1,200 words on what the reader can and cannot assemble.","criteria":"Use evidence from at least two sections of each novel. Account for one formal decision that withholds satisfaction, and consider whether that withholding is productive in the particular case. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"19865580","sources":[],"rungs":[{"id":"5787","d":"The Aleph and Other Stories makes perspective, knowledge and memory into compact narrative experiments. It extends your Borges reading with models of how a small form can imply an impossible whole.","s":false},{"id":"added-alejocarpentierthekingdomofthisworld","d":"Revolution is narrated through a world that exceeds official political explanation, preparing a contrast with his longer historical novel.","s":false},{"id":"94486","d":"The Invention of Morel joins a fugitive’s account to an unsettling technology of representation. It makes the preservation of an image a question about life and possession.","s":false,"o":true},{"id":"added-miguelangelasturiasthepresident","d":"Dictatorial power enters rumor, fear and language before later novels give it more flamboyant formal shapes.","s":false,"o":true},{"id":"added-juanrulfopedroparamo","d":"Pedro Páramo gives a town’s history through voices whose temporal positions are initially uncertain. It trains attention to the way fragments disclose a social world.","s":false},{"id":"added-gabrielgarciamarqueztheautumnofthepatriarch","d":"Power becomes a recursive, unstable voice rather than a linear biography, extending the dictator novel's formal possibilities.","s":false},{"id":"152809","d":"An Episode in the Life of a Landscape Painter places artistic observation under physical and historical pressure. It offers a short test of what representing a world demands of the observer.","s":false,"o":true},{"id":"added-mariovargasllosaconversationinthecathedral","d":"Overlapping conversations reconstruct compromise under dictatorship, making political history a problem of narrative assembly.","s":false},{"id":"added-josedonosotheboominspanishamericanliterature","d":"A novelist's personal account of a literary movement reveals the networks behind the idea of a sudden continental emergence.","s":false,"o":true},{"id":"61982591","d":"Explosion in a Cathedral follows revolutionary ideas as they enter Caribbean lives. It expands the path from private perception to promises and coercions carried by history.","s":false,"o":true},{"id":"added-manuelpuigkissofthespiderwoman","d":"Storytelling between prisoners entangles intimacy and politics, making the act of telling consequential inside the fiction.","s":false},{"id":"added-josedonosotheobscenebirdofnight","d":"Unstable identities and enclosing voices make social hierarchy difficult to separate from narrative terror.","s":false},{"id":"203579062","d":"By Night in Chile turns a cleric’s self-account into an uneasy encounter with culture and complicity. Its compact monologue is a useful first Bolaño for this path.","s":false},{"id":"27218585","d":"A family chronicle registers political violence across generations, a different scale from Bolaño's scattered literary lives.","s":false,"o":true},{"id":"added-valerialuisellitellmehowitends","d":"An account of interpreting migrant children's stories shows the institutional consequences of fitting a life into a form.","s":false,"o":true},{"id":"63033","d":"The Savage Detectives assembles a literary search through a long sequence of voices. Follow how testimony makes the poets visible while also dispersing them.","s":false},{"id":"added-angelramatheletteredcity","d":"Rama argues that writing and elite urban power grew together, giving the novels' archives a historical hypothesis to challenge.","s":false},{"id":"added-valerialuisellifacesinthecrowd","d":"Translation, memory and literary ghosts share a fragmented narrative space, a compact preparation for Bolaño's dispersed voices.","s":false,"o":true},{"id":"19865580","d":"2666 brings critics, a writer, a city and repeated violence into an unsettled architecture. Its terminal task is to keep the differences between its sections alive without forcing them into one explanation.","s":false}]},{"id":"africa","group":"04 · Comparative literature","title":"African lives beyond the emblem","question":"How does a novel resist being made to represent a continent?","why":"African fiction is often read as representative of a nation or a continent. This path insists on individual lives. Achebe sets the starting point; Dangarembga, Bâ and Head write about women and education, marriage and madness; Ngũgĩ argues for writing in African languages. Okri and Saro-Wiwa invent new English for war and spirit; Adichie and Coetzee return to violence and its aftermath; Sarr's novel is a recent turn. Wizard of the Crow ends the path as a satire of power. Ask who each book claims to speak for.","assignment":"Choose a claim about power in Wizard of the Crow and compare its fictional treatment with one earlier novel. Write 1,000 words.","criteria":"Explain how comedy or exaggeration changes the claim. Use a specific scene from each book and identify an important difference in historical or social setting. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"added-ngugiwathiongowizardofthecrow","sources":[],"rungs":[{"id":"37781","d":"Things Fall Apart depicts the tensions within an Igbo community as colonial intervention transforms it. Read its internal disagreements as carefully as the external confrontation.","s":false},{"id":"added-tsitsidangarembganervousconditions","d":"Education promises escape while reorganizing a girl's obligations, making the family a site of colonial and gendered pressure.","s":false},{"id":"223049","d":"A Walk in the Night and Other Stories brings racial domination into closely observed urban encounters. Its shorter scale offers a contrast to the communal architecture of Achebe.","s":false,"o":true},{"id":"added-buchiemechetathejoysofmotherhood","d":"A woman's expected fulfillment becomes a material struggle, challenging the community's official story of a good life.","s":false,"o":true},{"id":"added-mariamabasolongaletter","d":"So Long a Letter uses an intimate address to examine marriage, friendship and social expectation. It gives political change a form rooted in a particular relationship.","s":false},{"id":"added-bessieheadaquestionofpower","d":"Exile and mental crisis unsettle the boundary between intimate experience and the structures of domination around it.","s":false},{"id":"added-ngugiwathiongodecolonisingthemind","d":"Essays on language and literary production ask who a writer can address and at what institutional cost.","s":false},{"id":"34182166","d":"Foe revisits the island narrative through a woman whose authority to tell is contested. It makes the exclusion of a voice into a formal problem rather than simply adding missing information.","s":false,"o":true},{"id":"added-benokrithefamishedroad","d":"A child's unstable relation to the spirit world changes the terms on which poverty and political violence are narrated.","s":false},{"id":"added-kensarowiwasozaboy","d":"A young soldier's language exposes what official military vocabulary conceals about experience and confusion.","s":false},{"id":"59045568","d":"Half of a Yellow Sun follows interconnected lives through the Biafran War. Its movement between viewpoints asks how a historical catastrophe becomes a novel without becoming only a lesson.","s":false},{"id":"added-jmcoetzeedisgrace","d":"A man's account of his own fall competes with lives he cannot adequately narrate, extending Foe's question of authority.","s":false},{"id":"27071490","d":"Homegoing follows related family lines across generations and the Atlantic. Its linked structure makes discontinuity and inheritance jointly visible.","s":false,"o":true},{"id":"added-davidolusogablackandbritishaforgottenhistory","d":"A history of connected lives complicates a clean division between Africa and Europe in the novels' inherited worlds.","s":false,"o":true},{"id":"added-chinuaachebetheeducationofabritishprotectedchild","d":"Achebe's essays discuss reading, schooling and representation in his own critical voice, beside his fictional practice.","s":false,"o":true},{"id":"48734888","d":"The First Woman follows a Ugandan girl’s formation among competing models of womanhood. It broadens the path’s account of history through myth, family and ordinary authority.","s":false,"o":true},{"id":"201741637","d":"A community's responses to migration emerge through competing voices, resisting the idea that belonging has one spokesman.","s":false},{"id":"added-dipofaloyinafricaisacountry","d":"A contemporary critique of flattened representations offers claims to compare with the very different national settings of these novels.","s":false,"o":true},{"id":"added-ngugiwathiongowizardofthecrow","d":"Wizard of the Crow uses expansive satire to examine dictatorship, money and the performance of power. It ends the path by making political representation itself theatrical and unstable.","s":false}]},{"id":"arabic","group":"04 · Comparative literature","title":"Arabic fiction: the house and the outside world","question":"Who can speak freely inside a family, a city or a nation?","why":"Arabic fiction often sets the house against the street: family authority, censorship and war pressing in from outside. Choukri's memoir and El Saadawi's prison testimony open with voices that broke taboos. Darwish, Kanafani and Salih write exile and return; Munif's Cities of Salt shows oil transforming a desert. Allen gives the history of the Arabic novel. Saadawi's Frankenstein in Baghdad is the contemporary nightmare. Mahfouz's Cairo Trilogy ends the path, read straight through, as one family across three generations of Egyptian history.","assignment":"Trace one rule of household authority across the Cairo Trilogy and compare it with a conflict in Woman at Point Zero. Write 1,200 words.","criteria":"Show the rule changing across at least three scenes. Distinguish the narrator’s presentation from your evaluation, and account for the very different forms of the two works. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"added-naguibmahfouzsugarstreet","sources":[{"title":"Season of Migration to the North — NYRB","url":"https://www.nyrb.com/products/season-of-migration-to-the-north","note":"Publisher introduction and edition information for Tayeb Salih’s novel."}],"rungs":[{"id":"387926","d":"Le pain nu recounts poverty, survival and the acquisition of literacy in Morocco. It begins with a forceful account of bodily need and the conditions of telling a life.","s":false},{"id":"added-latifaalzayyattheopendoor","d":"Personal freedom and anticolonial politics develop together, complicating any separation of a woman's domestic and public lives.","s":false,"o":true},{"id":"256373","d":"Le Passé Simple stages a young man’s conflict with paternal authority and social convention. Read its aggression as a formal choice as well as a position to agree or disagree with.","s":false,"o":true},{"id":"added-ibrahimalkonithebleedingofthestone","d":"Desert life and ecological pressure produce a narrative world far from the urban family chronicle.","s":false,"o":true},{"id":"159604","d":"Woman at Point Zero frames one woman’s account through another’s encounter with her. It makes voice, economic dependence and the authority of testimony inseparable.","s":false},{"id":"added-mahmouddarwishmemoryforforgetfulness","d":"A prose recollection of siege makes ordinary sensation bear historical pressure, beside fiction of Palestinian displacement.","s":false},{"id":"added-ghadasammanbeirutnightmares","d":"An enclosed experience of civil war shifts between observation and nightmare, putting the narrator's safety and authority in question.","s":false,"o":true},{"id":"added-ghassankanafanimeninthesun","d":"Men in the Sun follows displaced Palestinians seeking work across a border. Its compressed journey makes withheld speech and physical vulnerability carry political force.","s":false},{"id":"added-mouridbarghoutiisawramallah","d":"A return from exile asks what recognition means when home has changed and the right to return is unequal.","s":false,"o":true},{"id":"added-tayebsalihseasonofmigrationtothenorth","d":"Season of Migration to the North turns a return to Sudan into an encounter with another man’s European past. It complicates the relation between self-invention, colonial history and narration.","s":false},{"id":"added-abdelrahmanmunifcitiesofsalt","d":"Oil transforms a community's geography and social relations, enlarging the course's scale from house to political economy.","s":false},{"id":"added-rogerallenthearabnovelanhistoricalandcriticalintroduction","d":"A literary history makes specific claims about the form's development; check them against the range of books here.","s":false},{"id":"6692041","d":"Mornings in Jenin follows a Palestinian family through displacement across generations. Its longer family structure provides a useful comparison with Mahfouz’s concentration on a Cairo household.","s":false,"o":true},{"id":"added-basmaabdelazizthequeue","d":"An unexplained administrative demand organizes everyday life, making authority visible through waiting and compliance.","s":false,"o":true},{"id":"added-riadsattoufthearabofthefuturevolume1","d":"A graphic childhood memoir makes national and familial authority legible through images as well as recollected speech.","s":false,"o":true},{"id":"added-ahmedsaadawifrankensteininbaghdad","d":"A assembled body becomes a competing account of victims and perpetrators, carrying the city's violence into speculative form.","s":false},{"id":"762134","d":"Palace Walk begins the Cairo Trilogy inside a household whose public and private authorities differ. Attend to how the city reaches the family through thresholds, habits and encounters.","s":false},{"id":"added-naguibmahfouzpalaceofdesire","d":"Palace of Desire carries the family into changing generational aspirations. It is the necessary middle movement of this particular narrative, not optional background to the finale.","s":false},{"id":"added-naguibmahfouzsugarstreet","d":"Sugar Street extends the family chronicle into divergent political and personal commitments. It closes the path by showing inherited authority changing as the same household’s world expands.","s":false}]},{"id":"diaspora","group":"04 · Comparative literature","title":"Home across generations","question":"What survives a move, and who decides what survival means?","why":"Migration stories ask what home means once you've left it. Narayan's India and Naipaul's Trinidad open with homes that are made and lost; Smith and Hamid move the question to London and an imagined borderless world. Weil and Maalouf offer two opposed arguments about roots and identity. Selvon, Tan and Orange trace communities across generations; Louis writes about leaving a class rather than a country. Pachinko ends with four generations of one family. Watch the objects and places that carry history from one generation to the next.","assignment":"Compare a material object or recurring place in Pachinko with one in an earlier rung. Write 1,000 words on how it carries a history across generations.","criteria":"Use three scenes from the terminal novel. Explain one loss or transformation that the language of cultural continuity fails to describe. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"34051011","sources":[],"rungs":[{"id":"129877","d":"The Guide follows a man whose public roles change how others understand him. It introduces the tension between social recognition and the history an individual carries.","s":false},{"id":"added-jhumpalahirithenamesake","d":"A name becomes a changing relation to parents and place, giving intergenerational identity a deliberately ordinary scale.","s":false,"o":true},{"id":"5849","d":"A House for Mr Biswas makes the search for a house a long struggle over autonomy and family. It turns belonging into a material project rather than an abstract sentiment.","s":false},{"id":"added-dinawmengestuthebeautifulthingsthatheavenbears","d":"An Ethiopian shopkeeper's life in Washington makes belonging depend on a changing neighborhood as well as a remembered home.","s":false,"o":true},{"id":"3711","d":"White Teeth follows intersecting families whose histories do not remain neatly inside their descendants’ plans. Its comic plurality broadens the path from individual escape to competing inheritances.","s":false},{"id":"added-mohsinhamidexitwest","d":"An impossible shortcut across borders removes the journey's logistics to expose what relocation still cannot solve.","s":false},{"id":"141420","d":"A philosophical account of obligation and belonging gives the novels a demanding claim to qualify or resist.","s":false},{"id":"7763","d":"The Joy Luck Club distributes family memory between mothers and daughters. Its linked voices make misunderstandings between generations part of the structure.","s":false},{"id":"added-hanifkureishithebuddhaofsuburbia","d":"Performance and class mobility complicate a young Londoner's attempts to make identity into a stable possession.","s":false,"o":true},{"id":"added-samselvonthelonelylondoners","d":"A shared narrative idiom builds migrant urban life without forcing it into one representative biography.","s":false},{"id":"114447","d":"The Impressionist follows identity through colonial settings and acts of reinvention. It questions what remains of an individual when social categories keep changing.","s":false,"o":true},{"id":"added-dinanayeritheungratefulrefugee","d":"Memoir and reporting examine the narratives institutions demand from displaced people in exchange for recognition.","s":false,"o":true},{"id":"added-harshawaliaborderandrule","d":"A structural account of borders and labor challenges explanations of migration built only around individual choice.","s":false,"o":true},{"id":"36692478","d":"There There brings multiple Indigenous lives toward a shared event in Oakland. It gives urban belonging a collective form without collapsing the speakers into one representative voice.","s":false},{"id":"added-novioletbulawayoweneednewnames","d":"A child's movement between Zimbabwe and America makes language and aspiration register displacement unevenly.","s":false,"o":true},{"id":"212934","d":"An essay against reducing a person to one affiliation gives a clear proposition to test across the novels.","s":false},{"id":"20507062","d":"En finir avec Eddy Bellegueule recounts a departure from a constraining social environment. Read its account of escape beside the attachments and histories the other books make hard to leave.","s":false},{"id":"added-cristinahenriquezthebookofunknownamericans","d":"Interwoven migrant voices make a neighborhood's shared life exceed any single family's reasons for moving.","s":false,"o":true},{"id":"34051011","d":"Pachinko follows a Korean family across generations in Japan. Its long span makes institutional exclusion, work and intimate choices visible together, giving the path a sustained historical destination.","s":false}]},{"id":"contemporary","group":"04 · Comparative literature","title":"The contemporary novel changes scale","question":"How much social life fits inside a small formal invention?","why":"Contemporary fiction keeps changing scale: one mind blown up to fill a city, a whole society seen through a family, a life told in fragments. Cusk and Moss work small; Lerner and Mathieu widen to politics and class; Szalay, Egan and Saunders build books from many voices. Fisher's essays name the mood of the period. Tokarczuk scatters a novel across travel and anatomy, and Cărtărescu turns one teacher's diary into a cosmos. Ducks, Newburyport ends the path as one sentence that tries to hold everything.","assignment":"Compare two transitions in Ducks, Newburyport with transitions in an earlier rung. Write 1,000 words on how the book makes private thought meet public life.","criteria":"Analyse actual wording and recurrence. Include one passage where the method becomes less effective for you and justify that judgement with the same precision. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"43412920","sources":[{"title":"Satantango — New Directions","url":"https://www.ndbooks.com/book/satantango/","note":"Publisher account of the novel and George Szirtes’s translation."}],"rungs":[{"id":"50202953","d":"Piranesi makes a restricted record of a strange world the basis for discovery. Its journals give you a compact starting point for the relation between formal limitation and knowledge.","s":false,"o":true},{"id":"54785558","d":"A narrator's invitation to an artist exposes conflicting ideas of freedom and recognition within a small domestic space.","s":false},{"id":"38922230","d":"Ghost Wall compresses belonging, hierarchy and violence into a brief expedition. Its economy helps distinguish productive compression from unexplained suggestion.","s":false},{"id":"199927666","d":"Social observation follows a return to familiar surroundings, asking what a contemporary social novel can do with stalled aspiration.","s":false,"o":true},{"id":"53780642","d":"The Employees builds a workplace world from statements and reports. Its gaps ask you to infer institutions from the language they elicit.","s":false,"o":true},{"id":"43565369","d":"Private speech, competitive debate and public language intersect, making the form of an argument part of social inheritance.","s":false},{"id":"22380320","d":"Essays on culture and lost futures offer a contestable account of why the contemporary can feel strangely unable to move forward.","s":false},{"id":"60243188","d":"Bliss Montage places recognisable desires and social relations inside altered premises. The stories let you compare several ways an invention can sharpen, rather than replace, observation.","s":false,"o":true},{"id":"41070908","d":"Adolescence unfolds within deindustrialization, giving the block a sustained realist counterpart to its compressed experiments.","s":false},{"id":"58446227","d":"Separated lives are connected through disruptions of time, testing how a small novel can imply an enormous system.","s":false,"o":true},{"id":"26046318","d":"All That Man Is assembles separate lives into a larger pattern. Its sequence raises the question of when a collection’s arrangement becomes an argument.","s":false},{"id":"added-jennifereganthecandyhouse","d":"Interconnected lives encounter technologies of externalized memory, extending the novel's formal network into its subject.","s":false},{"id":"29906980","d":"Lincoln in the Bardo brings many voices around a moment of grief. It asks how citation, imagined testimony and chorus change the scale of an intimate event.","s":false},{"id":"added-jiatolentinotrickmirror","d":"Essays on contemporary self-presentation offer claims about the conditions these novels observe and reshape.","s":false,"o":true},{"id":"36885304","d":"Flights joins fragments about travel, bodies and preservation. Read the returns between pieces as carefully as their apparent freedom of movement.","s":false},{"id":"added-elenaferrantethestoryofanewname","d":"An ongoing friendship becomes a structure for tracking social change, contrasting serial expansion with the block's smaller formal units.","s":false,"o":true},{"id":"71872930","d":"North Woods follows a place through changing inhabitants and forms. It makes continuity depend on a location rather than a single protagonist.","s":false,"o":true},{"id":"added-malcolmbradburythenoveltodaycontemporarywritersonmodernfiction","d":"Writers discuss the form's possibilities and pressures; compare a declared intention with a novel's actual choices.","s":false,"o":true},{"id":"wc-cartarescu-solenoid","d":"A Bucharest schoolteacher's diary-novel that swells into dreams, metaphysics and a secret machine under his house. Read it for scale in the other direction from Ducks, Newburyport: one private mind expanding until it seems to contain the city.","s":false,"w":true},{"id":"43412920","d":"Ducks, Newburyport builds a vast associative flow around an ordinary life. It is terminal because sustaining its form requires you to follow patterns of attention across radically different scales.","s":false}]},{"id":"life-writing","group":"04 · Comparative literature","title":"A life is not a plot","question":"What does autobiographical form admit or leave out?","why":"Life writing claims to tell the truth, but every form shapes what it can tell. Kingston mixes memoir with myth; Ernaux and Didion write grief and abortion with deliberate restraint; Pessoa and Knausgård test how much of a life a book can hold. Lejeune defines the 'autobiographical pact' between writer and reader; Kermode explains why we impose endings. Nelson, Ginzburg, Nabokov, Machado and Bechdel each break the pact differently. Dictee ends the path with a book made from fragments, images and silence.","assignment":"Compare the handling of one absence in Dictee with an absence in an earlier rung. Write 1,000 words on what each form enables you to know.","criteria":"Identify the genre claims the texts make. Distinguish missing information from deliberate formal discontinuity, and cite both wording and page arrangement where relevant. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"7093874","sources":[],"rungs":[{"id":"17329120","d":"Things I Don’t Want to Know answers questions about writing through recollected experience. It establishes how an essay can organise a life without promising a complete chronology.","s":false,"o":true},{"id":"added-maxinehongkingstonthewomanwarrior","d":"Family stories and myth complicate the promise of straightforward autobiography, making inherited narrative part of a lived self.","s":false},{"id":"819954","d":"L’Événement reconstructs an abortion through memory and the effort to describe it. It makes the difficulty of truthful retrospective language part of the account.","s":false},{"id":"added-lucygrealyautobiographyofaface","d":"Illness and appearance organize remembered experience; attend to how a body becomes the principle of a narrative.","s":false,"o":true},{"id":"7815","d":"The Year of Magical Thinking examines grief through recurring thoughts and attempts at explanation. Its repetitions offer a specific formal comparison with the narrative of an event.","s":false},{"id":"59062864","d":"A family memoir must account for affection and deprivation at once, resisting a simple verdict on its parents.","s":false,"o":true},{"id":"45974","d":"A fragmented invented speaker makes autobiography possible without a continuous or verifiable life story.","s":false},{"id":"26145543","d":"My Struggle: Book 1 gives ordinary memory extensive narrative space. Read this volume alone for the path, asking what length changes about the selection of a life.","s":false},{"id":"added-rachelcuskoutline","d":"A nearly absent narrator is assembled through other people's accounts, reversing the usual center of an autobiographical novel.","s":false,"o":true},{"id":"added-philippelejeuneonautobiography","d":"Read the essay The Autobiographical Pact; its account of a reader's contract clarifies what a first-person book promises.","s":true},{"id":"22929741","d":"The Argonauts joins intimate experience to quoted and contested ideas. It makes the relation between a life and its available conceptual language explicit.","s":false},{"id":"added-nataliaginzburgfamilylexicon","d":"Remembered phrases organize a family history, making language rather than plot the means of continuity.","s":false},{"id":"added-vladimirnabokovspeakmemory","d":"Patterned recollection turns autobiography into an art of arrangement, a useful challenge to claims of transparent recall.","s":false},{"id":"43317482","d":"In the Dream House reconstructs a relationship through many miniature genre frames. It tests how changing the form changes what can be said about a painful experience.","s":false},{"id":"added-harrycrewsachildhood","d":"A memoir of poverty and storytelling shows how inherited tales enter the remembered account of a childhood.","s":false,"o":true},{"id":"added-gertrudesteintheautobiographyofalicebtoklas","d":"An autobiography written through another person's supposed voice makes the signature and the speaker deliberately diverge.","s":false,"o":true},{"id":"91871","d":"Skin brings essays about sex, class and literature into relation. It helps compare self-disclosure with the public uses to which a narrated life can be put.","s":false,"o":true},{"id":"added-frankkermodethesenseofanendingstudiesinthetheoryoffiction","d":"A critical account of beginnings and endings tests the pressure to make a life intelligible as a completed shape.","s":false},{"id":"wc-bechdel-fun-home","d":"A graphic memoir that keeps revising one family history through literary allusion (Joyce, Proust, Fitzgerald). The panels make you compare what the drawings show with what the captions claim: good practice for Dictee's mix of image and text.","s":false,"w":true},{"id":"7093874","d":"Dictee works across language, image, history and several women’s lives. It ends the path by resisting the assumption that one continuous autobiographical voice can adequately contain its material.","s":false}]},{"id":"queer","group":"04 · Comparative literature","title":"The self under another’s gaze","question":"How does a novel make identity more than a category?","why":"This path follows people seen, named and misnamed by others. Baldwin and Forster open with love that has to stay hidden; Garréta's Sphinx never tells you the narrator's or lover's gender; Barnes and Kay make identity a riddle. Sedgwick, Halberstam and Muñoz provide three generations of theory about how identity is read. Hollinghurst, Qiu and Emezi write desire under pressure from class, family and nation. Middlesex ends with a narrator who tells their own story. Ask how each book controls what the reader is allowed to know.","assignment":"Write 1,000 words comparing one scene of being recognised or misrecognised in Middlesex with a scene in Sphinx or Trumpet.","criteria":"Explain the role of narration and naming. Identify a point at which a character’s account of identity differs from the categories the surrounding society uses. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"2187","sources":[],"rungs":[{"id":"38462","d":"Giovanni’s Room follows desire through a narrator’s retrospective account of shame and attachment. It begins the path with the cost of making a life acceptable to oneself.","s":false},{"id":"added-emforstermaurice","d":"An imagined possibility of shared life exposes the social conditions that make desire difficult to name.","s":false,"o":true},{"id":"23129715","d":"Sphinx withholds grammatical gender from its lovers in French. It is a precise experiment in what a reader assumes when the usual linguistic markers are unavailable.","s":false},{"id":"added-djunabarnesnightwood","d":"Dense, unstable speech turns desire into a problem of narration rather than an easily summarized identity.","s":false},{"id":"195733","d":"Trumpet approaches a life through people who remember and interpret it. Its multiple perspectives keep identity from belonging exclusively to either the subject or the observer.","s":false},{"id":"added-jeanettewintersonorangesarenottheonlyfruit","d":"A girl's story competes with the religious story that has already assigned her a role.","s":false,"o":true},{"id":"85766","d":"Sedgwick studies knowledge, secrecy and sexuality; test her distinctions against what a novel lets its readers know.","s":false},{"id":"139087","d":"The Line of Beauty follows desire inside a world of wealth, politics and aesthetic judgement. It brings class and access into the path’s account of visibility.","s":false},{"id":"added-lesliefeinbergstonebutchblues","d":"Work, violence and chosen community make gender legible through material circumstances as well as self-understanding.","s":false,"o":true},{"id":"added-jackhalberstamfemalemasculinity","d":"A study of masculinity outside male bodies gives the fiction a history of categories and exclusions to contend with.","s":false},{"id":"31395589","d":"Notes of a Crocodile uses journals and shifting registers to follow queer life and alienation. Compare its management of disclosure with Baldwin’s retrospective confession.","s":false},{"id":"added-andrewhollerandancerfromthedance","d":"A social world of beauty and longing is narrated through its own retrospective mythology.","s":false,"o":true},{"id":"added-joseestebanmunozdisidentifications","d":"Muñoz examines how minority performers work with and against available identities rather than simply accepting or rejecting them.","s":false},{"id":"48595550","d":"The Death of Vivek Oji reconstructs a life through grief and incomplete knowledge. Its arrangement asks who has the authority to understand the person who has died.","s":false},{"id":"added-gorevidalthecityandthepillar","d":"An idealized early attachment structures an adult life, offering an unsentimental contrast to narratives of self-discovery.","s":false,"o":true},{"id":"added-leobersanihomos","d":"A provocative argument about sexuality and identity gives a position to challenge through the novels' detailed social worlds.","s":false,"o":true},{"id":"181110022","d":"Bad Habit follows a trans woman’s coming of age in a working-class environment. It gives self-making a particular social and historical texture to compare with the earlier books.","s":false,"o":true},{"id":"added-lesliefeinbergtransgenderwarriors","d":"A historical and political account connects gender variance to collective struggle; distinguish its evidence from the accompanying novel.","s":false,"o":true},{"id":"2187","d":"Middlesex joins a narrator’s account of embodiment to a multigenerational family story. It is terminal because personal identity, inherited narrative and explanatory ambition operate at several scales at once.","s":false}]},{"id":"gothic","group":"05 · Gothic fiction","title":"Fear and the unstable house","question":"How does a place acquire the power to frighten?","why":"Gothic fiction is built around unstable houses and minds you can't trust. Walpole, Lewis, Hogg and Brockden Brown give you the founding excesses, British and American; du Maurier and Waters move them indoors and into the twentieth century. Todorov's theory of the fantastic (the hesitation between natural and supernatural explanations) is your main tool; Punter supplies the history. Meyrink and King push the house into the city and the hotel. Enriquez ends the path with contemporary Argentine horror. At each threshold, ask what the book forbids you to see.","assignment":"Compare the handling of a threshold, room or forbidden space in two stories from The Dangers of Smoking in Bed and one earlier novel. Write 900 words.","criteria":"Name when the text supplies information and when it withholds it. Explain how a social relation helps produce fear, without reducing every frightening detail to a symbol. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"53215250","sources":[],"rungs":[{"id":"added-horacewalpolethecastleofotranto","d":"An early Gothic story makes architecture, inheritance and supernatural disturbance inseparable.","s":false},{"id":"93157","d":"The Monk combines religious authority, desire and sensational plotting. It establishes conspicuous Gothic machinery that later books can concentrate or make less visible.","s":false},{"id":"added-annradcliffethemysteriesofudolpho","d":"A prolonged education in fear depends on the difference between what a heroine sees and what she can explain.","s":false,"o":true},{"id":"721012","d":"The Legend of Sleepy Hollow and Other Stories uses storytelling and uncertain belief to shape fear. Read the title story and Rip Van Winkle as this rung’s defined selection.","s":true,"o":true},{"id":"wc-brown-wieland","d":"An American gothic from 1798: a family undone by mysterious voices, narrated by a sister who cannot be sure what she heard or why. When an explanation finally arrives, ask whether it settles Todorov's hesitation or only moves it somewhere else.","s":false,"w":true},{"id":"added-jameshoggtheprivatememoirsandconfessionsofajustifiedsinner","d":"Competing accounts of religious certainty make both guilt and the supernatural difficult to stabilize.","s":false},{"id":"17899948","d":"Rebecca makes a house and its remembered inhabitant exert pressure on a new arrival. Its first-person limitation turns interpretation of domestic space into suspense.","s":false},{"id":"added-sarahwatersthelittlestranger","d":"A deteriorating house is filtered through an interested observer, making class desire difficult to separate from supernatural fear.","s":false},{"id":"added-tzvetantodorovthefantastic","d":"A critical theory of hesitation supplies a specific claim about the genre that these stories can confirm or frustrate.","s":false},{"id":"99794","d":"The Golem places unstable identity and perception inside an uncanny city. It broadens enclosure from a single household into an atmosphere of streets and rooms.","s":false},{"id":"567678","d":"A private ritual system makes a narrator's home terrifying before its governing explanations are exposed.","s":false,"o":true},{"id":"added-juliakristevapowersofhorror","d":"An account of abjection asks why threatened boundaries of body and identity can produce disgust and fascination.","s":false,"o":true},{"id":"6324651","d":"The Shining makes a hotel intensify an already vulnerable family situation. Attend to how setting and focalisation collaborate rather than assigning all causation to a supernatural premise.","s":false},{"id":"added-ernestjonesonthenightmare","d":"A psychoanalytic interpretation of frightening motifs provides a historically situated explanation to test, not a diagnosis of characters.","s":false,"o":true},{"id":"53177097","d":"Between Two Fires follows a journey through a plague-stricken world and supernatural threat. It changes the scale of Gothic ordeal from private enclosure to a devastated landscape.","s":false,"o":true},{"id":"added-silviamorenogarciamexicangothic","d":"A decaying household makes inheritance, race and extraction part of the Gothic building's material history.","s":false,"o":true},{"id":"added-davidpuntertheliteratureofterrorvolume1","d":"A history of Gothic writing ties recurring fears to changing social circumstances, complicating universal accounts of the genre.","s":false},{"id":"60097451","d":"Motherthing brings domestic desire and disturbing fantasy into close contact. Its tonal shifts offer a contemporary test of how comedy and dread can sustain each other.","s":false,"o":true},{"id":"added-rogerluckhurstgothicanillustratedhistory","d":"A history across media lets you compare a prose effect with the visual conventions later attached to it.","s":false,"o":true},{"id":"53215250","d":"The Dangers of Smoking in Bed makes ordinary urban and domestic situations open into horror. The collection is terminal because its variations let you compare how particular social fears become narrative mechanisms.","s":false}]},{"id":"criticism","group":"06 · Critical methods","title":"Criticism that earns its judgement","question":"What does a good reading make visible?","why":"Criticism is only worth reading when its judgements are earned. Forster and James open with the novelist's view; Nabokov's lectures show a reader who loves and condemns with equal confidence. Kundera, Frye, Sontag and Jameson offer four incompatible methods; Empson shows close reading at its most inventive; Said reads the novel against empire; Wood and Felski argue about what reading is for. Auerbach ends the path as the model of a method that grows from close attention to passages. Test each method on a book you know well.","assignment":"Write a 1,200-word review of a book you admire, organised around two passages. Apply one method from Mimesis, then explain where that method is insufficient.","criteria":"Demonstrate how wording or form produces the effect you value. Include a limitation or counterexample. Length serves the analysis; it is not a proxy for seriousness. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"80795","sources":[],"rungs":[{"id":"3667","d":"Aspects of the Novel distinguishes elements such as story, plot and character. Its direct critical vocabulary provides an opening set of claims to test against your reading.","s":false},{"id":"wc-nabokov-lectures","d":"Nabokov's Cornell lectures on Austen, Dickens, Flaubert, Stevenson, Proust, Kafka and Joyce, with his own maps and drawings. His judgements are confident and often provocative; the path's question is whether his method earns them.","s":false,"w":true},{"id":"added-henryjamesthefigureinthecarpet","d":"A critic pursues the hidden secret of an author's work; the pursuit makes interpretive confidence comic and troubling.","s":false},{"id":"69926","d":"The Art of Fiction uses brief examples to discuss narrative techniques. Treat each chapter as a demonstration, then find an instance that works differently.","s":false,"o":true},{"id":"added-asbyattpossession","d":"A literary investigation turns documents into imagined lives, asking where scholarship ends and desire takes over.","s":false,"o":true},{"id":"28637","d":"The Art of the Novel presents a novelist’s thinking about the form’s possibilities. Compare its large claims with the more local examples in Lodge.","s":false},{"id":"318116","d":"Frye proposes a systematic account of literary forms; compare its explanatory reach with its tendency to absorb differences.","s":false},{"id":"added-henryjamestheaspernpapers","d":"A researcher's hunger for private evidence exposes the ethical cost of claiming authority over an author's life.","s":false,"o":true},{"id":"52374","d":"Against Interpretation and Other Essays challenges habits of reducing artworks to paraphrasable meanings. Read the title essay against your own reviewing practice without taking it as a ban on interpretation.","s":false},{"id":"added-fredricjamesonthepoliticalunconscious","d":"A major argument for historical interpretation gives the block a strong position against purely formal appreciation.","s":false},{"id":"2446828","d":"Literary Theory introduces competing accounts of what literary study does. It helps make the assumptions behind a critical method explicit enough to contest.","s":false,"o":true},{"id":"added-vladimirnabokovpnin","d":"A narrator's treatment of a displaced scholar makes sympathy and narrative superiority hard to separate.","s":false,"o":true},{"id":"added-francineprosereadinglikeawriter","d":"Prose models attention to words and sentences, giving you a practical method to compare with larger critical systems.","s":false,"o":true},{"id":"765167","d":"Seven Types of Ambiguity follows multiple meanings into detailed readings. Its density asks you to distinguish an interpretation supported by wording from an ingenious association.","s":false},{"id":"added-cynthiaozickthemessiahofstockholm","d":"A critic's fantasy of literary descent turns interpretation into a story about legitimacy and longing.","s":false,"o":true},{"id":"872139","d":"Culture and Imperialism relates canonical narrative to imperial history. It broadens the evidence a reading may require while leaving you responsible for testing particular connections.","s":false},{"id":"added-noelcarrolloncriticism","d":"Carroll argues for evaluation as part of criticism, requiring you to distinguish a verdict from its supporting reasons.","s":false,"o":true},{"id":"13538977","d":"The Fun Stuff gathers Wood’s appreciations and judgements of prose. It offers concrete models for describing an admired writer without relying on generic praise.","s":false},{"id":"added-ritafelskiusesofliterature","d":"Recognition, enchantment and other reading experiences become subjects of analysis rather than embarrassments to critical rigor.","s":false},{"id":"80795","d":"Mimesis builds an account of literary representation through close readings across centuries. It is terminal because the argument’s large historical scale remains answerable to particular passages.","s":false}]},{"id":"erotics","group":"06 · Critical methods","title":"Desire, power and the reader","question":"What distinguishes depicting domination from endorsing it?","why":"This path asks what erotic writing does to its reader: whether it liberates, exploits or simply describes. Lawrence and Sacher-Masoch open with the classic cases; Miller, Sade and Nin write without restraint; Duras and Bataille push desire toward death and loss. Dworkin's Pornography is the strongest feminist case against; Carter's stories and her Sadeian Woman make a feminist case for reading Sade differently. Hold the two arguments against each other and against the scenes themselves, rather than settling the question in advance.","assignment":"Compare a scene in Nin or Miller with Carter’s account of the possibilities of erotic writing. Bring in one specific objection from Dworkin. Write 1,200 words.","criteria":"Quote the prose and reconstruct both critical positions fairly. Neither the author’s gender nor the presence of disturbing content can by itself settle what the writing does. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"276751","sources":[],"rungs":[{"id":"49583709","d":"Lady Chatterley’s Lover joins sexual desire to arguments about class, bodily life and modernity. It begins the comparison with a novel that makes its evaluative commitments unusually explicit.","s":false},{"id":"added-leopoldvonsachermasochvenusinfurs","d":"A relationship is organized through a fantasy made contractual, raising questions about who writes the script of desire.","s":false},{"id":"249","d":"Tropic of Cancer makes bodily experience and the writing self part of an expansive first-person performance. Read its handling of the reader beside Lawrence’s more directive voice.","s":false},{"id":"1499093","d":"A philosophical dialogue uses fictional instruction to join sexuality and power; compare the argument's form with its claims.","s":false},{"id":"815637","d":"Little Birds gathers Nin’s erotic stories. Their compressed scenes let you ask how character, atmosphere and narrative perspective alter the apparent function of an erotic premise.","s":false},{"id":"added-margueritedurasthelover","d":"Retrospective desire is inseparable from colonial setting and narrative self-construction.","s":false},{"id":"added-michelfoucaultthehistoryofsexualityvolume2","d":"A historical inquiry into ethical practices changes the question from what desire is to how conduct becomes an object of thought.","s":false,"o":true},{"id":"168425","d":"Henry and June presents diary material about desire and relationships. It supplies another genre of self-presentation to compare with Nin’s fiction, not a transparent key to it.","s":false,"o":true},{"id":"added-jeanettewintersonwrittenonthebody","d":"A narrator's unspecified gender pressures the assumptions a reader brings to the language of love and possession.","s":false,"o":true},{"id":"436806","d":"Story of the Eye moves through transgressive images and escalating associations. It tests what interpretive claims can be supported when plot yields to recurring objects and sensations.","s":false},{"id":"added-andreadworkinpornographymenpossessingwomen","d":"Dworkin offers a direct structural argument about representation and domination to place beside Carter's different account.","s":false},{"id":"added-angelacarterthebloodychamber","d":"Rewritten tales make inherited sexual scripts visible in their narrative machinery, before the terminal critical work.","s":false},{"id":"37530","d":"Erotism develops Bataille’s conceptual account of taboo and transgression. Read it after the fiction so the theory becomes a proposition to assess against a textual practice.","s":false},{"id":"added-simonedebeauvoirthesecondsexvolumeii","d":"Read the sections on love and lived experience; their analysis offers a contrasting account of freedom within intimate relations.","s":true,"o":true},{"id":"20175026","d":"Intercourse argues about sexual relations through literary and social analysis. Follow the particular claims and examples rather than importing a slogan attributed to Dworkin.","s":false,"o":true},{"id":"38123","d":"A legal and economic account of sexual regulation offers a framework sharply different from the literary critics' approaches.","s":false,"o":true},{"id":"added-georgesbatailleliteratureandevil","d":"Essays connect literary transgression to ethical experience, giving a critical counterpart to his fiction.","s":false,"o":true},{"id":"added-marquisdesadejustine","d":"Justine repeatedly places a virtuous protagonist within brutal systems of power. It supplies a primary text for assessing Carter’s interpretation; her discussion also concerns Juliette, which this shorter path does not pretend to cover fully.","s":false,"o":true},{"id":"276751","d":"The Sadeian Woman examines the possibilities and limits of Sade’s sexual politics. It is terminal as a critical argument you can test against primary texts, not a verdict the path requires you to accept.","s":false}]},{"id":"ethics","group":"07 · Philosophy and interpretation","title":"What could justify an action?","question":"Can rival moral vocabularies judge the same case fairly?","why":"Ethics asks what could ever make an action right. Le Guin's Omelas sets a thought experiment you'll return to. Aristotle, Kant and Mill give the three classic answers; Foot, Williams and Murdoch complicate them with nature, luck and attention; Scanlon offers a contemporary contractualism. Melville and Camus put the theories under pressure in fiction, with a sailor's hanging and an assassination. MacIntyre ends the path by arguing that the whole modern debate is broken. Build your own case first so you can test his claim against it.","assignment":"Invent a concrete case involving a promise and a preventable harm. Analyse it using Aristotle, Kant, Mill and Scanlon, then write 600 words on MacIntyre’s challenge to the comparison.","criteria":"Present each position in a form its defender could recognise. Identify a disputed premise rather than merely announce four different recommendations. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"18301598","sources":[],"rungs":[{"id":"53148","d":"Being Good introduces ethical questions without requiring a settled system. Use it to identify which kind of claim each later philosopher is trying to justify.","s":false,"o":true},{"id":"92625","d":"A short imagined society isolates the cost of collective happiness, then makes the reader's act of imagining part of the problem.","s":false},{"id":"19068","d":"The Nicomachean Ethics relates judgement to character, practice and flourishing. It establishes a vocabulary in which isolated acts are not the whole unit of moral assessment.","s":false},{"id":"added-philippafootnaturalgoodness","d":"Foot connects evaluation to forms of life, giving the virtue tradition a precise contemporary argument.","s":false},{"id":"added-immanuelkantgroundworkofthemetaphysicsofmorals","d":"Groundwork argues about moral obligation through reason, willing and universality. It provides a direct primary contrast with an ethics centred on cultivated character.","s":false},{"id":"added-hermanmelvillebillybuddsailor","d":"A fatal judgment places law, intention and institutional responsibility in conflict without making the conflict tidy.","s":false},{"id":"added-bernardwilliamsmoralluck","d":"Williams asks how outcomes and circumstances alter judgment of an agent, complicating the picture of a purely autonomous choice.","s":false},{"id":"added-johnstuartmillutilitarianism","d":"Utilitarianism defends a consequential account of morality and answers objections to it. It makes welfare central without reducing the argument to a crude slogan about numbers.","s":false},{"id":"added-albertcamusthejustassassins","d":"Revolutionaries debate the permissible limits of violence while having to act, giving moral consistency a lived cost.","s":false},{"id":"added-irismurdochthesovereigntyofgood","d":"Murdoch redirects ethics toward attention, a useful challenge to theories centered on discrete decisions.","s":false},{"id":"29378","d":"Practical Ethics applies a consequentialist approach to disputed cases. Compare what application adds to, or exposes in, the general argument of the preceding rung.","s":false,"o":true},{"id":"added-ianmcewanthechildrenact","d":"A judge's professional decision extends into another person's life, exposing the distance between a justified ruling and its consequences.","s":false,"o":true},{"id":"1482947","d":"Carefully specified cases test what rights permit and forbid, providing a contrast to the novels' densely particular situations.","s":false,"o":true},{"id":"11344912","d":"Intelligent Virtue returns to virtue through the analogy of practical skill. It offers a contemporary account to test against Aristotle rather than treating virtue ethics as only historical.","s":false,"o":true},{"id":"8806367","d":"Arguments about identity, time and future people stretch moral concern beyond the immediate case.","s":false,"o":true},{"id":"added-gustaveflaubertasimpleheart","d":"A life of service is narrated without an explicit moral verdict, making the reader's attention part of the ethical work.","s":false,"o":true},{"id":"278553","d":"What We Owe to Each Other develops a contractualist account of justification. It changes the question from aggregate outcome to principles people could reasonably reject.","s":false},{"id":"30272030","d":"Short applied arguments let you test how a systematic moral outlook handles ordinary public questions.","s":false,"o":true},{"id":"18301598","d":"After Virtue argues that contemporary moral disagreement reflects a fragmented inheritance. It closes the path by challenging whether the rival vocabularies have been compared on adequate terms.","s":false}]},{"id":"kant","group":"07 · Philosophy and interpretation","title":"Knowledge: from doubt to conditions","question":"What must be true for experience to count as knowledge?","why":"Modern philosophy of knowledge starts from doubt and ends by asking what makes experience possible at all. Read Descartes, Locke, Berkeley and Hume in order so you watch each answer the last. Miéville, Kafka and Lem dramatise the same problem: cities that ignore each other, a castle no one reaches, a signal no one can decode. Kant's Prolegomena is his own short guide, and Gardner is the critical companion. The Critique of Pure Reason ends the path. Reconstruct its arguments as premises before you judge them.","assignment":"Reconstruct one argument from the Transcendental Analytic in numbered premises. Add an 800-word objection and the strongest Kantian reply you can formulate.","criteria":"Cite the relevant A/B passage numbers. Distinguish an objection to a premise from an objection to the inference. State which step you remain uncertain about. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"19216297","sources":[],"rungs":[{"id":"31862","d":"Discourse on Method and Meditations on First Philosophy stages doubt and attempts to rebuild knowledge. Read the Meditations in full; the Discourse provides useful context rather than a second completion requirement.","s":false},{"id":"added-jennifernagelknowledgeaveryshortintroduction","d":"A concise account of contemporary epistemology clarifies the distinction between knowing, believing and having good reasons.","s":false,"o":true},{"id":"added-johnlockeanessayconcerninghumanunderstanding","d":"Read books II and IV on ideas and knowledge; the full-volume count marks the reference edition rather than the assigned scope.","s":true},{"id":"48989927","d":"The Philosopher’s Toolkit supplies methods for distinguishing arguments, concepts and common errors. Read the sections on argument reconstruction and conceptual distinctions as a practical opening selection.","s":true,"o":true},{"id":"added-georgeberkeleythreedialoguesbetweenhylasandphilonous","d":"A dialogue makes ordinary confidence in matter into something that has to be argued for.","s":false},{"id":"added-davidhumeanenquiryconcerninghumanunderstanding","d":"The Enquiry examines experience, causation and the limits of inference. Its questions give Kant’s claims a definite problem to answer.","s":false},{"id":"added-johndeweythequestforcertainty","d":"Dewey questions the aspiration to knowledge untouched by action, giving the course an alternative to foundational certainty.","s":false,"o":true},{"id":"added-chinamievillethecitythecity","d":"An investigation depends on trained perception, making what people may acknowledge seeing a social as well as epistemic problem.","s":false},{"id":"333538","d":"A man cannot establish the authority behind the signs he encounters; uncertainty becomes the condition of a life rather than a puzzle to solve.","s":false},{"id":"205218","d":"Ethics develops Spinoza’s system through definitions, axioms and propositions. Read Part I and Part II for this path, tracking how the form exposes dependencies between claims.","s":false,"o":true},{"id":"added-rogerscrutonkantaveryshortintroduction","d":"A compact map of Kant's project helps distinguish its major questions before the longer commentaries.","s":false,"o":true},{"id":"added-stanisawlemtheinvestigation","d":"A police inquiry makes statistical explanation compete with the desire for a culprit, testing what an adequate answer would look like.","s":false,"o":true},{"id":"added-immanuelkantprolegomenatoanyfuturemetaphysics","d":"The Prolegomena offers a shorter approach to Kant’s critical questions. Use it to locate the problem before attempting the more elaborate architecture of the Critique.","s":false},{"id":"added-adambeckerwhatisreal","d":"A history of disputes over quantum theory separates successful prediction from agreement about what a theory describes.","s":false,"o":true},{"id":"added-sebastiangardnerkantandthecritiqueofpurereason","d":"Gardner’s guide explains the organisation and arguments of the Critique. Consult the relevant chapter after your first attempt at the corresponding primary passage.","s":false},{"id":"added-stanisawlemhismastersvoice","d":"Scientists confront a possible message whose interpretation keeps exposing their own assumptions.","s":false},{"id":"80331","d":"Kant’s Transcendental Idealism supplies a developed interpretation of Kant’s position. Read the introduction and its treatment of the distinction between appearances and things in themselves; do not confuse this interpretation with an uncontested consensus.","s":false,"o":true},{"id":"added-beatricelonguenessekantandthecapacitytojudge","d":"A demanding account of judgment gives a specific route through the terminal work's conceptual machinery.","s":false,"o":true},{"id":"19216297","d":"Critique of Pure Reason asks about the conditions and limits of knowledge. The defined terminal scope is the Prefaces, Introduction, Transcendental Aesthetic and Transcendental Analytic; later sections remain a continuation, not silently counted as finished.","s":true}]},{"id":"hegel","group":"07 · Philosophy and interpretation","title":"Hegel: thinking through a failure","question":"How can a position generate its own revision?","why":"Hegel is hard, so this path approaches him through history and politics before the Phenomenology itself. Singer and Taylor give the overview; Reason in History shows Hegel's philosophy of history; Marx's German Ideology attacks it. Lampedusa's Leopard is the novel of a world that changes so it can stay the same. C. L. R. James and Buck-Morss bring Haiti's revolution into the story Hegel told about freedom. Stern and Pinkard are your guides for the Phenomenology itself. Read it slowly, alongside them.","assignment":"Reconstruct the movement from sense-certainty to perception in the Phenomenology in 1,000 words. Then compare that movement with one later passage on recognition.","criteria":"Explain why the first position changes on its own terms. Do not use thesis–antithesis–synthesis as a substitute for the actual steps. Mark where your reconstruction is tentative. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"9454","sources":[{"title":"The Phenomenology of Spirit — Cambridge","url":"https://www.cambridge.org/core/books/georg-wilhelm-friedrich-hegel-the-phenomenology-of-spirit/6FEDB42FDEF2E5FF97FEAE0EEEDABE8E","note":"Terry Pinkard’s translation in the Cambridge Hegel series."},{"title":"Robert Stern’s Routledge Guidebook","url":"https://www.routledge.com/The-Routledge-Guidebook-to-Hegels-Phenomenology-of-Spirit-1st-Edition/Stern-Gottlieb/p/book/9780203094198","note":"Companion to the primary text’s arguments and structure."},{"title":"Hegel and Modern Society — Cambridge University Press","url":"https://www.cambridge.org/core/books/hegel-and-modern-society/9A79DC64AB421AF8ECF6DEE0A353A298","note":"Taylor's study emphasizes Hegel's social and political thought and the relation of individual freedom to social life."}],"rungs":[{"id":"added-petersingerhegelaveryshortintroduction","d":"A concise orientation establishes the main stakes before the sequence enters Hegel's own exposition.","s":false},{"id":"added-terrypinkardgermanphilosophy17601860thelegacyofidealism","d":"Pinkard situates German idealism within philosophical and historical disputes. Read the Kant and Hegel chapters to understand the questions being inherited and transformed.","s":true,"o":true},{"id":"added-charlestaylorhegelandmodernsociety","d":"Taylor connects Hegel's account of agency to social membership, giving the political stakes a compact modern formulation.","s":false},{"id":"25242","d":"Reason in History offers an accessible encounter with Hegel’s claims about historical intelligibility. Treat the large assertions as problems whose justification still needs examination.","s":false},{"id":"9717","d":"Private choices unfold within a political history that keeps assigning them meanings their makers did not choose.","s":false,"o":true},{"id":"added-jonstewartthephenomenologyofspiritreader","d":"Use the essays on recognition as contrasting interpretations, not as a substitute for following Hegel's argument.","s":true,"o":true},{"id":"117249","d":"Introductory Lectures on Aesthetics relates art to thought and historical forms of life. It supplies a second concrete domain in which to recognise Hegel’s characteristic ambitions.","s":false,"o":true},{"id":"added-karlmarxandfriedrichengelsthegermanideology","d":"Read part I on Feuerbach; its materialist critique changes what counts as the motor of historical development.","s":true},{"id":"added-giuseppetomasidilampedusatheleopard","d":"An aristocratic household experiences political transformation through compromised continuity, questioning what historical change actually changes.","s":false},{"id":"added-clrjamestheblackjacobins","d":"A history of the Haitian Revolution makes freedom and universal claims answer to slavery and collective action.","s":false},{"id":"25248","d":"Elements of the Philosophy of Right develops freedom through institutions and ethical life. Read the Preface and Introduction, then the family and civil-society sections, as a defined comparison with the Phenomenology.","s":false,"o":true},{"id":"added-susanbuckmorsshegelhaitianduniversalhistory","d":"A provocative historical reading connects philosophical freedom to slavery; distinguish the evidence from the interpretation it enables.","s":false},{"id":"added-laszlokrasznahorkaithemelancholyofresistance","d":"A town's apparent order is destabilized by rumor and spectacle, offering a narrative of rupture that resists a simple historical law.","s":false,"o":true},{"id":"added-robertsterntheroutledgeguidebooktohegelsphenomenologyofspirit","d":"Stern’s guide follows the primary work’s principal arguments. Use it alongside the terminal reading, returning to the passage whenever a summary seems smoother than the text.","s":false},{"id":"added-terrypinkardhegelsphenomenologythesocialityofreason","d":"Pinkard frames self-consciousness through social practices, supplying a sustained interpretive thesis to test in the primary text.","s":false},{"id":"added-christinasteadthemanwholovedchildren","d":"A family governed by its father's self-image makes recognition and dependence painfully concrete.","s":false,"o":true},{"id":"added-axelhonnethfreedomsright","d":"A later argument about institutions and social freedom shows one way Hegel's questions remain active beyond his system.","s":false,"o":true},{"id":"added-hsharrishegelsladdervolumei","d":"A close commentary supports slow work on the opening stages of the Phenomenology; consult it after trying a section yourself.","s":false,"o":true},{"id":"9454","d":"Phenomenology of Spirit follows successive forms of consciousness and social experience through their tensions. Read the main text in full over time; the early assignment is a checkpoint, while this terminal tick signifies the complete work.","s":false}]},{"id":"nietzsche","group":"07 · Philosophy and interpretation","title":"Suspicion, values and self-overcoming","question":"What changes when a value is given a history?","why":"Nietzsche asks where values come from and whether they can be overcome. Start with The Birth of Tragedy and The Gay Science, then read Kierkegaard as the religious alternative. Beyond Good and Evil and the Genealogy carry the main argument; Gide and Rilke give it fictional form. Camus's Rebel pushes back. Leiter and Nehamas read Nietzsche in opposite ways, as a naturalist and as an artist of himself; take them as a debate. Zarathustra ends the path, Nietzsche's strangest book. Notice how its method differs from the Genealogy.","assignment":"Choose one speech from Thus Spoke Zarathustra and compare its method with an argument in On the Genealogy of Morals. Write 1,000 words.","criteria":"Separate what the speaker asserts from what the scene or image does. Reconstruct one claim plainly, then identify something that the plain paraphrase loses. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"51893","sources":[],"rungs":[{"id":"2823","d":"The Birth of Tragedy uses Greek art to formulate an early account of culture and experience. Read after the drama path if possible, so its claims can be tested against plays.","s":false},{"id":"added-friedrichnietzschethegayscience","d":"Experiments in tone and argument connect inquiry to a way of living, preparing the later challenge to inherited values.","s":false},{"id":"24965","d":"Fear and Trembling makes ethical and religious difficulty appear through a deliberately staged voice. It is a useful contrast for philosophical writing whose form complicates its propositions.","s":false},{"id":"added-friedrichnietzschehumanalltoohuman","d":"Aphoristic explanations of familiar ideals make the practice of suspicion visible at a small scale.","s":false,"o":true},{"id":"added-andregidetheimmoralist","d":"A narrator's liberation from convention becomes an interested account of what he owes other people.","s":false},{"id":"12321","d":"Beyond Good and Evil challenges philosophical assumptions through compressed arguments and provocation
