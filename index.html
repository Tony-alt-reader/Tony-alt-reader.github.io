s. Slow down wherever a rhetorical success seems to outrun the stated evidence.","s":false},{"id":"21031","d":"An explicitly invented encounter turns philosophy into personal drama; distinguish the novel's therapeutic scenario from historical evidence.","s":false,"o":true},{"id":"44512604","d":"A compact contemporary account asks what nihilism means beyond a mood or a synonym for pessimism.","s":false,"o":true},{"id":"80449","d":"On the Genealogy of Morals investigates moral concepts through stories of emergence and transformation. Its essays let you assess genealogy as an argument rather than a general attitude of suspicion.","s":false},{"id":"5954","d":"Two incompatible ways of living put artistic self-creation beside discipline and attachment.","s":false,"o":true},{"id":"added-friedrichnietzscheeccehomo","d":"Nietzsche's account of himself makes philosophical authority a performance that can be read critically rather than accepted as testimony.","s":false,"o":true},{"id":"added-brianleiternietzscheonmorality","d":"An interpretive argument about Nietzsche's critique of morality supplies claims precise enough to challenge with primary passages.","s":false},{"id":"43150","d":"Twilight of the Idols / The Anti-Christ brings late Nietzsche’s polemical method into concentrated form. Read both works, distinguishing a diagnosis from the evidence offered for it.","s":false,"o":true},{"id":"added-rainermariarilkethenotebooksofmaltelauridsbrigge","d":"A fragmented observing self tries to make experience into writing, a different form of transformation from philosophical declaration.","s":false},{"id":"added-irismurdochtheseathesea","d":"A self-dramatizing artist mistakes desire for insight, offering a narrative test of the rhetoric of exceptional freedom.","s":false,"o":true},{"id":"11990","d":"The Rebel examines rebellion and the possibility of limits. Its distance from Nietzsche’s forms supplies a contrasting account of what follows after inherited justifications are challenged.","s":false},{"id":"added-alexandernehamasnietzschelifeasliterature","d":"Nehamas connects style, interpretation and self-creation, providing a sustained reading to test before Zarathustra.","s":false},{"id":"added-hallebutlerthenewme","d":"A promised reinvention is trapped inside work and aspiration, giving self-overcoming a deliberately unheroic contemporary counterexample.","s":false,"o":true},{"id":"51893","d":"Thus Spoke Zarathustra makes philosophical claims pass through speeches, images and encounters. It ends the path because interpreting its mode of address matters as much as extracting a doctrine.","s":false}]},{"id":"mind","group":"07 · Philosophy and interpretation","title":"The self, from inside and outside","question":"Can a theory explain experience without explaining it away?","why":"Can consciousness be explained from the outside, or does it need a view from inside? Luria and Sacks give you real cases of minds altered by injury and music; Powers, Ishiguro, Egan and Dick turn them into fiction. Searle, Nagel and Kripke each argue that standard physicalist accounts leave something out; Watts imagines intelligence without consciousness at all. Dennett ends the path with the most ambitious attempt to explain consciousness away. Formulate the disagreement precisely before you decide who wins it.","assignment":"Compare Dennett and Nagel on what an explanation of consciousness must accomplish. In 1,200 words, formulate the disagreement, then use one case from Sacks to test its practical force.","criteria":"Distinguish a conceptual objection from empirical evidence. State what result would weaken each position, or explain precisely why the claim is not empirically testable. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"2069","sources":[],"rungs":[{"id":"10854371","d":"The Ego Trick introduces the self through philosophical questions and accounts of experience. It gives the path a concrete starting question without settling what sort of entity a self must be.","s":false,"o":true},{"id":"23719305","d":"An account of constructed emotion challenges familiar categories; treat it as a research program with competitors, not settled doctrine.","s":false,"o":true},{"id":"34667","d":"The Man with a Shattered World follows the consequences of a brain injury through clinical interpretation and personal record. It keeps lived experience in view as explanatory theories enter.","s":false},{"id":"added-richardpowerstheechomaker","d":"A neurological disturbance reorganizes relationships and recognition, asking what others require before they accept a person's self-account.","s":false},{"id":"58085250","d":"Clinical stories connect changes in experience to biological mechanisms, grounding questions about the self in particular cases.","s":false,"o":true},{"id":"1297985","d":"Musicophilia examines unusual relations between music, mind and neurological condition. Its cases give you material to distinguish description, causal explanation and interpretation.","s":false},{"id":"6334","d":"A narrator's ordinary recollections make the social recognition of a person more troubling than a simple definition of consciousness.","s":false},{"id":"123471","d":"I Am a Strange Loop develops an account of selfhood through patterns and self-reference. It connects a formal appetite to a claim about the person who has the experience.","s":false,"o":true},{"id":"added-gregeganpermutationcity","d":"Copies of minds inhabit a technical thought experiment about continuity; separate narrative possibility from a proof about identity.","s":false},{"id":"13809832","d":"A speculative evolutionary account of consciousness offers a sharply framed hypothesis about why experience matters.","s":false,"o":true},{"id":"3282","d":"Minds, Brains and Science presents Searle’s account of mental life and its relation to computation. It introduces a direct conceptual challenge for later comparisons.","s":false},{"id":"added-dondelillothebodyartist","d":"Grief and altered perception make the relation between a body and its narratable identity unusually unstable.","s":false,"o":true},{"id":"31856","d":"An argument for embodied concepts presses against theories that separate thought from the organism doing it.","s":false,"o":true},{"id":"257867","d":"The View From Nowhere examines the tension between subjective and objective standpoints. It helps specify what may remain unresolved when a theory describes a person entirely from outside.","s":false},{"id":"added-philipkdickascannerdarkly","d":"Surveillance and impaired self-recognition divide a person from his own activities, making epistemic access itself the plot.","s":false},{"id":"19071718","d":"A controversial historical hypothesis offers a case study in how far an explanation can travel beyond secure evidence.","s":false,"o":true},{"id":"276249","d":"Naming and Necessity investigates reference, possibility and identity. Read all three lectures, paying particular attention to how modal arguments bear on mind–body identity rather than treating this as another cognitive theory.","s":false},{"id":"added-ursulakleguinthelatheofheaven","d":"Dreams alter shared reality, turning another person's attempt to manage a mind into an ethical problem.","s":false,"o":true},{"id":"wc-watts-blindsight","d":"First-contact science fiction built on a serious claim: intelligence might work without consciousness, and consciousness might even be a handicap. Use it to sharpen the Dennett–Nagel disagreement right before you read Dennett.","s":false,"w":true},{"id":"2069","d":"Consciousness Explained offers Dennett’s sustained challenge to familiar pictures of consciousness. It is terminal as a substantial position to reconstruct and oppose carefully, not because the title announces a settled result.","s":false}]},{"id":"religion","group":"07 · Philosophy and interpretation","title":"Belief as argument and experience","question":"What would count as understanding someone else’s faith?","why":"Religion is argued about and lived, and this path keeps both in view. Augustine and Pascal give first-person faith; Robinson, Endō and O'Connor write belief and doubt as fiction. Mbiti widens the frame beyond the Abrahamic. Russell, Schellenberg and Oppy make the strongest philosophical case against; Wiesel stages a trial of God; Boyer offers a cognitive explanation. William James ends the path, treating religious experience as evidence to be examined. Keep testimony, explanation and argument apart as you read.","assignment":"Choose one kind of religious experience discussed by William James. Compare a first-person account with a naturalistic explanation and a philosophical challenge, in 1,000 words.","criteria":"Explain what each account is trying to establish. Do not assume that explaining a belief’s origin either proves or refutes its truth. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"28820","sources":[],"rungs":[{"id":"27037","d":"Confessions joins a life narrative to theological reflection. It opens the path with a believer’s retrospective construction of experience rather than an external definition of religion.","s":false},{"id":"68210","d":"A minister's letter joins theological reflection to family feeling, presenting faith as a practice of attention.","s":false},{"id":"449407","d":"Pensées gives belief, uncertainty and human limitation a fragmentary argumentative form. Reconstruct individual arguments before trying to make the fragments into a smooth system.","s":false},{"id":"added-grahamgreenethepowerandtheglory","d":"A compromised priest makes vocation difficult to equate with personal virtue or consistent conviction.","s":false,"o":true},{"id":"1191844","d":"An influential comparative account widens the course beyond its predominantly European starting points; question its generalizations.","s":false},{"id":"472025","d":"Why I Am Not a Christian and Other Essays presents philosophical and ethical objections to religion. It gives you explicit arguments to distinguish from broader cultural dislike.","s":false},{"id":"added-shusakuendosilence","d":"Belief is tested through suffering and interpretation, with no easy equivalence between public action and inward conviction.","s":false},{"id":"4286013","d":"Sociological observations of secular societies challenge claims that religion is necessary for ordinary social trust.","s":false,"o":true},{"id":"1074928","d":"Divine Hiddenness and Human Reason develops an argument from the problem of nonbelief. Its narrow focus makes the premises easier to examine than a general polemic.","s":false},{"id":"17942053","d":"An account of religion and cooperation makes empirical claims that can be distinguished from theology's own questions.","s":false,"o":true},{"id":"added-flanneryoconnorwiseblood","d":"A would-be rejection of religion retains its language and compulsions, complicating a clean division between belief and unbelief.","s":false},{"id":"1616613","d":"Arguing about Gods examines competing philosophical arguments with systematic attention. It broadens the comparison while keeping the burden of proof visible.","s":false},{"id":"3873","d":"A broad intellectual history gives changing conceptions of divinity a chronological frame, to be checked against primary voices.","s":false,"o":true},{"id":"11161","d":"Accusation and faith share a stage, making theological argument an encounter among people with unequal losses.","s":false},{"id":"2067","d":"Breaking the Spell proposes studying religion as a natural phenomenon. It changes explanatory level, making the difference between causal inquiry and theological argument important.","s":false,"o":true},{"id":"added-charlestaylorasecularage","d":"A large historical argument asks how belief became one possibility among others rather than simply disappearing.","s":false,"o":true},{"id":"786153","d":"Religion Explained examines recurrent features of religious cognition. Read its proposed mechanisms beside the diversity of practices and experiences represented elsewhere in the path.","s":false},{"id":"17427034","d":"A philosophical case against religion offers a clear position to compare with the lived experiences collected by James.","s":false,"o":true},{"id":"28820","d":"The Varieties of Religious Experience studies accounts of religious life with psychological and philosophical interest. It ends the path by asking what careful description can establish before a final metaphysical verdict.","s":false}]},{"id":"buddhist","group":"07 · Philosophy and interpretation","title":"Selfhood and emptiness","question":"What does denying an independent self actually deny?","why":"Buddhist philosophy argues that the self is a construction, and that seeing this frees you. The Dhammapada and Rahula give the early teaching; Gethin is the scholarly overview; Milinda's dialogues argue about selfhood with a king. Śāntideva and the Heart Sutra show the Mahāyāna turn; Ozeki makes it fiction. Siderits and Garfield read Buddhism as philosophy with analytic tools. Nāgārjuna ends the path with the hardest argument: that emptiness is not nothingness. Find out what exactly he denies before deciding if you agree.","assignment":"Reconstruct one argument about causation or self in Nāgārjuna’s Middle Way. Write 900 words distinguishing its target from the claim that nothing exists.","criteria":"Cite the verses and your translation. State a plausible objection and a reply using the text; distinguish dependent existence from an independent essence. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"added-nagarjunatranslatedbymarksideritsandshoryukatsuranagarjunasmiddleway","sources":[{"title":"Nāgārjuna’s Middle Way — Wisdom Publications","url":"https://wisdomexperience.org/product/nagarjunas-middle-way/","note":"The Siderits–Katsura translation with verse-by-verse commentary."},{"title":"Buddhism as Philosophy — Hackett","url":"https://hackettpublishing.com/buddhism-as-philosophy-second-edition","note":"Publisher details for Siderits’s introduction."}],"rungs":[{"id":"74657","d":"Buddhism: A Very Short Introduction supplies religious and historical orientation. It keeps the later arguments from floating free of the practices and problems in which they matter.","s":false,"o":true},{"id":"added-anonymousthedhammapada","d":"Short teachings about conduct and mind give the philosophical discussion a primary ethical vocabulary.","s":false},{"id":"added-rupertgethinthefoundationsofbuddhism","d":"A systematic introduction distinguishes historical traditions and doctrinal questions that a single label can conceal.","s":false},{"id":"added-walpolarahulawhatthebuddhataught","d":"What the Buddha Taught introduces central teachings through selected sources. It gives an accessible account of suffering, impermanence and non-self for later philosophical scrutiny.","s":false},{"id":"added-anonymousthequestionsofkingmilinda","d":"Dialogues use concrete analogies to examine personal continuity, making their argumentative moves available for scrutiny.","s":false},{"id":"added-santidevathebodhicaryavatara","d":"Ethical cultivation and arguments about the self meet in a text addressed to practice, not merely abstract explanation.","s":false},{"id":"added-osamutezukabuddhavolume1kapilavastu","d":"A manga retelling supplies an explicitly fictionalized life; compare its narrative motives with the doctrinal arguments.","s":false,"o":true},{"id":"added-bhikkhubodhieditorandtranslatorinthebuddhaswords","d":"In the Buddha’s Words arranges translated discourses by theme. Read the sections on the human condition, the path and wisdom as this rung’s defined primary-source selection.","s":true},{"id":"added-redpinetheheartsutra","d":"A translation and commentary unpack a short, difficult primary text; keep the commentary's interpretation distinct from the sutra.","s":false},{"id":"added-stephenbatchelorbuddhismwithoutbeliefs","d":"A modern secular interpretation makes a definite selection from the tradition, which the primary readings let you question.","s":false,"o":true},{"id":"added-ruthozekiataleforthetimebeing","d":"Interlinked readers and writers make time and interdependence part of a novel's construction rather than a detachable lesson.","s":false},{"id":"added-marksideritsbuddhismasphilosophy","d":"Buddhism as Philosophy reconstructs arguments from several Buddhist traditions. Use its distinctions to avoid treating all Buddhist thinkers as endorsing one undifferentiated view.","s":false},{"id":"added-tsangnyonherukathelifeofmilarepa","d":"Read this as religious life-writing with its own conventions of evidence and exemplary conduct, not a modern documented biography.","s":false,"o":true},{"id":"added-paulwilliamsandanthonytribebuddhistthought","d":"A historical survey follows changes in philosophical problems across Indian traditions, resisting the idea of one timeless doctrine.","s":false,"o":true},{"id":"added-petermatthiessenthesnowleopard","d":"Travel and mourning become an account of spiritual attention, offering a situated practice to compare with formal argument.","s":false,"o":true},{"id":"added-jaylgarfieldengagingbuddhism","d":"Engaging Buddhism brings Buddhist philosophy into contemporary philosophical conversation. It is a comparison to assess after meeting primary arguments, not a replacement for them.","s":false},{"id":"added-williamswaldronthebuddhistunconscious","d":"A study of the storehouse-consciousness tradition complicates any simple statement that Buddhism abolishes the mind or person.","s":false,"o":true},{"id":"added-ruthozekithebookofformandemptiness","d":"Objects, voices and bereavement make a narrative experiment in how persons depend on their surrounding world.","s":false,"o":true},{"id":"added-nagarjunatranslatedbymarksideritsandshoryukatsuranagarjunasmiddleway","d":"Nāgārjuna’s Middle Way examines dependent arising and the instability of claims to intrinsic nature. Its verse-by-verse commentary supports a slow terminal reading in which each argument needs reconstruction.","s":false}]},{"id":"islamic","group":"07 · Philosophy and interpretation","title":"Reason, revelation and interpretation","question":"Who has the authority to interpret a difficult text?","why":"Classical Islamic thought staged one of philosophy's great arguments: whether reason or revelation has the last word, and whether causes are real. Berkey gives the history; al-Ghazālī's autobiography and Ibn Tufayl's philosophical novel set out the stakes. The Incoherence of the Philosophers attacks; Ibn Rushd's Decisive Treatise and Incoherence of the Incoherence reply. Ibn Khaldun and Hodgson widen the frame to history and civilisation; Pamuk and Ahmed bring the question into modern Istanbul and theory. Reconstruct both sides fairly.","assignment":"Reconstruct al-Ghazālī’s discussion of causation and Ibn Rushd’s response in 1,200 words.","criteria":"Identify the specific claim each rejects. Distinguish logical necessity, observed regularity and theological commitment. Quote both texts and resist treating the dispute as science versus religion. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"added-ibnrushdtheincoherenceoftheincoherence","sources":[{"title":"What Is Islam? — Princeton, Near Eastern Studies","url":"https://nes.princeton.edu/publications/what-islam-importance-being-islamic","note":"Introduction to Ahmed's argument against reducing Islam to law, scripture or a single analytic category."}],"rungs":[{"id":"added-jonathanpberkeytheformationofislam","d":"A social and religious history supplies the institutional setting in which intellectual traditions took shape.","s":false},{"id":"142120","d":"Islamic Philosophy from its Origin to the Present gives a broad account from a particular interpretive standpoint. Use it as orientation while noting its author's organising commitments.","s":false,"o":true},{"id":"added-abuhamidalghazalideliverancefromerror","d":"Al-Ghazali's account of his intellectual crisis gives his later critique a self-presented history to assess.","s":false},{"id":"added-ibntufaylhayyibnyaqzan","d":"Hayy Ibn Yaqzan follows a solitary thinker’s search for understanding. Its philosophical fiction makes the relation between independent inquiry and inherited teaching concrete.","s":false},{"id":"added-muhammadiqbalthereconstructionofreligiousthoughtinislam","d":"A modern philosophical intervention reopens the relation between inherited interpretation and changing knowledge.","s":false,"o":true},{"id":"142395","d":"A manuscript's imagined history connects intellectual authority to political contingency and the stories later told around a text.","s":false,"o":true},{"id":"added-abuhamidalghazalitheincoherenceofthephilosophers","d":"The Incoherence challenges claims associated with the philosophers. Read the introduction and Discussion 17 on causation as the defined scope, reconstructing the argument before consulting the response.","s":true},{"id":"added-cliffordgeertzislamobserved","d":"A short comparative study distinguishes local religious styles, challenging explanations that make doctrine alone determine practice.","s":false,"o":true},{"id":"11692","d":"An investigation into identity becomes an investigation into other people's stories, making interpretation an existential activity.","s":false},{"id":"added-ibnrushdthedecisivetreatise","d":"The Decisive Treatise argues about philosophy, religious law and interpretation. It supplies a concise account of who may interpret and what demonstration is supposed to establish.","s":false},{"id":"added-ibnkhaldunthemuqaddimah","d":"Read the introductory discussion of historical method and the sections on group solidarity; the full volume remains a reference.","s":true},{"id":"added-lailalalamithemoorsaccount","d":"An imagined account by a subordinated witness contests the authorized record of an expedition and its meanings.","s":false,"o":true},{"id":"23006167","d":"Misquoting Muhammad examines the choices and disputes involved in interpreting prophetic traditions. It shifts the question of authority into the transmission and use of sources.","s":false,"o":true},{"id":"added-marshallgshodgsontheventureofislamvolume1","d":"A broad historical framework distinguishes a religious tradition from the societies and cultures associated with it.","s":false},{"id":"22238025","d":"Reasoning with God develops a contemporary account of religious reasoning and law. Read it as a defended position within an argument, not as a neutral summary of Islam.","s":false,"o":true},{"id":"added-alaaalaswanytheyacoubianbuilding","d":"One building contains conflicting routes to authority, belonging and religious commitment in modern Cairo.","s":false,"o":true},{"id":"1458748","d":"Islam and Secularism offers a critical account of secularisation and knowledge. Its conceptual commitments create a useful comparison with the different interpretive ambitions earlier in the path.","s":false,"o":true},{"id":"added-shahabahmedwhatisislam","d":"Ahmed argues against narrowly defining Islam through law alone, supplying a demanding conceptual challenge before Ibn Rushd.","s":false},{"id":"added-ibnrushdtheincoherenceoftheincoherence","d":"The Incoherence of the Incoherence replies directly to al-Ghazālī. Read the response to Discussion 17 and its quoted material as this terminal selection; the rest is a later extension of the dispute.","s":true}]},{"id":"theory","group":"07 · Philosophy and interpretation","title":"How categories acquire power","question":"What changes when a familiar category gets a history?","why":"Categories like madness, sexuality, race and taste can look natural until you trace how they were made. Barthes reads everyday myths; Saramago imagines the archive of names; Goffman studies how people present themselves. Foucault traces discipline and sexuality as historical inventions; Berger and Luckmann and Wagner explain how societies build reality. Whitehead and Beatty satirise race as category. Bourdieu's Distinction ends the path with taste as a social weapon. Apply it to a category you use every day.","assignment":"Choose one category used by an institution you know. Write 1,200 words distinguishing a Foucauldian question about its history from a Bourdieusian question about its social distribution.","criteria":"Use one claim from each thinker accurately. Name evidence you would need and a finding that would challenge your account. Do not claim to have written a history from personal impressions alone. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"80336","sources":[],"rungs":[{"id":"51715","d":"Mythologies reads everyday cultural objects as vehicles of social meaning. Its short essays make the critical operation visible enough to imitate and challenge.","s":false},{"id":"69984","d":"Further essays extend the question of how signs work beyond the everyday examples in Mythologies.","s":false,"o":true},{"id":"156224","d":"Semiotics: The Basics introduces distinctions for analysing signs and interpretation. Use it to give precise names to operations you have already seen in Barthes.","s":false,"o":true},{"id":"10518","d":"A systematic treatment of signs and interpretation provides a contrasting method to Barthes's shorter interventions.","s":false,"o":true},{"id":"19281211","d":"A minor records official pursues one person's life beyond the archive's categories, exposing what a complete register cannot know.","s":false},{"id":"18965049","d":"Madness and Civilization examines changing ways of distinguishing and managing madness. Read this version with awareness that it is abridged from a larger work; assess its actual claims and examples.","s":false,"o":true},{"id":"931984","d":"Social interaction is analyzed as managed presentation, giving the later arguments about identity a concrete observational scale.","s":false},{"id":"added-colsonwhiteheadtheintuitionist","d":"A professional dispute over inspection becomes an inquiry into race, evidence and institutional credibility.","s":false},{"id":"80369","d":"Discipline and Punish analyses punishment and disciplinary institutions. Its movement between descriptions and general claims lets you examine how historical evidence supports a conceptual argument.","s":false},{"id":"1875","d":"The History of Sexuality, Volume 1 challenges a familiar narrative of repression. Follow the distinction between suppressing speech and producing organised forms of knowledge about sexuality.","s":false},{"id":"added-peterlbergerandthomasluckmannthesocialconstructionofreality","d":"A sociological argument traces how shared practices acquire the force of an apparently external reality.","s":false},{"id":"2764921","d":"An anthropological account of how descriptions construct their objects makes the observer's own categories part of the inquiry.","s":false},{"id":"added-chankoonchungthefatyears","d":"A missing stretch of public memory turns consensus into a problem of collective knowledge and sanctioned forgetting.","s":false,"o":true},{"id":"added-paulbeattythesellout","d":"Satire pushes racial and civic categories into contradictions that sober classification can conceal.","s":false},{"id":"232743","d":"The Archaeology of Knowledge attempts to articulate a method for analysing discursive formations. It belongs after concrete studies so you can ask whether its vocabulary clarifies what those studies do.","s":false,"o":true},{"id":"added-leonoracarringtonthehearingtrumpet","d":"An institution for older women becomes a fantastic struggle over who controls the available account of reality.","s":false,"o":true},{"id":"37328","d":"The Consumer Society examines consumption as a system of signs and differentiation. It shifts the comparison from discipline to the social meanings attached to goods.","s":false,"o":true},{"id":"119561","d":"A historical argument about systems of knowledge broadens the earlier institutional studies; treat its periodizations as claims to assess.","s":false,"o":true},{"id":"80336","d":"Distinction studies the social distribution and judgement of taste. It ends the path with a sustained empirical and theoretical account against which your own habits of cultural classification can be tested.","s":false}]},{"id":"psychoanalysis","group":"07 · Philosophy and interpretation","title":"A subject divided by its own words","question":"What would make an interpretation more than a persuasive story?","why":"Psychoanalysis claims that the self is divided by what it cannot say. Jensen's Gradiva and Hoffmann's Sandman are the stories Freud analysed; The Interpretation of Dreams, The Uncanny and Beyond the Pleasure Principle are his central theories. Hedayat and Thomas bring them into fiction. Saussure provides the theory of language that Lacan built on; Fink is your guide to Lacan; Forrester weighs the evidence for and against Freud. Écrits ends the path. Separate each claim's evidence from its assumptions.","assignment":"Reconstruct one interpretation from Freud and one claim about the subject from Lacan. In 1,000 words, separate their evidence, assumptions and inferential steps.","criteria":"Offer an alternative account of the same material. Explain what could discriminate between the accounts and what the texts leave unresolved. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"75485","sources":[],"rungs":[{"id":"added-sigmundfreudintroductorylecturesonpsychoanalysis","d":"The Introductory Lectures presents Freud’s problems and methods in an expository form. It is a more workable first encounter than an isolated technical claim.","s":false,"o":true},{"id":"added-wilhelmjensengradiva","d":"A story that Freud interpreted lets you compare the literary object with the analyst's account rather than inherit the latter alone.","s":false},{"id":"93981","d":"The Interpretation of Dreams develops an account of dream-work through examples and analysis. Read Chapters II, VI and VII as the defined selection, keeping observation distinct from interpretation.","s":true},{"id":"added-etahoffmannthesandman","d":"A familiar source for Freud's uncanny becomes a primary object whose narrative ambiguities need not obey his explanation.","s":false},{"id":"added-petergayfreudalifeforourtime","d":"A large biography reconstructs the intellectual and institutional setting in which psychoanalysis developed.","s":false,"o":true},{"id":"97751","d":"The Uncanny connects aesthetic experience with psychoanalytic interpretation. Its literary examples make a direct bridge from clinical claims to reading practices.","s":false},{"id":"45967","d":"Repetition and unstable narration invite interpretation while making any single explanatory key difficult to defend.","s":false},{"id":"added-jeanlaplancheandjeanbertrandpontalisthelanguageofpsychoanalysis","d":"Use entries on terms encountered in the primary texts; the displayed count is the whole reference volume, not a cover-to-cover assignment.","s":true,"o":true},{"id":"added-sigmundfreudbeyondthepleasureprinciple","d":"Beyond the Pleasure Principle extends Freud’s theory through difficult speculative claims. It is useful for examining exactly where a theory moves beyond the evidence that introduced it.","s":false},{"id":"added-dorislessingthegoldennotebook","d":"A writer divides experience among incompatible notebooks, making psychic unity a formal problem rather than a given.","s":false,"o":true},{"id":"33132777","d":"A history of psychoanalysis after Freud shows how its concepts changed with political and institutional circumstances.","s":false,"o":true},{"id":"added-ferdinanddesaussurecourseingenerallinguistics","d":"Course in General Linguistics introduces the sign and language as a system of differences. Read the Introduction and Part I as the language-theory selection needed for the later comparison.","s":true},{"id":"added-stephenamitchellandmargaretjblackfreudandbeyond","d":"A history of competing clinical schools prevents the course from treating psychoanalysis as one unchanging theory.","s":false,"o":true},{"id":"added-dmthomasthewhitehotel","d":"An invented psychoanalytic case makes interpretation confront a later history it cannot securely anticipate.","s":false},{"id":"35133410","d":"The Lacanian Subject reconstructs major Lacanian distinctions. Consult it during the following two rungs, checking whether a paraphrase remains answerable to the primary passage.","s":false},{"id":"added-johnforresterdispatchesfromthefreudwars","d":"Essays examine disputes about evidence and Freud's reputation, keeping questions of truth within the course.","s":false},{"id":"added-jacqueslacanthefourfundamentalconceptsofpsychoanalysis","d":"Seminar XI presents Lacan’s account through spoken lectures on major concepts. It provides an extended setting for claims that become much more compressed in the essays.","s":false},{"id":"added-jeanmichelquinodozreadingfreud","d":"A chronological guide offers help with the primary corpus; consult the relevant chapter after forming your own account.","s":false,"o":true},{"id":"75485","d":"Écrits gathers dense theoretical essays. The defined terminal selection is The Mirror Stage, The Function and Field of Speech and Language, and The Instance of the Letter; select an edition containing all three.","s":true}]},{"id":"political","group":"08 · Power and institutions","title":"What makes authority legitimate?","question":"Which freedoms can institutions protect, and which can they threaten?","why":"What makes power legitimate? Plato and Aristotle start the argument; Hobbes, Locke and Rousseau answer with the social contract; Mill adds liberty; Schmitt argues that politics is about friends and enemies. Zamyatin's We imagines a state that has solved the question too well. Rawls and Nozick end the path with the two great modern theories of justice, one built on fairness, the other on rights. Defend the position you reject before you decide.","assignment":"Compare Rawls and Nozick on a concrete distribution of housing or education. Write 1,200 words and include a 300-word defence of the position you ultimately reject.","criteria":"Make the case genuinely difficult: specify institutions and initial conditions. Identify the premise on which the disagreement turns, rather than calling one side fair and the other selfish. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"479572","sources":[],"rungs":[{"id":"30289","d":"The Republic investigates justice through the construction of a city and an account of the soul. Your earlier Plato reading makes this a natural starting point for comparing political justifications.","s":false},{"id":"added-alexisdetocquevilledemocracyinamerica","d":"A comparative account of democratic life connects formal institutions to habits and associations.","s":false,"o":true},{"id":"19083","d":"Politics examines constitutions, citizenship and the purposes of political association. Read Books I, III and IV as the defined selection, including the exclusions built into its conception of citizenship.","s":true},{"id":"added-chrismullinaverybritishcoup","d":"An elected government's room to act is constrained by entrenched power, separating formal legitimacy from effective control.","s":false,"o":true},{"id":"added-thomashobbesleviathan","d":"Leviathan develops an argument for political authority through an account of conflict and security. Read Parts I and II, tracking the transition from a problem to the powers assigned to a solution.","s":false},{"id":"76171","d":"A citizen narrates a world that has made order into a total moral vocabulary, testing the language of consent.","s":false},{"id":"added-johnlockesecondtreatiseofgovernment","d":"The Second Treatise argues about property, consent and limits on government. It offers a direct contrast in what political authority must justify.","s":false},{"id":"279245","d":"Schmitt's friend-enemy distinction offers a stark challenge to liberal accounts of politics; examine what it excludes.","s":false},{"id":"added-jeanjacquesrousseauthesocialcontract","d":"The Social Contract asks how collective authority can be reconciled with freedom. Its distinctions between kinds of will need reconstruction rather than substitution with a slogan about democracy.","s":false},{"id":"299215","d":"Hayek argues about the political risks of centralized planning, giving the course a consequential thesis to assess precisely.","s":false,"o":true},{"id":"added-johnstuartmillonliberty","d":"On Liberty defends limits on social and political interference. It brings informal coercion into a debate often framed only around the state.","s":false},{"id":"703","d":"An alternate political history is experienced through a family's shrinking options, changing the scale of institutional argument.","s":false,"o":true},{"id":"112736","d":"Rationalism in Politics questions the ambition to organise political life through abstract technical plans. It adds a conservative argument about practical knowledge rather than a caricature of opposition to change.","s":false,"o":true},{"id":"9670246","d":"A critique of liberalism's historical exclusions presses on the distance between universal language and restricted membership.","s":false,"o":true},{"id":"240592","d":"The Open Society and Its Enemies criticises forms of political and historical certainty. Read its arguments against Plato alongside the Republic, keeping interpretation and rebuttal separate.","s":false,"o":true},{"id":"36684085","d":"An imagined victorious fascist order contains competing stories about history, exposing the contingency behind claims of inevitability.","s":false,"o":true},{"id":"129237","d":"A Theory of Justice develops principles through a constructed situation of choice. Follow the reasoning behind the principles before moving to objections about holdings and entitlement.","s":false},{"id":"17075739","d":"A defense of institutionalized disagreement offers an alternative to treating political conflict as a defect that consensus can eliminate.","s":false,"o":true},{"id":"479572","d":"Anarchy, State, and Utopia challenges patterned distributions and defends a limited state. It ends the path as a sustained opponent for Rawls whose actual argument must survive your reconstruction before you judge it.","s":false}]},{"id":"capital","group":"08 · Power and institutions","title":"Capital, value and exchange","question":"What exactly is being explained when economists explain value?","why":"Economics started as moral and political philosophy. Heilbroner gives the overview; Veblen and Weber explain consumption and work ethic; Smith and Marx give rival accounts of value; Keynes rethinks the whole system after the Depression. Zola and Tressell put money and labour into fiction. Heinrich is your guide to Capital. Polanyi ends the path by asking what happens when markets are separated from society. Reconstruct each argument in its own terms before comparing them.","assignment":"Reconstruct one argument about value or production from Smith and one from Marx. Then use Polanyi to formulate a question neither argument alone answers. Write 1,200 words.","criteria":"Define the key terms as each author uses them. Cite the relevant chapters and distinguish a theoretical claim from a claim about a particular historical economy. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"53981","sources":[{"title":"The Jungle — Penguin Random House","url":"https://www.penguinrandomhouse.com/books/292280/the-jungle-by-upton-sinclair-introduction-by-ronald-gottesman/","note":"Publisher record for the novel of immigrant labor and Chicago's meatpacking industry."}],"rungs":[{"id":"82120","d":"Intellectual portraits introduce the problems economists thought they were solving, before you evaluate their primary arguments.","s":false},{"id":"164019","d":"The Theory of the Leisure Class analyses status and consumption through social display. It offers an accessible opening in which economic conduct is inseparable from social meaning.","s":false},{"id":"41681","d":"An immigrant worker's wages, housing and bodily risks turn an abstract labor market into a sequence of constrained choices.","s":false,"o":true},{"id":"25698","d":"The Wealth of Nations examines production, exchange and institutions. Read Book I and Book IV, Chapters I–II as the defined selection, keeping the division of labour distinct from later slogans about markets.","s":true},{"id":"added-emilezolamoney","d":"Financial speculation circulates through a society of interested observers, making credit both a material mechanism and a narrative promise.","s":false},{"id":"added-adamsmiththetheoryofmoralsentiments","d":"The Theory of Moral Sentiments examines judgement, sympathy and the imagined spectator. It complicates a one-dimensional picture of the person assumed by economic reasoning.","s":false,"o":true},{"id":"947848","d":"A history of collective experience challenges accounts that treat labor only as an input or an aggregate category.","s":false,"o":true},{"id":"13328339","d":"An Introduction to the Three Volumes of Karl Marx’s Capital gives a structured interpretation of Marx’s categories. Read alongside the primary work, checking the guide’s claims against the cited passages.","s":false},{"id":"56083","d":"Organizing a strike becomes a conflict between immediate lives and a cause, complicating a simple story of class interests.","s":false,"o":true},{"id":"added-theodoredreiserthefinancier","d":"A career in finance entangles institutional opportunity with personal calculation, asking what a market rewards.","s":false,"o":true},{"id":"325785","d":"Capital, Volume 1 examines commodities, labour, production and accumulation. Read the full volume, allowing extra time for the opening chapters instead of treating them as a representative substitute for the whole.","s":false},{"id":"4183437","d":"A critical account of crisis explanations makes disagreement among economic frameworks explicit.","s":false,"o":true},{"id":"303615","d":"The General Theory examines output, employment and monetary economies. Read Chapters 1–3, 8–13, 18 and 24 as a first selected engagement; these are not a substitute for a technical macroeconomics course.","s":true},{"id":"added-roberttresselltheraggedtrouseredphilanthropists","d":"Workers discuss the system that organizes their wages while continuing to live inside its everyday constraints.","s":false},{"id":"41589","d":"The Affluent Society questions the relationship between private prosperity and public provision. It moves the comparison toward the social priorities embedded in an economic order.","s":false,"o":true},{"id":"8483806","d":"Weber offers a cultural-historical explanation to compare with the material mechanisms emphasized by the earlier economists.","s":false},{"id":"30265353","d":"The Origin of Capitalism argues for a historically specific account of capitalist social relations. Its explanation provides a contestable bridge between theory and historical transition.","s":false,"o":true},{"id":"4989357","d":"An account of capitalist development and political change complicates the relation between economic dynamism and institutional survival.","s":false,"o":true},{"id":"53981","d":"The Great Transformation examines the political construction of market society. It ends the path by asking how economic arrangements become embedded in, and disruptive of, social life.","s":false}]},{"id":"inequality","group":"08 · Power and institutions","title":"Who creates value, who receives it?","question":"How do you turn an account of inequality into a testable claim?","why":"Who creates value, and who captures it? Chang, Harvey and Desmond open with critiques of current capitalism; Mazzucato and Mattei trace how value and austerity are defined; Kelton argues for a different view of public money; Banerjee and Duflo test policy against field evidence. Mistry's novel shows inequality at human scale. Slobodian traces the market radicals. Piketty ends the path with the largest historical data set of them all. Audit his evidence carefully, and look for economists who read the same data differently.","assignment":"Choose one central empirical claim in Capital in the Twenty-First Century. Write a 1,000-word audit of its measure, evidence and inference, then compare a policy implication with one earlier book.","criteria":"Identify the population and period the evidence actually covers. State an alternative explanation and what additional evidence would help distinguish it. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"35899071","sources":[],"rungs":[{"id":"13507277","d":"23 Things They Don’t Tell You about Capitalism challenges familiar economic assumptions through short arguments. Use one chapter to practise extracting a claim and the evidence it needs.","s":false},{"id":"added-aravindadigathewhitetiger","d":"An entrepreneur explains his ascent in an interested voice, making mobility difficult to equate with merit or innocence.","s":false,"o":true},{"id":"183033","d":"A Brief History of Neoliberalism offers a historical interpretation of policy change and class power. Track where the evidence supports a particular event and where it supports a general mechanism.","s":false},{"id":"61358638","d":"A concise structural argument asks who benefits from poverty, providing claims that can be compared with the novels' transactions.","s":false},{"id":"added-bettysmithatreegrowsinbrooklyn","d":"A child's education and household budget make opportunity a material problem distributed across a family.","s":false,"o":true},{"id":"29502362","d":"The Value of Everything questions the categories through which economic value is recognised. It makes definitions and accounting conventions central to the political argument.","s":false},{"id":"141310682","d":"An argument for limits on extreme wealth adds a normative question to explanations of how unequal holdings arise.","s":false,"o":true},{"id":"60557026","d":"The Capital Order studies austerity as a political and institutional project. Its historical focus allows a more bounded test than sweeping assertions about all fiscal restraint.","s":false},{"id":"60194162","d":"A contemporary coming-of-age story links deprivation to institutions and markets, without granting its narrator an economist's overview.","s":false,"o":true},{"id":"17625214","d":"Stiglitz argues that rules and political choices shape economic distribution; specify the mechanism rather than only the verdict.","s":false,"o":true},{"id":"45992293","d":"The Deficit Myth presents an account of public finance from a modern monetary theory perspective. Read it as a position with assumptions about monetary sovereignty and constraints, not as an unconditional claim about every government.","s":false},{"id":"added-elizabethbowenthedeathoftheheart","d":"A dependent young observer enters an affluent household, revealing what money cannot make explicit about belonging and power.","s":false,"o":true},{"id":"10245602","d":"Poor Economics uses empirical studies to examine poverty and intervention. It brings questions of causal identification and local context into contact with the broader structural arguments.","s":false},{"id":"29502567","d":"A critique of upper-middle-class opportunity protection shifts attention from billionaires to ordinary mechanisms of advantage.","s":false,"o":true},{"id":"30209229","d":"The Production of Money examines monetary institutions and political choices. It supplies another account of finance to compare with both Kelton and the historical rungs.","s":false,"o":true},{"id":"added-rohintonmistryafinebalance","d":"Lives brought together by economic necessity expose the interaction of caste, work and political power beyond an income measure alone.","s":false},{"id":"60784541","d":"Crack-Up Capitalism follows projects that seek market freedom through enclaves and special jurisdictions. It gives the relation between markets and states a concrete institutional geography.","s":false},{"id":"205062721","d":"Reporting on special jurisdictions makes the geography of wealth concrete before the terminal account of long-run distribution.","s":false,"o":true},{"id":"35899071","d":"Capital in the Twenty-First Century analyses patterns of wealth and income across long historical spans. It is terminal because assessing its argument requires separating measurement, historical interpretation and policy judgement.","s":false}]},{"id":"feminism","group":"08 · Power and institutions","title":"Who does the work of freedom?","question":"How do private arrangements become public structures?","why":"Freedom depends on work that often goes unseen: childcare, housework, emotional labour. Beauvoir opens the question; Atwood and Chopin dramatise it; Delphy, Mies and Federici analyse housework and the body as economic facts. Berlant explains attachment to ways of living that harm us. Walker, Russ and Hull's anthology bring race, class and imagined futures into the argument. Butler ends the path by questioning the category of gender itself. Choose one everyday institution and follow it through each book.","assignment":"Choose one everyday institution, such as childcare, paid employment or marriage. Write 1,200 words comparing how three authors explain its reproduction and propose change.","criteria":"Distinguish description, causal explanation and normative claim. Give one practical tension between the proposals and support it with the texts rather than a generic objection. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"85767","sources":[],"rungs":[{"id":"21124","d":"Le deuxième sexe, I examines the histories and frameworks through which woman has been constituted as other. This export entry covers volume I; the second volume is a separate continuation.","s":false},{"id":"133445","d":"A woman's changing relation to food makes ordinary expectations about work and marriage strange and bodily.","s":false},{"id":"1964542","d":"Close to Home analyses women’s oppression through material relations in the household. It makes domestic organisation part of an economic argument.","s":false},{"id":"added-marilynfrenchthewomensroom","d":"Women's conversations and changing relationships make collective interpretation part of the novel's form.","s":false,"o":true},{"id":"1764209","d":"Mies connects gendered labor to global accumulation, giving a structural claim to test against different households and settings.","s":false},{"id":"56650197","d":"Caliban and the Witch connects the making of capitalism to gendered violence and reproductive labour. Treat its historical connections as claims to inspect, not consequences guaranteed by the framework.","s":false},{"id":"58345","d":"A woman's pursuit of autonomy conflicts with available social roles, without providing an uncomplicated liberation narrative.","s":false},{"id":"17574997","d":"An account of tensions between two traditions clarifies why their explanatory priorities sometimes conflict.","s":false,"o":true},{"id":"11347563","d":"Cruel Optimism studies attachments to ways of living that may impede flourishing. It adds a vocabulary for why material arrangements can retain emotional force even when they disappoint.","s":false},{"id":"52892857","d":"Letters build a voice through relationships, making bodily autonomy and economic independence inseparable from narration.","s":false},{"id":"18813642","d":"Essays make inconsistency and popular culture objects of feminist judgment, a contrasting scale to systematic theory.","s":false,"o":true},{"id":"36687229","d":"Hood Feminism examines needs and exclusions that can disappear from prominent feminist agendas. It tests the practical scope of the categories used earlier in the path.","s":false,"o":true},{"id":"56155135","d":"An argument connecting trans life to material institutions expands the course beyond representation alone.","s":false,"o":true},{"id":"added-joannarussthefemaleman","d":"Contrasting worlds let gender arrangements become variables in a formally disruptive novel.","s":false},{"id":"60979214","d":"They Call It Love examines the organisation and politics of emotional life. It extends the discussion of work beyond tasks usually recognised as labour.","s":false,"o":true},{"id":"28522800","d":"A foundational collection in Black women's studies challenges the exclusions produced by treating either race or gender as sufficient alone.","s":false},{"id":"36424668","d":"Revolting Prostitutes argues about sex work through labour, law and the experiences of workers. Read it beside the erotic-writing path to distinguish conditions of production from the interpretation of a text.","s":false,"o":true},{"id":"added-hollylewisthepoliticsofeverybody","d":"A materialist account of queer politics asks how sexual and gender categories interact with class without reducing one to the other.","s":false,"o":true},{"id":"85767","d":"Gender Trouble examines the making and repetition of gender categories. It ends the path as a conceptual challenge to how a political subject is defined, to be tested against the material accounts already read.","s":false}]},{"id":"empire","group":"08 · Power and institutions","title":"Empire and the authority to describe","question":"How do representations become part of rule?","why":"Empire depended on the power to describe other people. Césaire and Fanon open with the anticolonial critique; Forster's Passage to India shows the British view from inside. Maalouf turns the Crusades around; Hochschild and Kinzer document empire's violence in the Congo and Iran; Mishra traces the intellectual response across Asia. Irwin argues against Said's thesis; Nguyen's Sympathizer turns the gaze back on America. Said's Orientalism ends the path. Test one of its claims against the history you've read.","assignment":"Choose one tightly bounded claim from Orientalism and compare it with evidence in one history earlier in the path. Write 1,200 words.","criteria":"Represent Said’s actual claim at the right scale. Include evidence that supports it and evidence that complicates it. Distinguish disagreement about examples from disagreement about method. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"23300798","sources":[],"rungs":[{"id":"86598","d":"Discourse on Colonialism makes a concentrated indictment of colonial civilisation. Its rhetoric is worth analysing alongside its claims about violence and moral self-description.","s":false},{"id":"added-timothymoaninsularpossession","d":"A colonial world is assembled through journalists, documents and commerce, making mediation part of the imperial encounter.","s":false,"o":true},{"id":"274392","d":"Black Skin, White Masks examines racialisation through language, experience and psychoanalytic argument. It brings the subject’s relation to representation into the centre of the path.","s":false},{"id":"added-emforsterapassagetoindia","d":"An accusation reorganizes personal relationships through colonial institutions, making goodwill insufficient to dissolve power.","s":false},{"id":"64533","d":"The Crusades Through Arab Eyes retells encounters through Arabic historical accounts. It makes source selection a visible decision about the centre of a narrative.","s":false},{"id":"added-derekgregorythecolonialpresent","d":"Gregory argues that colonial ways of organizing knowledge and space persist in contemporary military power.","s":false,"o":true},{"id":"added-leonoramianoseasonoftheshadow","d":"A community encounters the slave trade through partial knowledge, giving historical catastrophe a local narrative perspective.","s":false,"o":true},{"id":"40961621","d":"King Leopold’s Ghost reconstructs violence and resistance in the Congo under Leopold’s rule. It gives a particular historical case against which broad claims about imperial justification can be tested.","s":false},{"id":"added-barbarakingsolverthepoisonwoodbible","d":"A missionary family's competing voices make its claim to understand the Congo part of the colonial problem.","s":false,"o":true},{"id":"34185892","d":"Inglorious Empire argues about the costs of British rule in India. Track the types of evidence used for distinct claims rather than treating the overall verdict as their proof.","s":false,"o":true},{"id":"40915764","d":"An archival account of covert intervention complicates histories that identify independence with the end of external control.","s":false,"o":true},{"id":"127938747","d":"A speculative reconstruction of a colonial encounter disrupts the confidence of familiar conquest narratives.","s":false,"o":true},{"id":"46347","d":"All the Shah’s Men reconstructs the coup against Mossadegh. Its bounded episode lets you follow institutions, interests and sources in detail.","s":false},{"id":"5428","d":"A critique of Said's history of Orientalism gives the terminal work a substantial opponent to answer.","s":false},{"id":"13536357","d":"From the Ruins of Empire follows Asian intellectual responses to Western power. It broadens the account of agency beyond a simple contrast between rulers and the ruled.","s":false},{"id":"200142","d":"Robinson's account of racial capitalism challenges assumptions about which historical agents and traditions explain resistance.","s":false,"o":true},{"id":"25812847","d":"The Silk Roads reorganises a large historical narrative around routes and exchanges across Eurasia. Its scope makes it useful for asking what a change of centre reveals and what it still obscures.","s":false,"o":true},{"id":"added-vietthanhnguyenthesympathizer","d":"A divided narrator turns war, exile and cultural representation into a confession whose audience is itself political.","s":false},{"id":"23300798","d":"Orientalism examines an influential formation of knowledge about the East and its relations to power. It ends the path as a method and argument to assess, not a licence to label every representation in advance.","s":false}]},{"id":"history","group":"08 · Power and institutions","title":"What historians do with evidence","question":"How does a source become an account of the past?","why":"Historians argue from evidence, and evidence is always incomplete. Carr and Bloch ask what history is for; Davis and Ginzburg reconstruct lost lives from trial records. Herodotus is the first historian and still the most entertaining; Mantel and Tey turn historical method into fiction. Trouillot shows how power shapes what gets remembered. Hobsbawm and Gordon-Reed show large and small scales of archive work. Shlaim's Iron Wall ends the path. Audit his sources as carefully as he audits others'.","assignment":"Audit one chapter of The Iron Wall and one chapter from an earlier history. Write 1,000 words comparing the sources and the inferences drawn from them.","criteria":"Follow at least three notes to identify the kind of primary material involved. Distinguish the absence of evidence from evidence of absence, and name an uncertainty the account cannot eliminate. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"20663734","sources":[],"rungs":[{"id":"1097793","d":"What Is History? asks how facts, interpretation and historical explanation relate. It provides questions to carry into the later books rather than a timeless definition to memorise.","s":false},{"id":"added-nataliezemondavisthereturnofmartinguerre","d":"A small archival case makes the relation between evidence and plausible reconstruction unusually visible.","s":false},{"id":"added-marcblochthehistorianscraft","d":"The Historian’s Craft reflects on sources, comparison and the historian’s questions. Its incomplete form still offers a concrete account of historical inquiry as a practice.","s":false},{"id":"added-carloginzburgthecheeseandtheworms","d":"A historian reconstructs a miller's ideas from hostile records, showing both the possibilities and limits of microhistory.","s":false},{"id":"1362","d":"The Histories combines inquiry, reported accounts and narrative explanation. Read Books I and VII–IX as this path’s defined selection, noting how sources and uncertainty are presented.","s":true},{"id":"added-robertgravesiclaudius","d":"An invented imperial autobiography uses the texture of a source while remaining a novel; compare its authority with Herodotus's.","s":false,"o":true},{"id":"added-hilarymantelwolfhall","d":"Historical knowledge is filtered through one man's limited present, resisting the reader's temptation to treat later outcomes as inevitable.","s":false},{"id":"28789711","d":"SPQR examines Roman history through institutions, texts and material evidence. It offers a modern historical account whose handling of incomplete knowledge is part of its interest.","s":false,"o":true},{"id":"added-josephineteythedaughteroftime","d":"A detective reexamines a historical reputation from a distance, turning source criticism into the action of a novel.","s":false},{"id":"568236","d":"A Distant Mirror presents the fourteenth century through an extensive narrative. Use it to examine the gains and risks of organising a period around a life.","s":false,"o":true},{"id":"added-michelrolphtrouillotsilencingthepast","d":"Trouillot examines how power enters the making of historical facts and narratives at multiple stages.","s":false},{"id":"17333230","d":"Documents, testimony and a formal pattern build a historical mystery; track where the reader's evidence comes from.","s":false,"o":true},{"id":"550840","d":"The Age of Revolution links political and economic transformations within a broad interpretation. Its scale makes the relation between synthesis and local evidence especially important.","s":false},{"id":"55643287","d":"Visits to sites of historical memory show how public narratives are selected, displayed and challenged.","s":false,"o":true},{"id":"19658707","d":"The Hemingses of Monticello reconstructs a family under slavery from uneven records. It gives the path a sustained case in which source limitations are inseparable from power.","s":false},{"id":"added-jillleporethenameofwar","d":"A study of language and violence in colonial New England makes naming and narration part of historical conflict.","s":false,"o":true},{"id":"8171378","d":"The Warmth of Other Suns uses individual lives and extensive research to narrate migration. It makes the selection of representative lives an explicit object for your methodological comparison.","s":false,"o":true},{"id":"added-moniquetruongthebookofsalt","d":"An imagined servant's perspective enters a famous literary household, asking who remains absent from an abundant record.","s":false,"o":true},{"id":"20663734","d":"The Iron Wall examines Israeli policy and relations with the Arab world. It is terminal because your existing subject knowledge can help you scrutinise the argument’s evidence instead of relying chiefly on novelty or agreement.","s":false}]},{"id":"prisons","group":"08 · Power and institutions","title":"The institution and the people inside it","question":"How does an account of harm become an argument for change?","why":"Prisons and police are justified by functions: deterrence, protection, rehabilitation. Beccaria opens with the Enlightenment case for punishment that fits the crime. Du Bois, Malcolm X, Whitehead and Kushner show the institution from inside; Larson collects incarcerated writers. Hall explains how moral panics shape policing; Vitale and Schenwar argue for alternatives. Gilmore ends the path with the abolitionist case. Test each argument against the function it claims prisons serve, and look for the strongest defence too.","assignment":"Choose one function commonly assigned to prisons or policing. Write a 1,200-word comparison of how three books explain it and what they propose in its place.","criteria":"Identify a concrete mechanism, likely constraint and relevant evidence for each proposal. Include first-person testimony without making one life prove every institutional claim. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"55566309","sources":[],"rungs":[{"id":"35103663","d":"An early argument for penal reform lets you distinguish criticism of cruelty from criticism of the institution itself.","s":false},{"id":"added-omarshahidhamidtheprisoner","d":"A police thriller makes coercion and political patronage part of ordinary institutional practice rather than isolated misconduct.","s":false,"o":true},{"id":"16043524","d":"Rise of the Warrior Cop examines the militarisation of policing in the United States. It adds a concrete institutional development to the wider theoretical discussion.","s":false,"o":true},{"id":"added-ernestjgainesalessonbeforedying","d":"A condemned man's community confronts what recognition can mean within a process already committed to his death.","s":false,"o":true},{"id":"318742","d":"The Souls of Black Folk combines history, argument and autobiographical reflection. It introduces the relation between social structures and the experience of being interpreted through them.","s":false},{"id":"42270835","d":"A reform school's official purpose conflicts with the boys' experience, making institutional language an object of distrust.","s":false},{"id":"92057","d":"The Autobiography of Malcolm X presents a changing political self through a collaboratively narrated life. Track development and retrospective framing rather than extract one timeless position.","s":false},{"id":"added-rachelkushnerthemarsroom","d":"Prison life is narrated alongside the conditions preceding it, resisting a story that begins and ends at the conviction.","s":false},{"id":"123506597","d":"Incarcerated people's accounts give a direct challenge to explanations made entirely from outside the prison.","s":false},{"id":"100322","d":"Assata recounts a life and political struggle from within a contested public history. Its testimony asks you to examine the relation between personal account and institutional narrative.","s":false,"o":true},{"id":"added-jackhenryabbottinthebellyofthebeast","d":"Prison letters demand attention while raising difficult questions about literary authority and the reader's judgment of a writer.","s":false,"o":true},{"id":"126241","d":"Policing the Crisis analyses the construction of a social crisis around crime. It connects media, state action and social classification through a particular historical case.","s":false},{"id":"35403039","d":"The End of Policing questions the expanding range of problems assigned to police. Its policy arguments can be compared directly with the functions identified in earlier rungs.","s":false},{"id":"55495973","d":"A compact argument links property to policing, providing a specific mechanism to examine rather than a general association.","s":false,"o":true},{"id":"58651609","d":"Prison by Any Other Name examines reforms that can reproduce carceral control in new forms. It makes the distinction between a change of name and a change of mechanism consequential.","s":false},{"id":"25074268","d":"Essays connect gendered vulnerability to carceral power, widening the range of people and institutions considered.","s":false,"o":true},{"id":"34551009","d":"Carceral Capitalism connects punishment, finance and forms of social management. Read its conceptual claims against the specific histories already encountered.","s":false,"o":true},{"id":"added-jamesbaldwinifbealestreetcouldtalk","d":"An accusation reorganizes a family's daily life, revealing punishment's reach beyond the person formally confined.","s":false,"o":true},{"id":"55566309","d":"Abolition Geography gathers Gilmore’s work on prisons, political economy and collective struggle. It is terminal because it asks you to connect institutional analysis with the making of different social arrangements.","s":false}]},{"id":"climate","group":"09 · Science and living systems","title":"Commons, limits and ecological futures","question":"What kinds of coordination can sustain a shared world?","why":"How should we manage what we share: air, water, forests, climate? Robinson and Meadows open with a future and a method; Amrith and Ghosh trace the history and the literary failure to imagine climate change. Hickel and Jackson argue that growth itself is the problem; Bacigalupi and Ballard imagine the worlds that follow. Ostrom ends the path with her evidence that communities can govern commons without either markets or states. Bring her framework to a real resource you know.","assignment":"Choose a real shared resource and draft a 1,200-word institutional analysis using Ostrom. Compare your proposal with one claim from the growth or degrowth books.","criteria":"Specify users, boundaries, monitoring and conflict resolution. Identify which local facts you know and which must be investigated. Include a credible failure mode. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"1048424","sources":[],"rungs":[{"id":"208840291","d":"The Serviceberry examines reciprocity and abundance through ecological and social relationships. It opens the path with a small-scale account of exchange outside a narrow market vocabulary.","s":false,"o":true},{"id":"50998056","d":"A climate novel turns finance and international coordination into narrative mechanisms that the nonfiction can help assess.","s":false},{"id":"3828902","d":"Thinking in Systems introduces feedback, stocks, flows and system behaviour. It supplies tools for distinguishing a proposed intervention from an assumption about its consequences.","s":false},{"id":"203644918","d":"An environmental history connects ecological change to freedom, empire and unequal exposure rather than a generic human impact.","s":false},{"id":"35132595","d":"The Great Derangement asks why climate change strains familiar literary and political forms. It connects the difficulty of representing a problem to the difficulty of responding to it.","s":false},{"id":"added-richardpowerstheoverstory","d":"Interlocking lives change around trees, asking how a novel can shift attention beyond human timescales.","s":false,"o":true},{"id":"57331880","d":"A history and argument about colonial extraction challenges accounts of climate crisis detached from imperial power.","s":false},{"id":"21913812","d":"This Changes Everything argues about climate and economic organisation. Track the institutional mechanisms behind the large diagnosis rather than treating urgency as evidence for each proposal.","s":false,"o":true},{"id":"29885359","d":"An explicitly political account of ecological crisis makes its causal framework available for comparison with rival explanations.","s":false,"o":true},{"id":"53328332","d":"Less Is More presents a degrowth argument about production, inequality and ecological limits. Read its proposals with attention to what is to shrink, where and for whom.","s":false},{"id":"added-paolobacigalupithewindupgirl","d":"An imagined economy of scarce energy and controlled biological resources turns ecological constraint into corporate and state power.","s":false},{"id":"13714061","d":"Hornborg asks how apparent technological progress depends on uneven transfers of resources, labor and environmental cost.","s":false,"o":true},{"id":"33632063","d":"Prosperity without Growth examines how flourishing and economic organisation might be separated from rising material throughput. It offers a second account to compare with Hickel’s framing.","s":false},{"id":"18594475","d":"An account of public responses to climate change asks why information alone does not reliably produce collective action.","s":false,"o":true},{"id":"61140120","d":"The Value of a Whale critiques market-oriented environmental solutions. Its specific objects let you test whether the criticism concerns implementation, incentives or the underlying measure of value.","s":false,"o":true},{"id":"added-jgballardthedrownedworld","d":"Environmental transformation changes desire and perception as well as survival, a counterpoint to policy-centered climate fiction.","s":false},{"id":"59095821","d":"The Future Is Degrowth develops a political and institutional vision beyond growth. It brings multiple proposals together before the terminal work asks what makes collective governance function.","s":false,"o":true},{"id":"78279149","d":"A contested reconstruction of Marx's ecological thought connects the course's political economy to arguments about limits and growth.","s":false,"o":true},{"id":"1048424","d":"Governing the Commons studies arrangements for managing shared resources. It ends the path by replacing universal declarations with questions about rules, contexts and conditions of cooperation.","s":false}]},{"id":"science","group":"09 · Science and living systems","title":"How a science explains","question":"What makes an explanation survive contact with evidence?","why":"How does science explain anything? Godfrey-Smith gives the map; Brecht's Galileo and Lewis's Arrowsmith put scientists on stage and on the page. Latour watches science being made; Popper, Kuhn and Duhem offer three incompatible accounts of how theories are tested. Gould shows bias in measurement; Monod makes the case for chance. Stoppard's Arcadia stages a scientific discovery and its misreading two centuries apart. Darwin ends the path. Reconstruct one of his arguments and see which philosophy of science describes it best.","assignment":"Choose one explanatory argument in The Origin of Species. Reconstruct its evidence and inference in 1,000 words, then analyse it using two accounts of science earlier in the path.","criteria":"Separate observation, analogy and inference. Describe a plausible rival explanation and what evidence would discriminate between them; do not demand a kind of experiment the historical claim cannot have. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"1254594","sources":[],"rungs":[{"id":"31921","d":"Philosophy of Science: A Very Short Introduction outlines problems of explanation, evidence and realism. It provides a compact vocabulary for the more sustained disputes ahead.","s":false,"o":true},{"id":"25242066","d":"A philosopher examines what scientific authority does and does not establish, sharpening the questions posed by the introductory readings.","s":false,"o":true},{"id":"31931","d":"Theory and Reality follows major approaches to scientific knowledge. Read it as a map of disagreements, keeping each position’s target in view.","s":false},{"id":"added-bertoltbrechtlifeofgalileo","d":"A staged conflict over discovery and authority makes the scientist's public responsibility a dramatic problem.","s":false},{"id":"wc-stoppard-arcadia","d":"A play that alternates between 1809 and the present in the same country house: a teenage prodigy stumbles toward ideas about chaos and heat, and modern scholars misread the evidence she left behind. It stages science and history as two kinds of explanation, both able to go wrong.","s":false,"w":true},{"id":"added-brunolatourscienceinaction","d":"A sociological account follows how claims become durable facts, offering an approach that the philosophy texts can challenge.","s":false},{"id":"61550","d":"The Logic of Scientific Discovery develops Popper’s account of testing and falsification. Read Chapters I–V as the defined selection and inspect how the account handles actual scientific practice.","s":true},{"id":"added-sinclairlewisarrowsmith","d":"A scientist's career moves between curiosity, institutions and recognition, making research ideals answer to social pressures.","s":false},{"id":"108939","d":"An insider's critique of theoretical physics raises questions about evidence, consensus and disciplinary incentives.","s":false,"o":true},{"id":"61539","d":"The Structure of Scientific Revolutions examines normal science and conceptual change. Its historical perspective supplies a direct contrast with methodological prescriptions alone.","s":false},{"id":"55867888","d":"Historical cases of harmful research ask what the production of knowledge can fail to justify.","s":false,"o":true},{"id":"added-ianmcewansolar","d":"A physicist's public authority exceeds his moral and personal capacities, a comic challenge to the prestige of expertise.","s":false,"o":true},{"id":"2441449","d":"The Aim and Structure of Physical Theory examines the relation between theory, experiment and representation. It deepens the question of what exactly an experiment tests.","s":false},{"id":"1260457","d":"Read the essays on Bell's theorem and interpretation; distinguish mathematical results from what authors infer about reality.","s":true,"o":true},{"id":"7618917","d":"Nonsense on Stilts examines disputes about scientific credibility. Its cases let you test whether a general demarcation principle is sufficient for judgement.","s":false,"o":true},{"id":"966835","d":"A pandemic novel makes imagined catastrophe a test of political and intellectual confidence, not a scientific forecast.","s":false,"o":true},{"id":"16175250","d":"A historical critique of measurement demands scrutiny of its own evidence as well as of the science it criticizes.","s":false},{"id":"493746","d":"Chance and Necessity moves from molecular biology into broader philosophical claims. It is useful for locating the boundary between an explanatory result and the worldview built around it.","s":false},{"id":"17798","d":"A collection of skeptical case studies lets you examine how boundary judgments are argued, and how dated examples affect them.","s":false,"o":true},{"id":"1254594","d":"The Origin of Species develops an argument through observations, comparisons and responses to difficulties. It is terminal as a sustained example of explanation being built, not merely announced.","s":false}]},{"id":"biology","group":"09 · Science and living systems","title":"An organism is not an island","question":"Where should a biological explanation draw its boundary?","why":"Living things exist in networks: senses, microbes, families, colonies. Yong opens with animal perception and the microbiome; Weiner follows evolution happening in real time; Hrdy argues cooperation shaped human evolution; Vonnegut imagines evolution's punchline. Axelrod, Jacob, Dawkins and Jablonka offer four ways to explain cooperation and inheritance, read in that order so the critique follows its target. Hölldobler and Wilson's Ants ends the path. Explain one colony behaviour at both the individual and the collective level.","assignment":"Choose a collective behaviour described in The Ants. Write a 1,000-word explanation at two levels—individual mechanisms and colony organisation—and compare it with one other book.","criteria":"Use one figure or described study. Identify what is observed, what is mode
