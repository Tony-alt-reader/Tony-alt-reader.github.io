lled and what is inferred. Explain why a tempting human analogy may fail. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"403059","sources":[],"rungs":[{"id":"59575939","d":"An Immense World describes the diversity of animal sensory experience. It starts by questioning whether the observer’s perceptual world is an adequate model of the organism’s.","s":false},{"id":"27276428","d":"A history of genetics follows changing concepts and techniques, keeping the gene from becoming an unexplained master term.","s":false,"o":true},{"id":"27213168","d":"I Contain Multitudes examines microbial associations and their implications. It makes the boundary of an individual a live explanatory question.","s":false},{"id":"added-simonmawermendelsdwarf","d":"A geneticist's personal and professional concerns become entangled, complicating the relation between explanation and the life explained.","s":false,"o":true},{"id":"58986604","d":"A paleontological history places familiar organisms inside long, contingent evolutionary changes.","s":false,"o":true},{"id":"135486","d":"In the Shadow of Man reports extended observation of chimpanzees. It adds a field-based example in which individual lives and social relations require sustained attention.","s":false,"o":true},{"id":"added-jonathanweinerthebeakofthefinch","d":"An account of field research makes evolutionary change a matter of repeated observation rather than only a large historical story.","s":false},{"id":"added-barbarakingsolverprodigalsummer","d":"Human relationships unfold within ecological interdependence, making natural history part of the novel's structure.","s":false,"o":true},{"id":"6251387","d":"Mothers and Others connects care and cooperative capacities to evolutionary questions. Its account broadens the comparison beyond competition as the default social mechanism.","s":false},{"id":"55981","d":"Wilson proposes a unification of knowledge whose ambition gives the specialized biological accounts something to resist.","s":false,"o":true},{"id":"added-kurtvonnegutgalapagos","d":"An absurd evolutionary future unsettles the assumption that familiar human traits are necessarily advantageous.","s":false},{"id":"366821","d":"The Evolution of Cooperation uses models to examine the emergence of cooperation. Attend to the rules and assumptions before transferring the results to living systems.","s":false},{"id":"added-francoisjacobthelogicoflife","d":"A biologist traces changes in what living systems were thought to be, making explanation itself historical.","s":false},{"id":"61538","d":"The Extended Phenotype expands how evolutionary effects can be attributed and described. It is the conceptual bridge from the organism’s body to consequences beyond it.","s":false},{"id":"added-hanyayanagiharathepeopleinthetrees","d":"A scientist's expedition and self-account make knowledge, exploitation and credibility difficult to separate.","s":false,"o":true},{"id":"503051","d":"The Diversity of Life relates biological variety to evolutionary history and ecological relations. It restores scale and natural history before the more specialised endpoint.","s":false,"o":true},{"id":"added-davidquammenthetangledtree","d":"An account of molecular evolutionary research explains why the image of a simple branching tree can become inadequate.","s":false,"o":true},{"id":"added-evajablonkaandmarionjlambevolutioninfourdimensions","d":"An argument about multiple forms of inheritance broadens the explanatory picture beyond a gene-only account.","s":false},{"id":"403059","d":"The Ants is Hölldobler and Wilson’s extensive study of ant biology. Read the sections on communication, caste, division of labour and colony organisation as the defined terminal selection; do not count the entire monograph as read on that basis.","s":true}]},{"id":"mathematics","group":"09 · Science and living systems","title":"Proof, structure and mathematical reality","question":"What has been established when a proof succeeds?","why":"Mathematics is both a practice and a puzzle about reality. Pólya and Velleman teach you how mathematicians work; Logicomix tells the story of the search for foundations; Lakatos shows proofs evolving through counterexamples. Halmos and Abbott give you real material to prove; Weyl and Ogawa show symmetry and beauty. Gödel's paper marks the limits. Aaronson and Wigner ask why mathematics fits the physical world. Hamkins ends the path with competing philosophies of what mathematical objects are. Write one proof yourself before deciding which philosophy you hold.","assignment":"Write out one nontrivial proof from Halmos or Abbott without looking at the text. Add an 800-word discussion of what Hamkins’s competing philosophies would say about its objects and truth.","criteria":"State every assumption and justify each step. Include one attempted proof that failed and locate the failure. Philosophical vocabulary must refer to the actual mathematical example. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"53730382","sources":[],"rungs":[{"id":"21981721","d":"How to Solve It examines strategies for mathematical problem-solving. Use it while doing problems, recording which suggestion changes an actual attempt.","s":false},{"id":"added-edwinaabbottflatland","d":"A mathematical fable joins dimensions to social hierarchy, letting you distinguish its geometric argument from its satirical one.","s":false,"o":true},{"id":"added-danieljvellemanhowtoproveit","d":"How to Prove It develops logic and methods of proof through exercises. Work through the chapters on logical form, quantifiers, direct proof and induction; these supply techniques used by later rungs.","s":true},{"id":"434707","d":"A dialogue reconstructs mathematical discovery through counterexamples and revised definitions rather than a polished final proof.","s":false},{"id":"558194","d":"Naive Set Theory introduces sets, relations, functions and cardinality through concise arguments. Reproduce proofs and examples rather than treating the short length as a quick read.","s":false},{"id":"183761","d":"Explanations of abstract structures provide conceptual bridges between the course's technical texts.","s":false,"o":true},{"id":"added-yokoogawathehousekeeperandtheprofessor","d":"Mathematical patterns become a means of relation in a life limited by memory, without pretending that affection proves a theorem.","s":false},{"id":"1591970","d":"Symmetry connects mathematical structure to geometry and visual patterns. It gives the abstract language a different kind of object to describe.","s":false},{"id":"714583","d":"A mathematician's biography gives collaboration and obsession a human setting beside impersonal proof.","s":false,"o":true},{"id":"2066384","d":"Mathematical questions are extracted from a literary premise, demonstrating both the productivity and limits of formalizing fiction.","s":false,"o":true},{"id":"845794","d":"Understanding Analysis develops rigorous arguments about the real numbers, sequences and functions. Read Chapters 1–3 and solve a selection of exercises from each as this rung’s defined scope.","s":true},{"id":"1396090","d":"Read the essays on incompleteness and proof; the collection supplies rigorous arguments rather than a general celebration of paradox.","s":true,"o":true},{"id":"wc-logicomix","d":"A graphic novel following Bertrand Russell's search for the foundations of mathematics, with the authors arguing on the page about how to tell the story. Read it right before Gödel to see what his paper broke.","s":false,"w":true},{"id":"208288","d":"On Formally Undecidable Propositions presents Gödel’s original incompleteness work. Read with a commentary or the guide you have already finished, separating the theorem’s actual formal conditions from popular extrapolations.","s":false},{"id":"added-apostolosdoxiadisunclepetrosandgoldbachsconjecture","d":"A mathematical ambition becomes a family mystery, separating the value of a pursuit from the success of its proof.","s":false,"o":true},{"id":"17471298","d":"Quantum Computing Since Democritus connects computation, complexity and physical questions. Its arguments offer a further arena in which precise formal limits matter.","s":false},{"id":"53337","d":"A contested embodied account of mathematical concepts supplies a philosophical position to compare with formal practice.","s":false,"o":true},{"id":"19802572","d":"Mathematics and the Search for Knowledge gives a historical and philosophical account of mathematical explanation. It prepares a comparison between mathematics as practice and mathematics as a picture of reality.","s":false,"o":true},{"id":"17448036","d":"A short essay states a problem about applicability that the terminal philosophy lectures let you evaluate in a wider vocabulary.","s":false},{"id":"53730382","d":"Lectures on the Philosophy of Mathematics surveys foundational positions through concrete mathematical material. It ends the path because your judgement can now refer to work you have actually done.","s":false}]},{"id":"music","group":"10 · Art and the made world","title":"Listening with concepts, playing with ears","question":"What does analysis let you hear differently?","why":"This is a pianist's path through listening, history and theory. Cook gives the framework; Rosen writes from the keyboard about touch, practice and recording. Ishiguro, Jelinek and Mann put musicians into fiction. Katz shows recording changing music; Grout gives the history; Chopin's letters and Gardiner's Bach put you close to two composers you can play. Ross carries the story through the twentieth century. Tymoczko ends the path with a geometric theory of harmony. Test each idea at the piano before accepting it.","assignment":"Choose a short piece you can play. Record an initial performance, write an 800-word analysis informed by two books, and record a revised version.","criteria":"Identify three specific performance decisions and the musical evidence for each. Include one analytical insight that did not produce an audible improvement, explaining why. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"10168194","sources":[],"rungs":[{"id":"784170","d":"Music: A Very Short Introduction examines how music is made meaningful through listening and practice. It opens the path by questioning assumptions about what the musical work consists of.","s":false},{"id":"40210646","d":"A listener connects musical experience to mental life, offering a personal claim to compare with analytical explanation.","s":false,"o":true},{"id":"240687445","d":"Ways of Listening considers a more attentive relationship with music in a streaming environment. Use it to design a few listening sessions rather than consume it as advice alone.","s":false,"o":true},{"id":"wc-rosen-piano-notes","d":"A pianist and scholar on touch, pedalling, practising, recording and competitions. Read it with your own repertoire open: it is the one book in the path written from the keyboard outward.","s":false,"w":true},{"id":"added-kazuoishigurotheunconsoled","d":"A pianist's obligations expand inside an unstable world, making performance authority and personal disorientation coexist.","s":false},{"id":"17032833","d":"This Is Your Brain on Music connects musical experience to cognitive explanations. Distinguish the account of a mechanism from the judgement that one performance is artistically better.","s":false,"o":true},{"id":"199504414","d":"An account of streaming and discovery asks how the institutions of listening shape what reaches the ear.","s":false,"o":true},{"id":"added-elfriedejelinekthepianoteacher","d":"Musical discipline and coercive intimacy become entangled, complicating any simple identification of cultivation with freedom.","s":false},{"id":"215656","d":"Capturing Sound examines how recording technology changes musical practices. It broadens the object of analysis beyond a score or an imagined definitive performance.","s":false},{"id":"16175842","d":"A history of authenticity in popular music asks who benefits when a performance is judged real or artificial.","s":false,"o":true},{"id":"60263189","d":"An oral history of hip-hop adds a collective, contested musical history to the course's predominantly classical one.","s":false,"o":true},{"id":"214151728","d":"Mood Machine examines Spotify and the organisation of musical listening. Its institutional account adds the conditions under which works reach listeners.","s":false,"o":true},{"id":"added-thomasmanndoctorfaustus","d":"A fictional composer's life makes artistic innovation answer to historical and moral pressures rather than technique alone.","s":false},{"id":"6486668","d":"A History of Western Music supplies historical context for styles and institutions. Read the Baroque, Classical and nineteenth-century keyboard-related chapters as the defined selection relevant to your playing.","s":true},{"id":"241381479","d":"Research on musical imagination asks how listening produces scenes and meanings beyond the notes themselves.","s":false,"o":true},{"id":"19953167","d":"Chopin’s Letters gives access to a composer’s correspondence. Read a selection spanning different periods, keeping the letters’ occasions distinct from later stories about the music.","s":true},{"id":"added-annpatchettbelcanto","d":"A voice changes the relationships within an enclosed group, giving musical experience a narrative role that analysis cannot simply replace.","s":false,"o":true},{"id":"17883941","d":"Bach: Music in the Castle of Heaven joins biography, historical context and musical interpretation. It shows how a performer’s account can be tested by returning to the sound and score.","s":false},{"id":"added-alexrosstherestisnoise","d":"A cultural history of twentieth-century music connects changing sounds to institutions, politics and audiences.","s":false},{"id":"10168194","d":"A Geometry of Music models voice leading and harmonic relations. Read Chapters 1–3 with a keyboard and draw the examples yourself; this selected terminal study makes abstract analysis answerable to heard movement.","s":true}]},{"id":"cities","group":"10 · Art and the made world","title":"A city is a set of choices","question":"How do ordinary designs distribute freedom?","why":"Cities are designed, and every design choice favours someone. Norman and Baker train your eye on everyday objects; Lynch explains how people read cities; Grabar shows parking reshaping them. Cole's Open City and Petry's Street walk through New York at very different moments. Sennett argues for disorder; Desmond and Rothstein document eviction and segregation as policy. Jacobs ends the path with the great case for street life. Study one real street with all of them in hand.","assignment":"Make a small field study of one street or public space. Write 1,000 words using Jacobs and two earlier books, with a simple annotated sketch or photographs.","criteria":"Separate observations from causal guesses. Identify who benefits from the current design, who encounters friction, and one proposed change with a plausible unintended consequence. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"30833","sources":[],"rungs":[{"id":"840","d":"The Design of Everyday Things examines the relation between design and the user’s understanding. It supplies a vocabulary for noticing friction without immediately blaming the person experiencing it.","s":false},{"id":"added-nicholsonbakerthemezzanine","d":"One small journey through a built environment makes ordinary design available to unusually sustained attention.","s":false},{"id":"6477815","d":"Bicycle Diaries observes cities through movement and everyday encounters. It introduces a situated way of reading the built environment rather than only a plan view.","s":false,"o":true},{"id":"added-kevinlynchtheimageofthecity","d":"An account of how people mentally organize urban space gives the novels' movements a concrete analytical vocabulary.","s":false},{"id":"63329951","d":"Paved Paradise examines parking rules and their consequences for urban life. It gives you a concrete mechanism connecting a mundane requirement to a larger spatial pattern.","s":false},{"id":"added-tejucoleopencity","d":"A walking narrator layers observation and memory over a city, raising questions about what his apparently open attention excludes.","s":false},{"id":"added-lewismumfordthecityinhistory","d":"A large history of urban forms places contemporary design choices inside changing institutions and ambitions.","s":false,"o":true},{"id":"25812701","d":"The Great Good Place argues for the importance of informal gathering places. Test its account against who can actually enter, remain in and shape those spaces.","s":false,"o":true},{"id":"added-annpetrythestreet","d":"A woman's attempts to make a life are constrained by housing, work and the social geography around her.","s":false},{"id":"added-richardsennetttheusesofdisorder","d":"An argument for unplanned encounters challenges the aspiration to make urban life entirely orderly and predictable.","s":false},{"id":"40363341","d":"Capital City connects urban development to real estate and political power. It brings the political economy of land into the spatial questions raised earlier.","s":false,"o":true},{"id":"447","d":"A life of precarity and chance is organized through New York's spaces, complicating the idea that a city is simply a backdrop.","s":false,"o":true},{"id":"25852784","d":"Evicted follows housing insecurity through closely observed lives and relations. It makes the consequences of institutional arrangements visible at household scale.","s":false},{"id":"49796095","d":"A critique of transportation technology asks whether new products solve the collective problems of getting around.","s":false,"o":true},{"id":"44142112","d":"Strong Towns argues about the financial and physical organisation of urban development. Compare its proposed mechanisms with the social and distributive problems in the preceding rungs.","s":false,"o":true},{"id":"added-nkjemisinthecitywebecame","d":"A speculative city embodied by multiple people makes urban plurality part of the novel's premise.","s":false,"o":true},{"id":"58493442","d":"Architecture: From Prehistory to Climate Emergency places building within material and energy histories. It widens the assessment of design beyond the immediate experience of a user.","s":false,"o":true},{"id":"added-richardrothsteinthecoloroflaw","d":"A historical argument about state-sponsored housing segregation identifies decisions behind apparently natural urban divisions.","s":false},{"id":"30833","d":"The Death and Life of Great American Cities develops an argument from street-level observation about urban diversity and functioning. It ends the path with a method you can apply, challenge and revise in a specific place.","s":false}]},{"id":"technology","group":"10 · Art and the made world","title":"Technology and its arrangements","question":"Who has agency inside a supposedly neutral system?","why":"Technologies are arrangements of power, attention and dependency. Lanier opens with a critique from inside; Vonnegut's Player Piano and Gibson's Neuromancer imagine automation and cyberspace. Ellul argues technique has its own logic; Narayanan and Christian explain what AI can and can't do. O'Gieblyn reads technology through theology; Gillespie and Couldry trace moderation and data extraction. Zuboff ends the path with the theory of surveillance capitalism. Analyse one service you use every day.","assignment":"Analyse one digital service in 1,200 words, using three books from the path. Map how it collects information, directs attention and creates dependencies.","criteria":"Separate observed functionality from inferred motives. State a mechanism that could be changed and what evidence would show whether the change worked. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"26195941","sources":[],"rungs":[{"id":"6683549","d":"You Are Not a Gadget argues about the assumptions built into digital systems. It begins with the relation between a technical representation of a person and the person represented.","s":false},{"id":"added-kurtvonnegutplayerpiano","d":"An automated society distributes prestige along with employment, testing whether efficiency can settle questions of a good life.","s":false},{"id":"36592387","d":"The People Vs Tech examines threats digital technologies can pose to democratic life. Use its claims to formulate specific mechanisms rather than a general mood of alarm.","s":false,"o":true},{"id":"274827","d":"A broad argument about technique offers a strong historical thesis to qualify using the later, more specific accounts.","s":false},{"id":"added-williamgibsonneuromancer","d":"An information economy becomes a lived environment of dependence, skill and unequal power rather than an abstract network.","s":false},{"id":"23547703","d":"Information Doesn’t Want to Be Free examines the rules and business arrangements around digital culture. It makes policy and ownership visible behind claims about technology itself.","s":false,"o":true},{"id":"25666050","d":"Computational problems are applied to ordinary decisions; notice both the illuminating analogy and what the formal model leaves out.","s":false,"o":true},{"id":"added-daveeggersthecircle","d":"A worker's growing participation in a platform turns convenience and recognition into pressures toward disclosure.","s":false,"o":true},{"id":"210319458","d":"AI Snake Oil distinguishes capabilities, claims and misapplications of AI. Its narrower analytical questions help test the broad institutional arguments elsewhere in the path.","s":false},{"id":"36739320","d":"A linguist studies how online communication changes usage, providing an observational counterweight to sweeping claims of decline.","s":false,"o":true},{"id":"added-annaleenewitzautonomous","d":"Intellectual property and unequal autonomy organize an imagined biotech economy, making ownership a condition of agency.","s":false,"o":true},{"id":"50489349","d":"The Alignment Problem examines machine learning through the difficulty of specifying and realising human values. It connects technical choices to the social contexts in which systems operate.","s":false},{"id":"222725518","d":"Reporting on the institutions behind artificial intelligence makes labor, resources and organizational decisions visible behind the product.","s":false,"o":true},{"id":"added-corydoctorowlittlebrother","d":"Surveillance becomes a daily problem for people trying to act collectively, linking technical knowledge to civic agency.","s":false,"o":true},{"id":"56122828","d":"God, Human, Animal, Machine examines the metaphors through which minds and machines are understood. It asks how an explanatory analogy becomes a worldview.","s":false},{"id":"added-tarletongillespiecustodiansoftheinternet","d":"A study of platform moderation reveals the human decisions and institutions behind apparently automatic online order.","s":false},{"id":"152014986","d":"Data Grab argues about data extraction through a colonialism framework. Compare its explanatory gain with the historical differences that the analogy may compress.","s":false,"o":true},{"id":"added-nickcouldryandulisesamejiasthecostsofconnection","d":"A theory of data extraction gives the terminal surveillance account a related but distinct framework to compare.","s":false},{"id":"26195941","d":"The Age of Surveillance Capitalism offers a large account of data, prediction and economic power. It is terminal because its scope calls for the more local tests and distinctions developed earlier in the path.","s":false}]},{"id":"testimony","group":"11 · Witness and historical memory","title":"Witness, responsibility and historical violence","question":"What does testimony ask of the person who receives it?","why":"How should violence be witnessed, and what obligations come with the witnessing? Remarque and Jünger give two opposite accounts of the same war; O'Brien questions whether war stories can be true. Sebald writes memory as wandering; Alexievich collects voices; Sontag and Langer ask what images and literature can do. Arendt reports on a perpetrator; Levi and Spiegelman testify and question their own testimony. Grossman's Life and Fate ends the path. Compare what fiction and testimony can each show.","assignment":"Compare a scene in Life and Fate with one piece of testimony earlier in the path. Write 1,200 words on what each form allows and what ethical obligations it creates.","criteria":"Identify the evidence and genre claims of both texts. Avoid treating fiction as documentary proof or treating documentary selection as unmediated access to the past. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"added-vasilygrossmanlifeandfate","sources":[],"rungs":[{"id":"355697","d":"All Quiet on the Western Front represents war through the narrowing experience of soldiers. It begins the path with a novel whose intimacy challenges abstract accounts of martial purpose.","s":false},{"id":"added-annasegherstheseventhcross","d":"An escape from a concentration camp exposes a range of ordinary responses to danger and complicity.","s":false,"o":true},{"id":"240485","d":"Storm of Steel gives a contrasting account of combat and experience. Compare the narration’s values and selections without assuming that shared events produce a shared interpretation.","s":false},{"id":"added-giorgiobassanithegardenofthefinzicontinis","d":"Retrospective narration makes ordinary intimacy inseparable from a catastrophe the characters do not yet fully know.","s":false,"o":true},{"id":"133518","d":"The Things They Carried unsettles the relation between lived experience, invented detail and narrative truth. Its formal self-questioning makes the genre problem explicit.","s":false},{"id":"added-hishammatarthereturn","d":"A son's search for his disappeared father gives uncertainty and incomplete evidence a durable place in memoir.","s":false,"o":true},{"id":"added-wgsebaldausterlitz","d":"A life is reconstructed through uncertain memories and mediated testimony, making the act of receiving a story part of its form.","s":false},{"id":"36076360","d":"The Unwomanly Face of War assembles women’s accounts of wartime experience. Its chorus asks how editing can create a collective history while preserving differences between speakers.","s":false},{"id":"added-susansontagregardingthepainofothers","d":"An argument about images of suffering asks what attention can accomplish without confusing looking with understanding.","s":false},{"id":"added-lawrencellangertheholocaustandtheliteraryimagination","d":"A critical study examines how literary conventions can both articulate and distort catastrophic experience.","s":false},{"id":"357486","d":"Voices from Chernobyl brings personal accounts of disaster into an arranged oral history. Compare what the form makes visible with the kinds of technical and institutional explanation it cannot supply alone.","s":false,"o":true},{"id":"added-maazamengistetheshadowking","d":"Women in the Ethiopian resistance to invasion become historical agents rather than peripheral figures in a military account.","s":false,"o":true},{"id":"52090","d":"Eichmann in Jerusalem interprets a trial through questions of judgement and responsibility. Separate Arendt’s particular claims from the shorthand that later attached to the book.","s":false},{"id":"added-wgsebaldtheemigrants","d":"Four mediated life stories make photographs and recollection into uncertain vehicles of historical knowledge.","s":false,"o":true},{"id":"added-jameseyoungthetextureofmemory","d":"A study of memorials asks how public forms organize remembrance and what those forms leave unresolved.","s":false,"o":true},{"id":"added-primolevithedrownedandthesaved","d":"The Drowned and the Saved reflects on memory, testimony and morally compromised situations under extreme coercion. It challenges easy categories without dissolving distinctions in responsibility.","s":false},{"id":"added-paulaustertheinventionofsolitude","d":"Autobiographical reflection makes the attempt to recover another person a problem of form, evidence and acknowledged absence.","s":false,"o":true},{"id":"126918752","d":"Cold Crematorium recounts persecution and camp experience with close attention to social arrangements. It gives another testimony against which general claims about dehumanisation must remain particular.","s":false,"o":true},{"id":"wc-spiegelman-maus","d":"Spiegelman's father's testimony of Auschwitz, drawn with Jews as mice and Germans as cats, and interrupted by the son's struggle to record it. It puts the ethics of passing on testimony directly on the page.","s":false,"w":true},{"id":"added-vasilygrossmanlifeandfate","d":"Life and Fate follows interconnected lives amid war and totalitarian power. It ends the path by making historical scale coexist with acts and attachments that resist a single explanatory scheme.","s":false}]},{"id":"gaddis","group":"12 · Advanced seminars in form","title":"Art, money and the counterfeit","question":"What makes an original possible in a world of copies?","why":"When does art become a commodity, and when does copying become creation? Zola and Huysmans open with painters and aesthetes; Gide's Counterfeiters makes forgery a structure. Benjamin explains what reproduction does to art; Hyde argues for art as a gift; Berger teaches looking; Shields and Markson make books from collage. Gaddis ends the path with two huge novels: J R about money that talks, The Recognitions about forgery as a vocation. Watch how each book separates making from taking.","assignment":"Compare one act of artistic making in The Recognitions with one transaction in J R. Write 1,200 words on how the narrative distinguishes creation, appropriation and exchange.","criteria":"Follow the actual scene and its voices. Explain one case where the distinction breaks down, and avoid equating formal complexity with value without showing the effect. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"395058","sources":[{"title":"The Gaddis Annotations","url":"https://www.williamgaddis.org/","note":"Independent scholarly resource with annotations and bibliographies."}],"rungs":[{"id":"929782","d":"Martin Eden follows literary ambition into work, class and reputation. It establishes a relatively direct narrative of becoming an artist before the later novels destabilise that model.","s":false,"o":true},{"id":"added-emilezolathemasterpiece","d":"An artist's ambition collides with the social life of art, making artistic originality a lived predicament.","s":false},{"id":"210255","d":"Against Nature builds a withdrawn life around cultivated sensations and aesthetic choices. It introduces the possibility that taste can become both creative practice and enclosure.","s":false},{"id":"added-andregidethecounterfeiters","d":"The novel's own construction mirrors its problem of false currency and borrowed authority.","s":false},{"id":"145108","d":"ABC of Reading offers Pound’s forceful judgements about literary attention and tradition. Read it critically as one account of artistic discrimination, with its exclusions visible.","s":false,"o":true},{"id":"2474084","d":"Read the title essay in the media collection; its argument about reproduction supplies a specific claim to test against the novels.","s":true},{"id":"27886778","d":"A painting's movement through a damaged life entangles attachment, value and illicit possession.","s":false,"o":true},{"id":"6712580","d":"Reality Hunger assembles a manifesto from fragments and borrowed statements. Its construction makes authorship and attribution practical questions rather than abstract themes.","s":false},{"id":"added-bradfordmorrowtheforgers","d":"Literary artifacts become objects of desire and deception, making authenticity something characters must establish at a cost.","s":false,"o":true},{"id":"added-lewishydethegiftcreativityandtheartistinthemodernworld","d":"Hyde contrasts gift and commodity relations in art, giving a framework to compare with Gaddis's economies.","s":false},{"id":"added-williamgaddiscarpentersgothic","d":"Carpenter’s Gothic concentrates overlapping conflicts in a small domestic space. Its dialogue offers a shorter introduction to Gaddis’s habit of making the reader identify speakers and motives.","s":false,"o":true},{"id":"470185","d":"Essays examine what acts of looking assume, keeping the course's claims about art connected to particular encounters.","s":false},{"id":"added-dubravkaugresicthemuseumofunconditionalsurrender","d":"Objects and fragments organize a displaced life, offering an alternative to the museum as a stable account of cultural value.","s":false,"o":true},{"id":"added-davidmarksonthelastnovel","d":"A book built from accumulated cultural fragments makes originality a question of selection, arrangement and borrowed lives.","s":false},{"id":"18942722","d":"Underworld links objects, memories and public events across decades. Its large-scale arrangement supplies a useful comparison with Gaddis’s circulation of people and cultural fragments.","s":false,"o":true},{"id":"added-andreschiffrinthebusinessofbooks","d":"A publishing history makes the institutions that circulate literature part of the argument about artistic value.","s":false,"o":true},{"id":"28434","d":"J R turns a schoolboy’s enterprise into a proliferating world of money and talk. Follow transactions and repeated phrases to see how a system can become audible without a central explanation.","s":false},{"id":"added-denisduttontheforgersart","d":"A collection on forgery asks what authenticity contributes to aesthetic judgment when the visible object seems unchanged.","s":false,"o":true},{"id":"395058","d":"The Recognitions follows a painter into forgery amid an extensive social and artistic world. It gathers the path’s questions about originality, belief and value into a demanding many-voiced novel.","s":false}]},{"id":"constraints","group":"12 · Advanced seminars in form","title":"Rules that make a novel possible","question":"When does a constraint generate meaning?","why":"Constraints can make writing possible. Brainard and Queneau show repetition and variation at their simplest; Calvino uses tarot cards to generate stories; Bök and Abish write under strict alphabetic rules; Motte is the Oulipo primer. Johnson's book in a box and Cortázar's Hopscotch let the reader choose the order. Perec's La Disparition omits the letter e; Duncan places Oulipo in intellectual history. Life: A User's Manual ends the path. Write a constrained piece of your own before you judge it.","assignment":"Identify one organising rule in Life: A User’s Manual and trace its effects in three chapters. Then write a 500-word constrained piece and a 500-word account of what the rule enabled and prevented.","criteria":"The analysis must connect the rule to an effect beyond cleverness. Your commentary must cite an actual revision you made because of the constraint. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"28293","sources":[],"rungs":[{"id":"1058074","d":"I Remember assembles brief recollections through one repeated opening. It is an accessible starting point for a rule that produces both intimacy and a social archive.","s":false},{"id":"added-raymondqueneauexercisesinstyle","d":"One incident is rewritten through many formal rules, making the difference between event and telling immediately testable.","s":false},{"id":"16201","d":"Ella Minnow Pea turns disappearing letters into a community’s escalating restriction. Because the rule enters the plot, it gives you a clear case of formal and political pressure interacting.","s":false,"o":true},{"id":"added-italocalvinothecastleofcrosseddestinies","d":"A limited set of images generates intertwined narratives, turning constraint into a procedure for inventing stories.","s":false},{"id":"765252","d":"Eunoia restricts sections to a single vowel. Read aloud to hear how constraint changes vocabulary, tone and the kinds of scene that can be sustained.","s":false},{"id":"135029","d":"Experiments and explanations show procedures in operation; reproduce one before judging what it can generate.","s":false,"o":true},{"id":"added-walterabishalphabeticalafrica","d":"Permitted initial letters expand and contract, forcing vocabulary to shape the world the novel can construct.","s":false},{"id":"244507","d":"Oulipo: A Primer of Potential Literature introduces writing through deliberately chosen constraints. Use its examples to distinguish a reproducible procedure from a one-off stylistic effect.","s":false},{"id":"added-bsjohnsontheunfortunates","d":"An unbound arrangement makes order partly the reader's responsibility, asking what remains stable across possible sequences.","s":false},{"id":"added-jyellowleesdouglastheendofbooksorbookswithoutend","d":"A study of interactive narrative supplies arguments about reading order and agency to test against the physical experiments.","s":false,"o":true},{"id":"28336","d":"La Disparition sustains a novel while excluding the letter e. Read in French if practical; an English translation uses a corresponding constraint and is a different verbal achievement to compare.","s":false},{"id":"added-raymondfedermandoubleornothing","d":"The page displays the labor and interruptions of composing a story, refusing to hide its construction behind a smooth narrative.","s":false,"o":true},{"id":"added-christinebrookeroseamalgamemnon","d":"Restrictions on verbal forms turn a narrator's possibilities into grammatical ones, making tense part of the novel's thought.","s":false,"o":true},{"id":"53413","d":"Hopscotch offers alternative routes through its chapters. Its placement asks how readerly choice differs from an author’s concealed structural rules.","s":false},{"id":"added-nkatherinehayleselectronicliterature","d":"An account of digitally mediated writing broadens the course's idea of a constraint beyond a rule imposed on ordinary print.","s":false,"o":true},{"id":"added-marcsaportacompositionno1","d":"Loose pages permit reordered reading, making the connection between sequence and meaning a practical experiment.","s":false,"o":true},{"id":"951480","d":"Oulipo Compendium gathers procedures, histories and examples. Read the entries connected to the preceding rungs and Perec; this is a specified reference selection, not an instruction to read the whole volume linearly.","s":true,"o":true},{"id":"added-dennisduncantheoulipoandmodernthought","d":"A history of Oulipo's intellectual setting puts its procedures in conversation with theories beyond the group itself.","s":false},{"id":"28293","d":"Life: A User’s Manual moves through a building’s rooms and the stories attached to them. It is terminal because constraints operate across the novel’s architecture as well as within individual scenes.","s":false}]},{"id":"pynchon-wallace","group":"12 · Advanced seminars in form","title":"Entertainment, systems and escape","question":"What happens when attention becomes an industry?","why":"Entertainment, information and distraction are the subject of America's biggest novels. Postman, McLuhan and Debord give you three theories of media; DeLillo's White Noise shows them in a family. Wallace's early novel and stories, Gleick's history of information and Dara's Lost Scrapbook set up the encyclopedic style. Gravity's Rainbow and Infinite Jest end the path together. Compare a scene of pleasure or distraction in each, and ask whether the books themselves escape what they diagnose.","assignment":"Compare two scenes of pleasure or distraction, one from Gravity’s Rainbow and one from Infinite Jest, in 1,200 words.","criteria":"Show how the scenes are formally organised and who gains or loses agency. Include evidence that complicates a simple claim that entertainment is bad. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"25820255","sources":[],"rungs":[{"id":"74034","d":"Amusing Ourselves to Death argues that the dominant form of a medium changes public discourse. Use its claims as hypotheses to test against the fiction, not as a master key.","s":false},{"id":"added-marshallmcluhanunderstandingmedia","d":"A provocative account of media forms asks what a medium changes independently of any particular message.","s":false},{"id":"11762","d":"Revisit this read book for its family life amid consumer language, media and fear of death. Its tonal changes prepare you to track humour without losing the threat beneath it.","s":false},{"id":"added-thomaspynchonvineland","d":"Television, family memory and political retreat share a networked narrative, an accessible extension of Pynchon's systems.","s":false,"o":true},{"id":"381440","d":"The Society of the Spectacle presents compressed propositions about social relations mediated by appearances. Translate a few theses into plain language before testing their fit to particular scenes.","s":false},{"id":"added-davidfosterwallacethebroomofthesystem","d":"Language, family stories and institutional settings make the possibility of an independent self into comedy.","s":false},{"id":"added-timwutheattentionmerchants","d":"A history of selling audiences' attention gives the fictional entertainment systems a specific commercial genealogy.","s":false,"o":true},{"id":"5933841","d":"Inherent Vice follows a detective through overlapping interests and disappearing certainties. It offers a more contained Pynchon route into systems that resist complete explanation.","s":false,"o":true},{"id":"8701960","d":"A history of information concepts distinguishes a technical framework from the looser sense of living amid too many messages.","s":false},{"id":"added-evandarathelostscrapbook","d":"Shifting voices build a collective situation without a stable guide, making attention to transitions part of understanding the whole.","s":false},{"id":"6751","d":"Consider the Lobster shows Wallace working through media, performance and ethical discomfort in essays. Read the title essay and the television-related pieces as a bridge to the novel’s concerns.","s":false,"o":true},{"id":"8599169","d":"A contested account of digital reading supplies claims about attention to compare with your own experience of these long novels.","s":false,"o":true},{"id":"413","d":"Measurement and political boundaries become material for a many-voiced historical fiction about systems and their exclusions.","s":false,"o":true},{"id":"6753","d":"Brief Interviews with Hideous Men makes voices and framing devices expose difficult relations between speaker and listener. It develops the question of how much interpretive work the audience must do.","s":false},{"id":"added-andrewpickeringthecyberneticbrain","d":"A history of cybernetics examines adaptive systems as practices, sharpening the technical metaphors circulating through Pynchon.","s":false,"o":true},{"id":"156182","d":"A historian's immense self-account turns explanation into evasion, demanding judgment of both verbal virtuosity and its uses.","s":false,"o":true},{"id":"17242066","d":"Gravity’s Rainbow makes war, technology, desire and organised power intersect in an unstable narrative. Track recurring institutions and images without assuming every connection confirms a single conspiracy.","s":false},{"id":"added-adamlevintheinstructions","d":"A sprawling account of belief, authority and collective action tests how scale can intensify a narrator's enclosed world.","s":false,"o":true},{"id":"25820255","d":"Infinite Jest interweaves a tennis academy, recovery and a dangerous entertainment. It ends the path by making the management of attention both a subject and a demand placed on the reader.","s":false}]},{"id":"wake","group":"12 · Advanced seminars in form","title":"Language beyond the familiar novel","question":"How can you read when ordinary comprehension is unstable?","why":"This path goes past the familiar novel into language that resists easy reading. Schwob, Pound and Hawkes open with fragmentary forms; Eco sets limits on interpretation; Burroughs and Ríos push language toward collage and pun. Steiner theorises translation; Beckett and his friends defended Finnegans Wake before it was finished. McHugh and Tindall are your guides. Finnegans Wake ends the path. Read one paragraph closely, then ask what the guides helped you see and what they may have decided for you.","assignment":"Choose a paragraph from Finnegans Wake I.8. Produce a 1,000-word annotated reading that includes sounds, possible meanings and uncertainties, then explain what a guide helped and what it may have overdetermined.","criteria":"Support associations with textual details or traceable sources. Label conjectures as conjectures. Read aloud and explain one effect that survives even where a single stable meaning does not. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"11013","sources":[],"rungs":[{"id":"765252","d":"Eunoia uses a highly audible constraint to make language strange. Revisit its sound and semantic compromises here as a comparison for difficulty produced by an explicit rule.","s":false,"o":true},{"id":"added-marcelschwobthebookofmonelle","d":"Compressed, shifting voices unsettle narrative certainty on a small scale before the course's enormous experiments.","s":false},{"id":"269589","d":"The Cantos assembles history, quotation and several languages into an extended poetic project. Read Cantos I–XVI as the defined selection, investigating allusions without treating the politics as incidental decoration.","s":true},{"id":"added-johnhawkesthecannibal","d":"Dislocated chronology and dense imagery make comprehension depend on connections that ordinary plot summary cannot preserve.","s":false},{"id":"added-umbertoecothelimitsofinterpretation","d":"Eco argues that openness does not make every reading equally defensible, a useful discipline for the difficult books ahead.","s":false},{"id":"43718203","d":"Naked Lunch disrupts continuity through scenes, voices and routines. It supplies a different model of how a reader can orient themselves when ordinary narrative sequence is unreliable.","s":false},{"id":"added-joselezamalimaparadiso","d":"A dense, associative language makes family and intellectual life inseparable from the act of verbal invention.","s":false,"o":true},{"id":"added-gertrudesteinthemakingofamericans","d":"Read the opening hundred pages first, then decide whether to continue; repeated patterns make characterization a linguistic process.","s":true,"o":true},{"id":"6862592","d":"Larva: A Midsummer Night’s Babel makes multilingual play a governing principle. Its reading demands help separate ambiguity, allusion and wordplay from a single generic notion of difficulty.","s":false},{"id":"added-jacquesderridadissemination","d":"Essays on writing and interpretation challenge stable textual authority; keep each interpretive move attached to the passage it analyzes.","s":false,"o":true},{"id":"added-josephmcelroywomenandmen","d":"An expansive network of consciousness and social connection asks readers to construct relations without a single controlling overview.","s":false,"o":true},{"id":"22104096","d":"Begin with fifty pages in the large-format edition; columns, wordplay and commentary make the page itself the experimental unit.","s":true,"o":true},{"id":"60408","d":"After Babel examines translation and the interpretation of language. It offers concepts for articulating what is happening when multiple languages press on one another.","s":false},{"id":"added-samuelbeckettandothersourexagminationroundhisfactificationforincaminationofworkinprogress","d":"Early responses to Joyce's unfinished work show how readers defended and described its difficulty before publication.","s":false},{"id":"added-johnbishopjoycesbookofthedark","d":"A sustained argument about sleep offers one framework for the Wake; test it rather than treating it as a master translation.","s":false,"o":true},{"id":"59478","d":"A Skeleton Key to Finnegans Wake offers an influential interpretive guide by Joseph Campbell and Henry Morton Robinson. Use it provisionally alongside your chapter, comparing its order with the text’s resistance to a single account.","s":false,"o":true},{"id":"added-rolandmchughannotationstofinneganswake","d":"Use entries for the passages you are reading; the full reference-book count does not mean reading the annotations cover to cover.","s":true},{"id":"added-williamyorktindallareadersguidetofinneganswake","d":"A guided account supplies orientation while leaving the primary text's local language available for independent judgment.","s":false},{"id":"11013","d":"Finnegans Wake turns sound, multilingual association and recurrent narrative material into an unusual reading experience. Read chapter I.8, Anna Livia Plurabelle, closely and aloud for this terminal rung; the full book remains a separate commitment.","s":true}]}],"books":{"wc-lem-perfect-vacuum":{"t":"A Perfect Vacuum","a":"Stanisław Lem","p":240,"e":true,"r":false,"u":"https://www.goodreads <script>
const D = JSON.parse(document.getElementById('data').textContent);
const B = D.books, PATHS = D.paths;
const byId = Object.fromEntries(PATHS.map(p=>[p.id,p]));
PATHS.forEach(p=>{ p.core=p.rungs.filter(b=>!b.o); });
const appears = {};
PATHS.forEach(p=>p.rungs.forEach(b=>{(appears[b.id] ||= []).push(p.id)}));
const ICON = '<svg viewBox="0 0 1024 1024" aria-hidden="true"><rect width="1024" height="1024" fill="#2c1670"/><circle cx="820" cy="190" r="300" fill="#3a1f8f"/><path d="M230 840 C 120 640, 560 690, 500 500 S 720 300, 780 230" fill="none" stroke="#b39dff" stroke-width="64" stroke-linecap="round" stroke-dasharray="2 112" stroke-dashoffset="-100"/><circle cx="780" cy="230" r="70" fill="#fff"/><circle cx="230" cy="840" r="46" fill="#f08fbf"/></svg>';

// ---------- progress ----------
let state = {done:{}, asg:{}, rev:0, gr:{}};
const LS_KEY = 'reading-paths-progress-v1';
function lsRead(){ try{ const s = localStorage.getItem(LS_KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function lsWrite(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function migrate(){ let changed=false; if((state.rev||0)<(D.rev||0)){ (D.unread||[]).forEach(id=>{ if(state.done[id]){ state.done[id]=0; changed=true; } }); state.rev=D.rev; changed=true; } return changed; }
function applyDefaults(){ Object.entries(B).forEach(([id,b])=>{ if(b.r && !(id in state.done)) state.done[id]=1; }); }
const local = lsRead(); if(local && local.done) state = {done:local.done||{}, asg:local.asg||{}, rev:local.rev||0, gr:local.gr||{}};
migrate(); applyDefaults(); lsWrite();

let syncKind='', syncText='On this device';
function setSync(k,t){ syncKind=k; syncText=t; const d=document.getElementById('syncdot'), x=document.getElementById('synctext'); if(d){d.className='dot '+k; x.textContent=t;} }
let ref=null, writing=false, dirty=false, timer=null;
function scheduleSave(){ lsWrite(); if(!ref) return; dirty=true; clearTimeout(timer); timer=setTimeout(flush,700); }
async function flush(){
  if(!ref||writing||!dirty) return;
  writing=true; dirty=false; setSync('','Saving…');
  try{ await ref.set({done:state.done, asg:state.asg, rev:state.rev||0, gr:state.gr||{}, updated:new Date().toISOString()}); setSync('ok','Synced'); }
  catch(e){ if(e&&e.code==='unavailable'){ dirty=true; setTimeout(flush,1500+Math.random()*1000); } else setSync('warn','On this device'); }
  writing=false; if(dirty) flush();
}
async function initSync(){
  if(!window.claude || !window.claude.use) return;
  let db=null,user=null;
  try{ [db,user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); }catch(e){}
  const uid = user ? await user.id() : null;
  if(!db||!uid) return;
  ref = db.doc('data/users/'+uid+'/progress');
  setSync('','Connecting…');
  const t = setTimeout(()=>setSync('warn','Sync unreachable'),10000);
  let first=true;
  ref.onSnapshot(snap=>{
    if(!snap.metadata.fromCache) clearTimeout(t);
    if(snap.exists){
      if(!snap.metadata.hasPendingWrites){
        const d=snap.data(); state={done:{...(d.done||{})}, asg:{...(d.asg||{})}, rev:d.rev||0, gr:{...(d.gr||{})}};
        const before=JSON.stringify(state.done)+state.rev; migrate(); applyDefaults();
        lsWrite(); render();
        if(JSON.stringify(state.done)+state.rev!==before){ dirty=true; flush(); }
      }
      if(!snap.metadata.fromCache) setSync('ok','Synced');
    } else if(first && !snap.metadata.fromCache){ dirty=true; flush(); }
    if(!snap.metadata.fromCache) first=false;
  }, ()=>{ clearTimeout(t); setSync('warn','On this device'); });
}

// ---------- helpers ----------
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n.toLocaleString('en-CA');
const isDone = id => !!state.done[id];
const pp = bk => `${bk.e?'≈ ':''}${fmt(bk.p)} pp.`;
function stats(p){
  const n=p.core.length, d=p.core.filter(b=>isDone(b.id)).length;
  const pages=p.core.reduce((s,b)=>s+B[b.id].p,0), left=p.core.filter(b=>!isDone(b.id)).reduce((s,b)=>s+B[b.id].p,0);
  const opt=p.rungs.filter(b=>b.o);
  return {n,d,pages,left,asg:!!state.asg[p.id],on:opt.length,od:opt.filter(b=>isDone(b.id)).length};
}
function overall(){
  const ids=new Set(); PATHS.forEach(p=>p.core.forEach(b=>ids.add(b.id)));
  let done=0,left=0; ids.forEach(id=>{ if(isDone(id)) done++; else left+=B[id].p; });
  return {total:ids.size, done, left, asg:PATHS.filter(p=>state.asg[p.id]).length};
}
function nextUp(){ for(const p of PATHS){ const b=p.core.find(b=>!isDone(b.id)); if(b) return {p,b}; } return null; }
const pct=(a,b)=>b?Math.round(100*a/b):0;
const topbar = () => `<div class="topbar"><a class="brand" href="#">${ICON}<span>Reading Paths</span></a>
  <div class="sync" aria-live="polite"><span class="dot ${syncKind}" id="syncdot"></span><span id="synctext">${esc(syncText)}</span></div></div>`;

// ---------- views ----------
let lastQ='';
function viewHome(){
  const o=overall(), nx=nextUp();
  let h=`<header class="band"><div class="col">${topbar()}
    <h1>Fifty-four paths, one hard book at the end of each</h1>
    <div class="tiles">
      <div class="tile"><b class="num">${o.done}/${o.total}</b><span>books read</span></div>
      <div class="tile"><b class="num">${fmt(o.left)}</b><span>pages to go</span></div>
    </div>
    <div class="bar"><i style="width:${pct(o.done,o.total)}%"></i></div>
    <div class="grstat" id="grstat">${esc(grText)}</div>
  </div></header><main class="col">`;
  if(nx){ const b=B[nx.b.id];
    h+=`<section><a class="next" href="#${nx.p.id}"><div class="eyebrow">Up next · ${esc(nx.p.title)}</div>
      <div class="t">${esc(b.t)}</div><div class="muted" style="font-size:14px">${esc(b.a)} · ${pp(b)}</div></a></section>`; }
  h+=`<section><label class="eyebrow" for="q">Search books, authors or paths</label>
    <input id="q" class="search" type="search" placeholder="Try Joyce, memory, Kant…" autocomplete="off">
    <div id="hits"></div></section>`;
  let g=null;
  PATHS.forEach(p=>{
    if(p.group!==g){ g=p.group; h+=`<h2 class="group">${esc(g)}</h2>`; }
    const s=stats(p), full=s.d===s.n;
    h+=`<a class="pl ${full?'full':''}" href="#${p.id}"><h3>${esc(p.title)}</h3>
      <span class="c num">${s.d}/${s.n}</span>
      <span class="q">${esc(p.question)}</span><div class="bar"><i style="width:${pct(s.d,s.n)}%"></i></div></a>`;
  });
  h+=`<div class="foot">
    <p>Page counts marked ≈ are estimates. Links open Goodreads.</p>
    <details data-k="gr"><summary>Import from Goodreads</summary>
      <p>On goodreads.com, open My Books → Import and export → Export library, then pick the file here. Every book on your "read" shelf that appears in a path gets ticked.</p>
      <label class="btn" for="gr-file" style="display:inline-block">Choose Goodreads export (.csv)</label>
      <input id="gr-file" type="file" accept=".csv,text/csv" style="position:absolute;left:-9999px">
      <p id="gr-msg" class="muted"></p>
    </details>
    <details data-k="bk"><summary>Back up or restore progress</summary>
      <p>Your progress lives in this browser${ref?' and syncs to your Claude account':''}. Copy a backup now and then; paste one here to restore it.</p>
      <button class="btn" type="button" id="bk-copy">Copy backup</button> <span id="bk-msg"></span>
      <label class="eyebrow" for="bk-in" style="display:block;margin-top:12px">Paste a backup</label>
      <textarea id="bk-in" spellcheck="false"></textarea>
      <button class="btn" type="button" id="bk-restore">Restore</button>
    </details></div></main>`;
  return h;
}
function rungHTML(b,i,p,nowId){
  const optional=!!b.o, bk=B[b.id], d=isDone(b.id), term=b.id===p.terminal, now=!optional&&b.id===nowId;
  const others=(appears[b.id]||[]).filter(x=>x!==p.id);
  return `<div class="rung ${d?'done':''} ${now?'now':''} ${optional?'opt':''}">
    <div class="n">${d?'✓':String(i+1).padStart(2,'0')}</div>
    <div><div class="title">${esc(bk.t)}</div><div class="by">${esc(bk.a)}</div>
      <p>${esc(b.d)}</p>
      <div class="chips"><span class="num">${pp(bk)}</span>
        ${now?'<span class="chip now">Up next</span>':''}
        ${optional?'<span class="chip optc">Optional</span>':''}
        ${term?'<span class="chip final">Final book</span>':''}
        ${b.w?'<span class="chip wild">Wildcard</span>':''}
        ${b.s?'<span class="chip sel">Read the selection</span>':''}
        ${others.length?`<span class="chip">Also in ${others.length} other path${others.length>1?'s':''}</span>`:''}
        ${bk.u?`<a href="${esc(bk.u)}" rel="noopener">Goodreads ↗</a>`:''}</div>
      <label class="check"><input type="checkbox" data-book="${esc(b.id)}" ${d?'checked':''}><span>${d?'Read':'Mark as read'}</span></label>
    </div></div>`;
}
function viewPath(p){
  const s=stats(p), i=PATHS.indexOf(p), nowB=p.core.find(b=>!isDone(b.id)), nowId=nowB?nowB.id:null;
  let h=`<header class="band"><div class="col">${topbar()}
    <a class="back" href="#">← All paths</a>
    <div class="eyebrow" style="margin-top:16px">${esc(p.group)}</div>
    <h1 style="margin-top:4px">${esc(p.title)}</h1>
    <p class="q">${esc(p.question)}</p>
    <div class="bar"><i style="width:${pct(s.d,s.n)}%"></i></div>
    <div class="stats"><span class="num">${s.d}/${s.n} core read</span>${s.on?`<span class="num">${s.od}/${s.on} optional</span>`:''}<span class="num">${fmt(s.left)} of ${fmt(s.pages)} pp. to go</span>${s.asg?'<span>Essay written</span>':''}</div>
  </div></header><main class="col">
  <section><p class="why">${esc(p.why)}</p></section>
  <section><h2 style="font-size:22px">The path</h2>`;
  p.rungs.forEach((b,k)=>h+=rungHTML(b,k,p,nowId));
  h+=`</section><section><div class="panel"><div class="eyebrow">Final assignment</div><p>${esc(p.assignment)}</p>
    <div class="eyebrow" style="margin-top:12px">A convincing response</div><p>${esc(p.criteria)}</p>
    <label class="check"><input type="checkbox" data-asg="${esc(p.id)}" ${s.asg?'checked':''}><span>${s.asg?'Essay written':'Mark essay written'}</span></label></div></section>`;
  h+=`<section>`;
  if(p.sources&&p.sources.length){ h+=`<details data-k="src"><summary>Sources and companions</summary>`;
    p.sources.forEach(x=>h+=`<div style="padding:0 0 12px"><a href="${esc(x.url)}" rel="noopener">${esc(x.title)}</a><div class="muted" style="font-size:14px">${esc(x.note||'')}</div></div>`);
    h+=`</details>`; }
  h+=`</section><section class="pager">${i>0?`<a href="#${PATHS[i-1].id}">← ${esc(PATHS[i-1].title)}</a>`:'<span></span>'}${i<PATHS.length-1?`<a href="#${PATHS[i+1].id}" style="text-align:right">${esc(PATHS[i+1].title)} →</a>`:''}</section></main>`;
  return h;
}
function searchHits(q){
  q=q.trim().toLowerCase(); if(q.length<2) return '';
  const out=[];
  PATHS.forEach(p=>{ if((p.title+' '+p.question+' '+p.group).toLowerCase().includes(q)) out.push(`<div class="hit"><a href="#${p.id}">${esc(p.title)}</a> <span class="muted">· path</span></div>`); });
  PATHS.forEach(p=>p.rungs.map(b=>[b,b.o?0:1]).forEach(([b,core])=>{
    const bk=B[b.id]; if((bk.t+' '+bk.a).toLowerCase().includes(q))
      out.push(`<div class="hit"><a href="#${p.id}">${esc(bk.t)}</a> <span class="muted">· ${esc(bk.a)} · ${esc(p.title)}${core?'':' (optional)'}${isDone(b.id)?' · read':''}</span></div>`); }));
  return out.length? out.slice(0,40).join('')+(out.length>40?`<div class="hit muted">${out.length-40} more…</div>`:'') : '<div class="hit muted">No matches.</div>';
}

// ---------- render & events ----------
function render(){
  const id=decodeURIComponent(location.hash.slice(1)), app=document.getElementById('app'), y=window.scrollY;
  const fq=document.activeElement&&document.activeElement.id==='q';
  const view=id, open=new Set([...app.querySelectorAll('details[open][data-k]')].map(d=>d.dataset.k));
  const keep=(render.view===view);
  if(byId[id]){ app.innerHTML=viewPath(byId[id]); document.title=byId[id].title+' · Reading Paths'; }
  else{ app.innerHTML=viewHome(); document.title='Reading Paths';
    const q=document.getElementById('q'); q.value=lastQ; document.getElementById('hits').innerHTML=searchHits(lastQ); if(fq) q.focus(); }
  if(keep) app.querySelectorAll('details[data-k]').forEach(d=>{ if(open.has(d.dataset.k)) d.open=true; });
  render.view=view;
  window.scrollTo(0,y);
}
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.book){ state.done[t.dataset.book]=t.checked?1:0; scheduleSave(); render(); }
  if(t.dataset.asg){ if(t.checked) state.asg[t.dataset.asg]=1; else delete state.asg[t.dataset.asg]; scheduleSave(); render(); }
});
document.addEventListener('input',e=>{ if(e.target.id==='q'){ lastQ=e.target.value; document.getElementById('hits').innerHTML=searchHits(lastQ); } });
document.addEventListener('click',async e=>{
  if(e.target.id==='bk-copy'){
    const m=document.getElementById('bk-msg');
    try{ await navigator.clipboard.writeText(JSON.stringify({v:1,done:state.done,asg:state.asg,rev:state.rev,gr:state.gr})); m.textContent='Copied.'; }
    catch(err){ const ta=document.getElementById('bk-in'); ta.value=JSON.stringify({v:1,done:state.done,asg:state.asg}); ta.select(); m.textContent='Copy blocked: the backup is in the box below, selected.'; }
  }
  if(e.target.id==='bk-restore'){
    const m=document.getElementById('bk-msg');
    try{ const d=JSON.parse(document.getElementById('bk-in').value); if(!d||typeof d.done!=='object') throw 0;
      state={done:d.done||{},asg:d.asg||{},rev:d.rev||D.rev||0,gr:d.gr||state.gr||{}}; scheduleSave(); render(); }
    catch(err){ m.textContent='That doesn’t look like a backup.'; }
  }
});
// ---------- Goodreads CSV import ----------
function parseCSV(text){
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true; else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; }
    else f+=c; }
  if(f||row.length){ row.push(f); rows.push(row); }
  return rows;
}
const normT=s=>String(s||'').normalize('NFKD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\(.*?\)/g,'').split(':')[0].replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
const lastN=a=>{ const w=normT(a).split(' '); return w[w.length-1]||''; };
const keyIndex=(()=>{ const m={}; Object.entries(B).forEach(([id,b])=>{ (m[normT(b.t)+'|'+lastN(b.a)] ||= []).push(id); }); return m; })();
document.addEventListener('change', async e=>{
  if(e.target.id!=='gr-file') return;
  const file=e.target.files&&e.target.files[0], msg=document.getElementById('gr-msg'); if(!file) return;
  try{
    const rows=parseCSV(await file.text()); const h=rows.shift().map(x=>x.trim());
    const ci=n=>h.indexOf(n), iId=ci('Book Id'), iT=ci('Title'), iA=ci('Author'), iS=ci('Exclusive Shelf');
    if(iT<0||iS<0) throw new Error('not a Goodreads export');
    let ticked=0, already=0, readCount=0; const seen=new Set();
    rows.forEach(r=>{ if(r[iS]!=='read') return; readCount++;
      const ids=new Set(); if(B[r[iId]]) ids.add(r[iId]); (keyIndex[normT(r[iT])+'|'+lastN(r[iA])]||[]).forEach(x=>ids.add(x));
      ids.forEach(id=>{ if(seen.has(id)) return; seen.add(id); if(isDone(id)) already++; else { state.done[id]=1; ticked++; } }); });
    scheduleSave(); render();
    const m=document.getElementById('gr-msg'); if(m) m.textContent=`Read ${readCount} books from your export. Ticked ${ticked} new book${ticked===1?'':'s'}; ${already} were already ticked.`;
  }catch(err){ const m=document.getElementById('gr-msg'); if(m) m.textContent='That file doesn’t look like a Goodreads library export.'; }
  e.target.value='';
});
// ---------- automatic Goodreads sync (public 'read' shelf widget, run in a sandboxed frame) ----------
const GR_SRC="https://www.goodreads.com/review/custom_widget/120052765.Antony%27s%20bookshelf:%20read?widget_id=rp&num_books=100&shelf=read";
let grText='', grFrame=null, grTimer=null, grLast=0;
function setGr(t){ grText=t; const el=document.getElementById('grstat'); if(el) el.textContent=t; }
function syncGoodreads(){
  if(grFrame || Date.now()-grLast<10*60*1000) return;
  grLast=Date.now(); setGr('Checking Goodreads…');
  grFrame=document.createElement('iframe');
  grFrame.setAttribute('sandbox','allow-scripts'); grFrame.setAttribute('aria-hidden','true'); grFrame.tabIndex=-1;
  grFrame.style.cssText='position:absolute;width:1px;height:1px;border:0;left:-9999px;top:0';
  grFrame.srcdoc='<!DOCTYPE html><div id="gr_custom_widget_rp"></div><script>function send(){var d=document.getElementById("gr_custom_widget_rp");var out=[].map.call(d.querySelectorAll(".gr_custom_each_container_rp"),function(e){var t=e.querySelector(".gr_custom_title_rp a"),a=e.querySelector(".gr_custom_author_rp a");return [t?t.textContent.trim():"",a?a.textContent.trim():""];});parent.postMessage({grSync:out},"*");}<\/script><script src="'+GR_SRC+'" onload="send()" onerror="parent.postMessage({grSync:null},\'*\')"><\/script>';
  document.body.appendChild(grFrame);
  grTimer=setTimeout(()=>finishGr(null),20000);
}
function finishGr(list){
  clearTimeout(grTimer); if(grFrame){ grFrame.remove(); grFrame=null; }
  const time=new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  if(!list || !list.length){ setGr('Couldn’t reach Goodreads. Will try again later.'); return; }
  let added=0; state.gr ||= {};
  list.forEach(([t,a])=>{ (keyIndex[normT(t)+'|'+lastN(a)]||[]).forEach(id=>{
    if(state.gr[id]) return; state.gr[id]=1; if(!isDone(id)){ state.done[id]=1; added++; } }); });
  scheduleSave(); render();
  setGr(`Synced with Goodreads at ${time}${added?` · ${added} new book${added>1?'s':''} ticked`:''}`);
}
window.addEventListener('message', e=>{
  if(!grFrame || e.source!==grFrame.contentWindow || !e.data || !('grSync' in e.data)) return;
  const list = Array.isArray(e.data.grSync) ? e.data.grSync.filter(x=>Array.isArray(x)&&typeof x[0]==='string'&&typeof x[1]==='string').slice(0,200) : null;
  finishGr(list);
});
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') syncGoodreads(); });
window.addEventListener('hashchange',()=>{ render(); window.scrollTo(0,0); });
render(); initSync(); syncGoodreads();
if('serviceWorker' in navigator && location.protocol==='https:' && window.top===window.self){
  try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
}
