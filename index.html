<style>
/* Tokens from the Reading Paths design system. Layout: one 680px reading column; a violet-deep band heads each view; rungs are hairline rows with a numbered gutter. */
:root{
  --surface:#f6f4fa; --surface-raised:#ffffff; --ink:#1d1828; --ink-muted:#5e5870; --line:#ddd7e8;
  --violet:#6b3fd4; --violet-soft:#ece4ff; --violet-deep:#2c1670; --read:#2e7650; --spark:#a3326b; --on-deep:#ffffff;
  --on-deep-muted:#cbbcf5;
  --display:"Newsreader", Georgia, "Times New Roman", serif;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px; --space-8:32px;
  --radius-sm:6px; --radius-md:12px; --radius-pill:999px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --surface:#13111a; --surface-raised:#1c1926; --ink:#ece8f5; --ink-muted:#a39cb6; --line:#2f2a3d;
    --violet:#b39dff; --violet-soft:#2a2145; --read:#76c99a; --spark:#f08fbf; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --surface:#13111a; --surface-raised:#1c1926; --ink:#ece8f5; --ink-muted:#a39cb6; --line:#2f2a3d;
  --violet:#b39dff; --violet-soft:#2a2145; --read:#76c99a; --spark:#f08fbf; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--surface);color:var(--ink);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
a{color:var(--violet)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.col{max-width:680px;margin:0 auto;padding-left:max(var(--space-4),env(safe-area-inset-left));padding-right:max(var(--space-4),env(safe-area-inset-right))}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;line-height:16px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--ink-muted)}
.muted{color:var(--ink-muted)}

/* band */
.band{background:var(--violet-deep);color:var(--on-deep);padding-top:calc(env(safe-area-inset-top) + var(--space-4));padding-bottom:var(--space-6)}
.band .eyebrow{color:var(--on-deep-muted)}
.band a{color:var(--on-deep)}
.topbar{display:flex;align-items:center;gap:var(--space-3);min-height:32px}
.brand{display:flex;align-items:center;gap:var(--space-2);font:600 18px/1 var(--display);text-decoration:none;color:var(--on-deep)}
.brand svg{width:26px;height:26px;border-radius:7px}
.sync{margin-left:auto;font-size:12px;color:var(--on-deep-muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--on-deep-muted)}
.dot.ok{background:#76c99a}.dot.warn{background:#f08fbf}
.band h1{font-size:32px;line-height:36px;margin-top:var(--space-6)}
.band .q{font:italic 400 19px/27px var(--display);margin:var(--space-2) 0 0;color:var(--on-deep)}
.band .bar{background:rgba(255,255,255,.18);margin-top:var(--space-4)}
.band .bar>i{background:#b39dff}
.band .stats{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-4);margin-top:var(--space-3);font-size:14px;color:var(--on-deep-muted)}
.back{display:inline-block;margin-top:var(--space-4);font-size:14px;text-decoration:none}

.bar{height:6px;background:var(--line);border-radius:var(--radius-pill);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--violet);border-radius:var(--radius-pill)}
main{padding-bottom:calc(env(safe-area-inset-bottom) + 64px)}
section{margin-top:var(--space-6)}
.grstat{margin-top:var(--space-3);font-size:12px;color:var(--on-deep-muted);min-height:16px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-2);margin-top:var(--space-4)}
.tile{background:rgba(255,255,255,.08);border-radius:var(--radius-md);padding:var(--space-3)}
.tile b{display:block;font:600 22px/28px var(--display);color:var(--on-deep)}
.tile span{font-size:12px;line-height:16px;color:var(--on-deep-muted)}

.next{display:block;background:var(--violet-soft);border-radius:var(--radius-md);padding:var(--space-4);text-decoration:none;color:var(--ink);}
.next .t{font:600 19px/25px var(--display);margin-top:var(--space-1)}
.next .eyebrow{color:var(--violet)}
.search{width:100%;padding:var(--space-3) var(--space-4);border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface-raised);margin-top:var(--space-2)}
.hit{padding:var(--space-3) 0;border-bottom:1px solid var(--line);font-size:14px}
.hit a{text-decoration:none;font-weight:500}

.group{margin-top:var(--space-8);font-size:22px;line-height:28px;padding-bottom:var(--space-2);border-bottom:1px solid var(--ink)}
.pl{display:grid;grid-template-columns:1fr auto;gap:var(--space-1) var(--space-3);align-items:baseline;padding:var(--space-4) 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.pl h3{font-size:18px;line-height:24px}
.pl .c{font-size:14px;color:var(--ink-muted)}
.pl .q{grid-column:1/-1;font-size:14px;line-height:20px;color:var(--ink-muted)}
.pl .bar{grid-column:1/-1;margin-top:var(--space-1)}
.pl.full .c{color:var(--read);font-weight:600}

.why{font:400 17px/27px var(--display);margin:0}
.rung{display:grid;grid-template-columns:28px 1fr;gap:0 var(--space-3);padding:var(--space-4) 0;border-bottom:1px solid var(--line)}
.rung .n{font:600 14px/24px var(--sans);color:var(--ink-muted);font-variant-numeric:tabular-nums}
.rung.done .n{color:var(--read)}
.rung.now .n{color:var(--violet)}
.rung .title{font:600 18px/24px var(--display)}
.rung .by{font-size:14px;color:var(--ink-muted)}
.rung p{margin:var(--space-2) 0 0;font-size:15px;line-height:23px}
.chips{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-2);align-items:center;margin-top:var(--space-2);font-size:13px;color:var(--ink-muted)}
.chip{display:inline-block;padding:1px var(--space-2);border-radius:var(--radius-pill);border:1px solid var(--line);font-size:12px;line-height:18px;color:var(--ink-muted)}
.chip.final{border-color:var(--violet);color:var(--violet)}
.chip.now{background:var(--violet);border-color:var(--violet);color:var(--surface)}
.chip.wild{border-color:var(--spark);color:var(--spark)}
.chip.sel{border-style:dashed}
.chip.optc{background:var(--line);border-color:var(--line);color:var(--ink-muted)}
.rung.opt .title{font-weight:400}
.rung.opt p{color:var(--ink-muted)}
.check{display:inline-flex;align-items:center;gap:var(--space-2);cursor:pointer;min-height:44px;margin-top:var(--space-1);font-size:14px}
.check input{appearance:none;-webkit-appearance:none;width:24px;height:24px;border:1.5px solid var(--ink-muted);border-radius:var(--radius-sm);margin:0;display:grid;place-content:center;background:var(--surface-raised)}
.check input:checked{background:var(--read);border-color:var(--read)}
.check input:checked::after{content:"";width:6px;height:11px;border:solid var(--surface);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.rung.done .check span{color:var(--read);font-weight:600}

.panel{background:var(--violet-soft);border-radius:var(--radius-md);padding:var(--space-4)}
.panel p{margin:var(--space-2) 0 0}
.panel .eyebrow{color:var(--violet)}
details{border-top:1px solid var(--line)}
summary{cursor:pointer;font-weight:600;padding:var(--space-3) 0;min-height:44px;display:flex;align-items:center;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-left:auto;font-weight:400;color:var(--violet);font-size:20px}
details[open] summary::after{content:"–"}
.pager{display:flex;justify-content:space-between;gap:var(--space-4);font-size:14px}
.pager a{text-decoration:none}
.foot{margin-top:40px;font-size:13px;color:var(--ink-muted)}
.btn{background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--radius-sm);padding:var(--space-2) var(--space-3);cursor:pointer;font-size:14px}
textarea{width:100%;min-height:90px;margin-top:var(--space-2);border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-raised);padding:var(--space-2);font-size:12px}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .3s}}
</style>
</head>

<script id="data" type="application/json">{"paths":[{"id":"story-games","group":"01 · Invention, play and dramatic form","title":"Stories that change the rules","question":"How do invented worlds, unreliable tellers and social comedy change what you believe?","why":"Every book here hands you a teller with an agenda: a dead memoirist, a fugitive, an undercover poet, a woman whose story is written by everyone but her. The first stretch trains suspicion on small, fast books. The second half asks for more: Le Guin and Coetzee build whole societies and authorships on accounts you can't fully trust, and Bulgakov ends the path with a city where the devil's version of events competes with the official one. Keep one question running from start to finish: what, in each book, earns your belief?","assignment":"Write 1,200 words on a confident account offered in The Master and Margarita. Compare its effect with one speculative rung and one of the four curveballs (Confederacy, The Vegetarian, Drive Your Plow or The Blind Assassin).","criteria":"Quote the relevant passages and name the narrator or frame in each. Separate observed events from explanations and explain a real difference between the three books; do not claim that every surprising event is the same kind of unreliable narration. Address one detail that resists your interpretation. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"117833","sources":[{"title":"A Confederacy of Dunces — LSU Press","url":"https://lsupress.org/9780807159606/a-confederacy-of-dunces/","note":"Publisher’s account of the New Orleans comic novel."},{"title":"The Vegetarian — Penguin Random House","url":"https://www.penguinrandomhouse.com/books/250333/the-vegetarian-by-han-kang/","note":"Publisher edition and description for Han Kang’s novel."},{"title":"Drive Your Plow Over the Bones of the Dead — Penguin Random House","url":"https://www.penguinrandomhouse.com/books/603656/drive-your-plow-over-the-bones-of-the-dead-by-olga-tokarczuk-translated-by-antonia-lloyd-jones/9780525541356/","note":"Publisher edition and description of the crime novel."},{"title":"The Blind Assassin — Penguin Random House","url":"https://www.penguinrandomhouse.com/books/6122/the-blind-assassin-booker-prize-winner-by-margaret-atwood/","note":"Publisher introduction to Atwood’s layered novel."},{"title":"Six Walks in the Fictional Woods — Penguin Random House Canada","url":"https://www.penguinrandomhouse.ca/books/789402/six-walks-in-the-fictional-woods-by-umberto-eco/9780674302464","note":"Publisher-distributor introduction to Eco's lectures on reading and narrative."}],"rungs":[{"id":"48982796","d":"The Posthumous Memoirs of Brás Cubas is told by a man writing after his death. Its short, witty chapters make his self-importance easy to enjoy and easy to question. Start here to see how a narrator can make you his accomplice without requiring a guide.","s":false},{"id":"422612","d":"A Confederacy of Dunces follows Ignatius Reilly through an unruly New Orleans. Its extravagant comedy is the first curveball: a protagonist whose certainty about himself collides with other people’s ordinary lives, without a science-fiction premise to blame.","s":false,"o":true},{"id":"94486","d":"The Invention of Morel gives a fugitive an apparently impossible island mystery in barely a hundred pages. Work out what he observes before accepting his account of how the island works; the device makes his desires visible too.","s":false},{"id":"added-umbertoecosixwalksinthefictionalwoods","d":"Eco explains the reader's part in constructing a fictional world; test his account against the impossible premises already encountered.","s":false,"o":true},{"id":"184419","d":"The Man Who Was Thursday begins with poets and a secret anarchist council, then repeatedly changes the apparent stakes. Its detective-story pace lets you practice revising an interpretation while the story is still moving.","s":false},{"id":"13053326","d":"Ubik places a group of specialists in a reality that seems to be coming apart. Follow the mystery and its absurd commercial details; each new explanation should be checked against what earlier scenes actually showed.","s":false},{"id":"223380","d":"Stories of Your Life and Others turns scientific and philosophical premises into different narrative forms. After Ubik’s unstable clues, Chiang offers a contrasting pleasure: watching a strange premise develop consequences with unusual precision. Read the whole collection.","s":false},{"id":"63198504","d":"Valuable Humans in Transit and Other Stories offers compressed situations involving minds, systems and technologies. Its short form makes each premise’s consequences easier to isolate before the larger novels.","s":false,"o":true},{"id":"25489025","d":"The Vegetarian follows one woman’s refusal to eat meat through the accounts of people around her. This disturbing domestic curveball asks why each narrator needs her choice to mean something different; their certainty is as revealing as their evidence.","s":false},{"id":"53780642","d":"The Employees assembles workplace testimony into a strange collective life. Ask what the reports reveal about an institution that no one speaker can fully describe; the later contemporary-fiction path returns to its fragmented narration.","s":false,"o":true},{"id":"74405","d":"The Rebel Angels makes stolen manuscripts and scholarly rivalries into a university comedy. The question of who has the authority to interpret a text now becomes a source of plot rather than a puzzle about technology.","s":false,"o":true},{"id":"20154682","d":"These essays model an adventurous reader returning to strange books; use them to question what makes a favorite repay attention.","s":false,"o":true},{"id":"42946966","d":"Drive Your Plow Over the Bones of the Dead uses a crime investigation and a forceful, eccentric narrator to argue about how humans treat animals. The crime-fiction curveball asks you to enjoy her voice while testing her case against what the novel actually shows.","s":false,"o":true},{"id":"76778","d":"The Martian Chronicles links episodes of encounter and settlement. Rather than solve one puzzle, track how the same imagined world takes on different meanings as human motives change.","s":false,"o":true},{"id":"78433","d":"The Blind Assassin interleaves a family account, newspaper fragments and a story within the story. This family-novel curveball lets a wildly invented tale do work inside a recognisable social history; notice when one account changes your understanding of another.","s":false},{"id":"added-janealisonmeanderspiralexplode","d":"A novelist studies shapes other than the conventional plot arc, offering language for the opening block's structural surprises.","s":false},{"id":"wc-lem-perfect-vacuum","d":"Lem reviews books that don't exist, starting with a review of A Perfect Vacuum itself. After a run of narrators you've learned to distrust, here the distrust has nowhere to land: each 'book' is a premise with no text behind it. Ask what a review can claim about a novel nobody can check.","s":false,"w":true},{"id":"18423","d":"The Left Hand of Darkness makes an outsider’s account of a society part of its inquiry into gender and trust. Pay attention to the limits of the visitor’s categories rather than treating the world as a fixed thought experiment.","s":false},{"id":"52397","d":"Parable of the Sower follows the making of a community amid social breakdown. Its changing beliefs have immediate consequences for travel, safety and practical decisions.","s":false,"o":true},{"id":"20518872","d":"The Three-Body Problem links scientific inquiry to historical trauma and an imagined encounter. It expands the scale on which a premise can organise choices and institutions, and gives the opening block one deliberately large conceptual puzzle.","s":false,"o":true},{"id":"34182166","d":"Foe retells an island story through a woman whose account is pressed into someone else’s book. Its contested authorship turns the playful question of who controls a story into a serious question of who gets heard.","s":false},{"id":"6602919","d":"The Dispossessed places a physicist between contrasting social orders. It is the speculative sequence’s culminating comparison: political ideals encounter work, intimacy and the imperfect institutions that carry them.","s":false},{"id":"117833","d":"The Master and Margarita gives Moscow’s literary establishment an impossible visitor and alternates it with another contested narrative. Its comedy, transformations and stories within stories make it a lively terminal test of whom you trust and why.","s":false}]},{"id":"novel-games","group":"01 · Invention, play and dramatic form","title":"The novel discovers its tricks","question":"What happens when a story notices its own machinery?","why":"The novel was self-conscious before it was realist. This path starts with the picaresque, where a rogue narrates his own survival, moves through Cervantes's knight who reads too much, and follows the English and French eighteenth century as writers argue over how to tell a life. Watt gives you the standard history of the form; Kundera offers a novelist's rival history. By Tristram Shandy you should be able to name the device behind each interruption and say what it does to your attention.","assignment":"Draw a one-page diagram of Tristram Shandy’s relationship between the order of telling and the order of events. Add 800 words comparing one interruption with a device in Don Quixote.","criteria":"Explain what the interruption does to attention, authority or sympathy. A chronological plot summary alone will not meet the assignment. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"15994742","sources":[],"rungs":[{"id":"added-apuleiusthegoldenass","d":"A transformed narrator moves through embedded tales; the ancient experiment makes the novel's supposed starting date worth questioning.","s":false,"o":true},{"id":"added-anonymouslazarillodetormes","d":"Lazarillo tells a life through service to successive masters. Its self-presentation gives you a compact starting point for the narrator who has reasons to arrange a story.","s":false},{"id":"added-paulscarronthecomicalhistory","d":"Traveling actors and interrupted narratives turn storytelling into a social performance before the eighteenth-century novel.","s":false,"o":true},{"id":"2070899","d":"Pantagruel stretches learning, bodily comedy and verbal excess into fiction. It introduces a tradition of abundance that a purely realist history of the novel can obscure.","s":false},{"id":"20557111","d":"Don Quixote makes reading a force that changes conduct and social experience. Read both parts: the later part’s awareness of the earlier one is central to this path.","s":false},{"id":"added-ianwatttheriseofthenovel","d":"Watt links narrative form to particular historical conditions; weigh his explanatory model against the unruly books around it.","s":false},{"id":"38262","d":"A life presented as a confession makes moral accounting difficult to separate from commercial self-presentation.","s":false},{"id":"added-henryfieldingjosephandrews","d":"Fielding's narrator argues with the conventions of his own story, giving a comic bridge between Cervantes and Sterne.","s":false},{"id":"added-denisdiderotjacquesthefatalist","d":"Jacques the Fatalist repeatedly interrupts the adventures it promises to tell. Its narrator makes the reader’s expectations part of a running argument about freedom and control.","s":false},{"id":"added-jonathanswiftataleofatub","d":"Digressions and mock scholarship keep displacing the tale, making narrative authority itself the object of satire.","s":false,"o":true},{"id":"added-denisdiderotrameausnephew","d":"An argumentative dialogue makes wit and moral instability inseparable, beside Diderot's larger narrative games.","s":false,"o":true},{"id":"24835","d":"The Sot-Weed Factor reworks the historical adventure novel through outrageous complications. Read it after Cervantes to distinguish a later use of inherited conventions from the conventions themselves.","s":false,"o":true},{"id":"added-mikhailbakhtinthedialogicimagination","d":"Essays on voices and genres provide a demanding account of why the novel can contain incompatible kinds of speech.","s":false,"o":true},{"id":"74405","d":"The Rebel Angels brings manuscripts, scholarship and competing desires into a university setting. It asks what happens when interpretation becomes a plot rather than its commentary.","s":false,"o":true},{"id":"wc-potocki-saragossa","d":"Written in French by a Polish count around 1800, it nests stories inside stories so deeply that keeping track of who is speaking becomes part of the reading. Keep a running diagram of the levels; you'll want it for Sterne.","s":false,"w":true},{"id":"added-machadodeassisdomcasmurro","d":"A jealous narrator organizes his own evidence; compare the reader's dependence on him with the narrator of Tristram Shandy.","s":false},{"id":"added-milankunderatestamentsbetrayed","d":"Kundera defends the novel's irony and ambiguity, sharpening the question of what these comic forms refuse to settle.","s":false},{"id":"10507","d":"Baudolino gives a gifted storyteller room to manufacture history and wonders. It extends the path from unreliable memoir to the collective appetite for convincing stories.","s":false,"o":true},{"id":"added-michaelmckeontheoriginsoftheenglishnovel16001740","d":"A historical argument about truth and social rank complicates Watt before the terminal novel dissolves orderly explanations.","s":false,"o":true},{"id":"15994742","d":"Tristram Shandy makes the difficulty of telling a life into its organising principle. It is terminal because chronology, narration, typography and the reader’s patience all become active material.","s":false}]},{"id":"drama","group":"01 · Invention, play and dramatic form","title":"The stage as an argument","question":"How does a play make competing claims live at once?","why":"Plays are arguments staged in bodies. Start with Greek tragedy and Aristotle's attempt to say what it does, then watch the stage change its terms: Marlowe's damnation, Molière's comedy of a man who won't compromise, Shakespeare's jealousy. Brook's Empty Space turns you from reader to director. Ibsen, Pirandello and Brecht each break the illusion in a different way, and Churchill's overlapping voices push further still. Lear comes last because it rewards every tool the path gives you.","assignment":"Stage one confrontation from King Lear on paper. Annotate pauses, movement and emphasis, then defend two different interpretations of the same exchange in 800 words.","criteria":"Both readings must fit the actual lines and stage circumstances. Explain what each performance makes harder to believe. Do not decide in advance that the play has no villain or one correct moral. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"added-williamshakespearekinglear","sources":[],"rungs":[{"id":"1519","d":"The Oresteia follows retaliation into a public dispute over justice. Its three-play movement establishes how a dramatic sequence can alter the terms of an argument.","s":false},{"id":"added-aristotlepoetics","d":"Plot, recognition and reversal become tools to test on the tragedies, not rules to impose automatically.","s":false},{"id":"added-sophoclesantigone","d":"Antigone places burial, family and civic authority in conflict. It is a compact exercise in hearing how each speaker defines the situation differently.","s":false},{"id":"added-euripidesthebacchae","d":"The Bacchae makes recognition and power violently unstable. After the civic language of the first rungs, attend to what theatrical spectacle can establish that argument cannot.","s":false},{"id":"added-christophermarlowedoctorfaustus","d":"Faustus makes knowledge and desire a theatrical bargain; compare his speeches with Shakespeare's handling of self-persuasion.","s":false},{"id":"577537","d":"Romeo and Juliet moves between public conflict and private speech. Listen for changes of form and rhythm as the lovers attempt to make a language of their own.","s":false,"o":true},{"id":"added-johnwebstertheduchessofmalfi","d":"A woman's secret marriage becomes a struggle over public power, extending the tragic problem beyond Shakespeare's kings.","s":false,"o":true},{"id":"added-williamshakespearetwelfthnight","d":"Twelfth Night uses disguise, mistaken desire and humiliation to make comedy uncomfortable. It broadens the path beyond tragedy while retaining the problem of unequal knowledge.","s":false,"o":true},{"id":"added-molierethemisanthrope","d":"A comedy of uncompromising sincerity asks whether being right can make a person socially unbearable.","s":false},{"id":"added-williamshakespeareothello","d":"Othello turns insinuation into apparently compelling evidence. Track exactly how a word, pause or prop changes what another character thinks they know.","s":false},{"id":"added-peterbrooktheemptyspace","d":"Brook distinguishes forms of theatrical life and deadness; imagine concrete staging choices while reading the plays.","s":false},{"id":"added-henrikibsenghosts","d":"A family tries to contain its past through respectable speech; place its concealed history beside A Doll's House.","s":false,"o":true},{"id":"92303","d":"The Importance of Being Earnest makes social convention visible through verbal precision and absurdity. Its comedy is a useful contrast to the destructive implications of speech in Othello.","s":false,"o":true},{"id":"added-auguststrindbergmissjulie","d":"Class and sexual power shift within one room, making the smallest exchange of initiative theatrically consequential.","s":false,"o":true},{"id":"37793","d":"A Doll’s House stages the household as a structure of money, reputation and obligation. It shifts the comparison toward the ordinary institutions that support dramatic conflict.","s":false},{"id":"added-ericbentleythelifeofthedrama","d":"Bentley's account of dramatic conflict offers a critic's vocabulary to carry into the terminal play.","s":false,"o":true},{"id":"added-luigipirandellosixcharactersinsearchofanauthor","d":"Unfinished characters confront a theater company, exposing the gap between a lived claim and its performance.","s":false},{"id":"added-bertoltbrechtthecaucasianchalkcircle","d":"An argument about justice is built into theatrical narration, giving a deliberately different approach to tragic identification.","s":false},{"id":"wc-churchill-top-girls","d":"Opens with a dinner where a 1980s businesswoman hosts women from history, art and legend, all talking over one another. The script marks overlapping speech with slashes, which makes it a direct challenge to staging an exchange on paper.","s":false,"w":true},{"id":"added-williamshakespearekinglear","d":"King Lear begins with a demand for public declarations of love and follows the consequences of misreading them. It gathers this path’s questions about speech, authority and recognition into one play.","s":false}]},{"id":"english-realism","group":"02 · The novel and society","title":"People inside a social world","question":"How much of a life can a narrator understand?","why":"The English social novel asks how a single choice ripples through a community. Austen sets the scale, the Brontës test its edges with passion and violence, and Rhys rewrites Jane Eyre from the margins. Gaskell, Dickens and Wharton widen the frame to industry, law and money; Williams supplies the critical lens on country and city. James and Eliot end the path by making consequence itself the subject. Watch how narrators claim the right to judge their characters, and when they withhold it.","assignment":"Choose one decision in Middlemarch and trace its consequences for three characters in 1,000 words. Compare the narrator’s treatment with a passage from Emma.","criteria":"Quote passages where the narrator knows more than the character. Distinguish access to information from generosity of judgement, and identify one limit to the narrator’s account. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"24612058","sources":[],"rungs":[{"id":"6969","d":"Emma builds much of its action around a clever heroine’s mistaken interpretations. It is the cleanest opening exercise in noticing the distance between a character’s view and a novel’s arrangement.","s":false},{"id":"added-janeaustenpersuasion","d":"A second chance at love depends on revised judgments, offering a quiet contrast to Emma's confidence.","s":false,"o":true},{"id":"10210","d":"Jane Eyre gives an individual voice unusual moral and emotional authority. Its first-person insistence provides a contrast to Austen’s shifting proximity to her heroine.","s":false},{"id":"added-annebrontethetenantofwildfellhall","d":"A woman's account interrupts a man's version of her life, making narrative permission part of the social problem.","s":false,"o":true},{"id":"25622780","d":"Wide Sargasso Sea reimagines the life of the woman confined in Jane Eyre. Read it immediately afterward to see how a changed centre of attention transforms an inherited story.","s":false},{"id":"24493739","d":"Layered testimony turns property, kinship and obsession into a history no single narrator can command.","s":false},{"id":"512710","d":"North and South connects personal relations with industrial conflict. Its competing social perspectives enlarge the scale from household judgement to a changing economic world.","s":false},{"id":"added-elizabethgaskellcranford","d":"Small-town routines organize a community's values, providing a compact counterweight to the large social novels.","s":false,"o":true},{"id":"added-raymondwilliamsthecountryandthecity","d":"Williams traces the meanings assigned to rural and urban life; compare his patterns with Gaskell's actual scenes.","s":false},{"id":"58696","d":"David Copperfield turns personal development into retrospective narration. Ask what the older teller’s coherence conceals about the uncertainty of the younger self.","s":false,"o":true},{"id":"added-anthonytrollopebarchestertowers","d":"Church appointments become a social contest in which motives are mixed and institutions have ordinary human textures.","s":false,"o":true},{"id":"50941736","d":"The House of Mirth follows Lily Bart through a social order in which taste and money regulate possibility. It makes reputation a material constraint rather than mere atmosphere.","s":false},{"id":"added-charlesdickensbleakhouse","d":"Two narrative modes connect intimate experience to institutional delay, enlarging the survey's idea of social explanation.","s":false},{"id":"added-qdleavisfictionandthereadingpublic","d":"A contentious account of reading cultures raises questions about whose tastes get treated as literary authority.","s":false,"o":true},{"id":"38374795","d":"Howards End brings family, property and cultural ideals into contact. Read its attempts at connection against the uneven resources that make those attempts possible.","s":false,"o":true},{"id":"added-thomashardyjudetheobscure","d":"Education and marriage become structures of exclusion, testing how much freedom a realist character can actually exercise.","s":false,"o":true},{"id":"264","d":"The Portrait of a Lady makes freedom of choice a difficult question rather than a possession. Its sustained attention to Isabel prepares a close comparison with Eliot’s distribution of sympathy.","s":false},{"id":"added-marypooveyunevendevelopments","d":"Poovey studies gender and ideology in Victorian Britain, giving specific historical arguments to test against Eliot's narrator.","s":false,"o":true},{"id":"24612058","d":"Middlemarch follows intersecting ambitions, marriages and failures across a provincial society. The terminal challenge is to read the network without reducing its people to examples of a thesis.","s":false}]},{"id":"french-realism","group":"02 · The novel and society","title":"Ambition, money and the French sentence","question":"How does a society teach people what to want?","why":"French fiction made ambition and money into literary engines. Stendhal and Balzac give you young men who calculate; Flaubert turns the same material into irony so cold it becomes a style; Maupassant and Zola push it toward the market and the mine. Bourdieu explains how Flaubert's generation built a field where art could refuse money, and Marx's Eighteenth Brumaire gives the political backdrop. Hugo closes with the grandest counterclaim. Read as much as you can in French: the sentence is half the subject.","assignment":"Compare one financial or professional ambition in Balzac with one in Les Misérables. In 1,000 words, show how narration makes the ambition plausible or suspect.","criteria":"Use a close reading of one paragraph from each author. Separate the narrator’s judgement from a character’s cliché, and explain one consequential difference of style. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"24280","sources":[],"rungs":[{"id":"1095776","d":"Le Rouge et le Noir follows ambition through love, patronage and status. It opens the path with a protagonist who repeatedly imagines his own life as a performance.","s":false},{"id":"added-stendhalthecharterhouseofparma","d":"Political adventure and private desire unfold through misread situations, complicating the career narrative of Le Rouge et le Noir.","s":false,"o":true},{"id":"59145","d":"Père Goriot concentrates a social world in a boarding house. Money and family obligation become readable through a small set of intersecting lives.","s":false},{"id":"added-honoredebalzaccousinbette","d":"Family resentment is inseparable from money and patronage, extending Balzac's social network into the household.","s":false,"o":true},{"id":"added-honoredebalzacillusionsperdues","d":"Illusions perdues follows literary aspiration into journalism, commerce and reputation. It develops the machinery of social advancement glimpsed in Père Goriot.","s":false},{"id":"added-alexisdetocquevilletheoldregimeandtherevolution","d":"Tocqueville asks what survived a revolution; bring that question to the novels' apparently new social orders.","s":false,"o":true},{"id":"2175","d":"Madame Bovary studies desire shaped by borrowed language and imagined lives. Read the prose for who appears to be speaking when a familiar phrase slips into narration.","s":false},{"id":"added-gustaveflaubertsentimentaleducation","d":"A life drifts through the hopes of a generation, showing how a realist novel can make nonachievement its structure.","s":false},{"id":"added-guydemaupassantawomanslife","d":"Expectations narrow under the pressure of family and marriage, giving a less flamboyant counterpart to Bel-Ami.","s":false,"o":true},{"id":"837030","d":"Bel-Ami follows advancement through journalism and sexual politics. Its brisk opportunism offers a useful counterpoint to Emma Bovary’s more inward fantasies.","s":false},{"id":"added-emilezolathereseraquin","d":"Desire and guilt are observed at close range, an early test of Zola's attempt to explain people through conditions.","s":false,"o":true},{"id":"added-emilezolanana","d":"Sex, spectacle and money circulate together, widening the account of what a society teaches its people to want.","s":false,"o":true},{"id":"1367034","d":"La Fortune des Rougon establishes a family’s fortunes amid political upheaval. It makes the relation between private advancement and collective history explicit.","s":false,"o":true},{"id":"added-pierrebourdieutherulesofart","d":"Bourdieu examines the literary field through Flaubert, linking the novelist's formal choices to a contested social position.","s":false},{"id":"added-gustaveflaubertbouvardandpecuchet","d":"Two enthusiastic readers apply successive systems of knowledge, making the failure of confident explanation into comedy.","s":false,"o":true},{"id":"added-emilezolagerminal","d":"Germinal gives industrial labour and conflict the scale of a social novel. Its crowds and material settings prepare you to examine how large narratives distribute individual agency.","s":false},{"id":"added-tjclarkthepaintingofmodernlife","d":"Close readings of nineteenth-century paintings provide a parallel way to study class, spectacle and representation.","s":false,"o":true},{"id":"added-karlmarxtheeighteenthbrumaireoflouisbonaparte","d":"A compressed political history treats inherited language as an active force, useful beside Hugo's expansive historical narration.","s":false},{"id":"24280","d":"Les Misérables joins individual lives to arguments about law, poverty, history and collective action. Read the digressions as structural choices to assess, not as obstacles you must automatically admire.","s":false}]},{"id":"russia","group":"02 · The novel and society","title":"The Russian novel: motive and history","question":"Can people explain the forces that move them?","why":"Russian fiction keeps asking why people act, and whether history explains them. Lermontov and Pushkin give you the superfluous man; Gogol makes bureaucracy uncanny; Dostoevsky's Underground Man refuses every explanation offered to him. Bakhtin argues that Dostoevsky's characters speak with independent voices; Berlin argues that Tolstoy wanted a single explanation and couldn't accept one. Erofeev's late-Soviet bender is a comic counterweight. War and Peace is last: test Tolstoy's theory of history against the scenes he actually writes.","assignment":"Compare a character’s explanation of an action in Dostoevsky with Tolstoy’s explanation of a historical event. Write 1,200 words on what each explanation leaves out.","criteria":"Reconstruct each account fairly before challenging it. Use three passages and explain how narrative form, rather than philosophical statements alone, supports your judgement. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"21851991","sources":[],"rungs":[{"id":"added-mikhaillermontovaheroofourtime","d":"A fragmented portrait invites judgment of a charismatic self-explainer before Dostoevsky intensifies the problem.","s":false},{"id":"252981","d":"The Collected Tales of Nikolai Gogol makes ordinary bureaucracy and urban life turn uncanny. Read The Nose, The Overcoat and Diary of a Madman as the defined selection for this rung.","s":true},{"id":"3532","d":"Adult recollection reorders youthful feeling, making hindsight part of the evidence rather than a neutral position.","s":false,"o":true},{"id":"27822","d":"Eugene Onegin combines a verse narrative with a conspicuous narrator. It introduces a different balance of intimacy, irony and social observation before the longer prose novels.","s":false},{"id":"added-ivangoncharovoblomov","d":"Inaction acquires domestic, economic and historical dimensions, a counterweight to the feverish motives of Dostoevsky.","s":false,"o":true},{"id":"49455","d":"Notes from Underground turns self-explanation into an attack on explanation itself. Its contradiction is the point to investigate, not a puzzle to cure by diagnosing the speaker.","s":false},{"id":"141077","d":"A disturbing confession turns moral conviction into an unreliable explanation of violence.","s":false,"o":true},{"id":"28381","d":"Dead Souls turns a dubious business scheme into a journey through a social landscape. It expands Gogol’s distortions from the short tale to a broader moral and economic panorama.","s":false},{"id":"added-fyodordostoevskythehouseofthedead","d":"A prison narrative slows attention down to habits, ranks and institutions before the later ideological novels.","s":false,"o":true},{"id":"12505","d":"The Idiot places a radically unworldly figure among desire, status and money. It tests what the novel can do with goodness when goodness does not supply practical understanding.","s":false,"o":true},{"id":"added-antonchekhovselectedstories","d":"Chekhov leaves explanation incomplete at a smaller scale; compare what a story declines to resolve with a novel's conclusions.","s":false},{"id":"added-mikhailbakhtinproblemsofdostoevskyspoetics","d":"Bakhtin's account of independent voices gives a strong critical claim to test against actual conversations in Dostoevsky.","s":false},{"id":"5695","d":"Demons follows political conviction through a community of competing motives. Keep the characters’ particular interests distinct from the doctrines they profess.","s":false},{"id":"wc-erofeev-moscow","d":"A drunk's train journey out of Moscow, told as a mock-epic packed with Biblical and literary quotation. Written in 1969–70 and circulated in samizdat. Ask whether the narrator's explanations for himself are any less elaborate than Tolstoy's.","s":false,"w":true},{"id":"added-isaiahberlinrussianthinkers","d":"Intellectual portraits reconstruct conflicts around freedom and history without reducing the novels to their ideas.","s":false},{"id":"153","d":"Anna Karenina interweaves intimate choices with questions of family, labour and belief. Its parallel lives prepare you for Tolstoy’s refusal to make one story contain the whole argument.","s":false},{"id":"added-vasilygrossmaneverythingflows","d":"A return from imprisonment becomes an examination of freedom and complicity beyond the nineteenth-century setting.","s":false,"o":true},{"id":"9782059","d":"Doctor Zhivago follows personal attachments through revolutionary upheaval. It offers a later version of the question of how an individual life can remain legible inside history.","s":false,"o":true},{"id":"added-orlandofigesnatashasdance","d":"A broad cultural history supplies context for the social worlds Tolstoy dramatizes; check its generalizations against scenes.","s":false,"o":true},{"id":"21851991","d":"War and Peace moves between households, battlefields and explicit arguments about historical explanation. It ends the path by putting personal motive and large-scale causation under sustained pressure.","s":false}]},{"id":"woolf","group":"03 · Language, form and modernism","title":"Modernism: the shape of a mind","question":"What makes a consciousness recognisable when the plot falls away?","why":"Modernism tried to make a mind visible on the page without simply reporting its thoughts. Woolf's essays set out the problem; Mansfield, Rhys and Richardson attempt it at different scales; Lispector and Svevo push consciousness to its strange edges. Ann Quin and Jon Fosse show what the technique became later in the century. Woolf's diary lets you watch The Waves being built. By the end, you should be able to say exactly which formal device produces each effect of interiority.","assignment":"Choose one passage from The Waves and one from an earlier rung. In 800–1,000 words, explain how each makes a mind perceptible without simply reporting its thoughts.","criteria":"Quote at least three small verbal details from each passage. Distinguish the speaker, the narrator and your own inference; explain one difference your initial comparison cannot account for. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"46114","sources":[],"rungs":[{"id":"added-virginiawoolfthecommonreader","d":"Woolf's essays show a practicing reader at work, offering a useful entrance into her later fictional experiments.","s":false},{"id":"18844","d":"A biography of Elizabeth Barrett Browning’s dog, Flush changes the scale and sensory basis of biography. It makes a useful, playful test of how Woolf gives a subject an interior life.","s":false,"o":true},{"id":"added-katherinemansfieldthegardenpartyandotherstories","d":"Brief shifts in perception make class and feeling coexist within a small scene, beside Woolf's different narrative rhythms.","s":false},{"id":"347413","d":"Sleepless Nights assembles a life from remembered people and places. Its discontinuities prepare you to read recurrence as structure rather than demand a continuous story.","s":false,"o":true},{"id":"added-lauramarcusthetenthmuse","d":"Marcus studies modernism's encounters with cinema, sharpening the comparison between attention on a page and moving images.","s":false,"o":true},{"id":"45894065","d":"A woman's return to Paris is filtered through painful memory, placing social vulnerability inside the modernist sentence.","s":false},{"id":"129344","d":"Speedboat follows a journalist’s fragmented observations. Read the jumps between incidents closely: they make a social atmosphere out of material that resists a conventional plot.","s":false,"o":true},{"id":"added-claricelispectorthepassionaccordingtogh","d":"An encounter in a room destabilizes the speaking self; compare its sustained crisis with the earlier Lispector rung.","s":false},{"id":"153425","d":"Near to the Wild Heart follows Joana’s developing inner life through shifts in language and perception. It supplies a different model of consciousness from Woolf’s social interweaving.","s":false,"o":true},{"id":"added-dorothyrichardsonpilgrimagepointedroofs","d":"Richardson builds experience through the movement of attention, offering a distinct early model of interior narration.","s":false},{"id":"84737","d":"Zeno’s Conscience presents a man’s account of himself under the sign of psychoanalysis. His explanations introduce self-deception into a path otherwise centred on perception.","s":false},{"id":"added-virginiawoolfawritersdiary","d":"Entries on reading and composition expose the labor behind the fictional effects; use them as evidence, not final explanations.","s":false},{"id":"added-rosamondlehmanntheweatherinthestreets","d":"An affair is narrated through uneven emotional awareness, extending the block's concern with what experience feels like before it is understood.","s":false,"o":true},{"id":"18852","d":"The Years follows a family across decades through conversations, absences and social change. It gives the temporal span of The Waves a more recognisable social framework.","s":false,"o":true},{"id":"added-annquinberg","d":"Shifting perceptions and dark comedy disrupt narrative footing, a later experiment in how a mind can organize a novel.","s":false},{"id":"added-mauricemerleaupontythephenomenologyofperception","d":"Read the introduction and part one on embodied perception; the full-volume page count is a reference, not the assigned scope.","s":true,"o":true},{"id":"46024004","d":"The Other Name begins Fosse’s Septology through a painter and his double. Read this first instalment as an experiment in repetition and attention; the remaining volumes are a separate continuation.","s":false},{"id":"added-joannarusstowritelikeawoman","d":"Essays on writing and judgment challenge what formal criticism notices or ignores about gender before the terminal Woolf.","s":false,"o":true},{"id":"46114","d":"The Waves distributes a life’s movement among six speaking voices and interludes of sea and light. It is the destination because the distinctions you have been tracking must now carry much of the narrative.","s":false}]},{"id":"poems","group":"03 · Language, form and modernism","title":"A voice made of lines","question":"What can a line do that a sentence cannot?","why":"This is a working poet's path. Oliver and McAuley give you the craft vocabulary; Lerner and Hugo argue about what poems are for. Then read across modes: Bishop's precision, Plath's intensity, Williams's American line, Rankine's lyric essay, Darwish's elegy, and Kaminsky's story told partly in silence. Sidney's Defense is the oldest argument in English for why any of this matters. Glück's Wild Iris ends the path as a model of a sequence that thinks in its form. Read every poem aloud.","assignment":"Make a six-poem annotated portfolio, with two poems from The Wild Iris. For each, write 150 words on one formal decision and read the poem aloud twice.","criteria":"Identify the specific line break, sound pattern or change of address you discuss. Include one case where sound complicates the apparent meaning. Do not substitute biography for the words. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"76546","sources":[],"rungs":[{"id":"18085958","d":"A Poetry Handbook gives concise accounts of sound, line and form. Use it as a working reference while reading the next collections rather than as a test to pass first.","s":false},{"id":"159895105","d":"A concise account of metrical practice gives a vocabulary to test on the poems instead of merely naming their moods.","s":false},{"id":"59418414","d":"Things You May Find Hidden in My Ear brings everyday objects, family memory and violence into lyric relation. It extends your Abu Toha reading while asking how a poem manages scale.","s":false,"o":true},{"id":"26114416","d":"Lerner asks why poems so often disappoint the promise attached to poetry, making expectations themselves available for criticism.","s":false},{"id":"57653182","d":"Rifqa places family history and Palestinian experience inside a forceful speaking voice. Compare its address to the reader with Abu Toha’s handling of concrete detail.","s":false,"o":true},{"id":"67599","d":"A poet discusses how association starts a poem; try one exercise and compare the process with a finished lyric.","s":false},{"id":"added-nicholsonbakertheanthologist","d":"A blocked poet explains verse while avoiding his own work, making prosodic authority both useful and comic.","s":false,"o":true},{"id":"34272476","d":"Devotions gathers Mary Oliver across her career. Read at least thirty poems across the volume, following how close observation becomes a claim about living.","s":true,"o":true},{"id":"added-irismurdochthebell","d":"Competing accounts of love and vocation in a religious community provide a prose comparison for the poems' forms of address.","s":false,"o":true},{"id":"980426","d":"Love Poems offers another encounter with Neruda beyond the collection you have finished. Compare the movement of image and address; if bilingual, inspect where the English line departs from the Spanish.","s":false,"o":true},{"id":"added-elizabethbishoppoems","d":"Exact observation resists easy emotional declaration, a useful contrast to the directness of several earlier voices.","s":false},{"id":"21532793","d":"War of the Foxes tests narrative and desire through recurring figures and images. It is a bridge from self-contained lyrics toward the pressure exerted by a whole collection.","s":false,"o":true},{"id":"added-claudiarankinecitizenanamericanlyric","d":"Scenes, images and lyric address test the boundary between private feeling and public racial experience.","s":false},{"id":"395090","d":"Ariel makes syntax, sound and volatile metaphors act together. Work through the poems individually before explaining them through the poet’s life.","s":false},{"id":"added-williamcarloswilliamspaterson","d":"Documents and voices make a city into a long poem, broadening what counts as poetic material.","s":false},{"id":"6413281","d":"Mural is Darwish’s extended encounter with mortality and language. It asks you to sustain attention across a long poem without assuming that every image has one fixed equivalent.","s":false},{"id":"added-penelopefitzgeraldtheblueflower","d":"A novel about Novalis makes poetic aspiration visible through ordinary people who cannot fully explain it.","s":false,"o":true},{"id":"added-philipsidneythedefenseofpoesy","d":"An early defense of imaginative writing gives the final poems a historical argument to answer, not simply inherit.","s":false},{"id":"wc-kaminsky-deaf-republic","d":"A sequence set in an occupied town that goes deaf in protest after soldiers kill a deaf boy; some pages show sign-language drawings. It tests how far a lyric sequence can carry a story, and what a poem does when sound is withdrawn.","s":false,"w":true},{"id":"76546","d":"The Wild Iris makes a garden the setting for shifting voices, including flowers and a human speaker. The collection is terminal because its arrangement changes what each individual poem can mean.","s":false}]},{"id":"epic","group":"03 · Language, form and modernism","title":"Epic, translation and the long poem","question":"How does a poem hold a world together?","why":"Epic is the form that carries a culture's memory, and every later poet has to negotiate with it. Homer comes first, with Lord's research on oral composition to explain the repetitions. Beowulf, Virgil, Dante and Milton each inherit the form and bend it to new beliefs; Auerbach shows how Dante made the afterlife historical. Walcott moves Homer to the Caribbean. Eliot and Carson break the long poem into fragments and myth. Four Quartets asks whether a long poem can be a meditation instead of a journey.","assignment":"Compare two journeys from different rungs in 1,200 words. Explain how the poem’s form changes what counts as arrival, achievement or failure.","criteria":"Use two passages from each work and identify your translations. Include one observation about rhythm or syntax, while distinguishing the translated wording from claims about the original language. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"added-tseliotfourquartets","sources":[],"rungs":[{"id":"1371","d":"The Iliad concentrates a war into an argument about anger, honour and loss. Begin here to see how repeated scenes and speeches give a long poem its internal memory.","s":false},{"id":"added-margaretatwoodthepenelopiad","d":"Penelope and the maids dispute an epic's distribution of speech; read this immediately after the Odyssey.","s":false,"o":true},{"id":"1381","d":"The Odyssey turns homecoming into an exercise in storytelling and recognition. Its embedded tales make the teller’s control of a narrative part of the action.","s":false},{"id":"added-patbarkerthesilenceofthegirls","d":"The Trojan War is narrated from captivity, testing what changes when an epic's supporting figures become its witnesses.","s":false,"o":true},{"id":"41940267","d":"Beowulf moves from heroic encounters toward the costs of a hero’s final fight. It offers a shorter comparison for the relation between public memory and individual courage.","s":false},{"id":"added-johngardnergrendel","d":"The monster receives a voice and an intellectual life, putting pressure on Beowulf's categories of order and threat.","s":false,"o":true},{"id":"added-albertblordthesingeroftales","d":"A study of oral composition changes what repetition and formula can mean in an epic performance.","s":false},{"id":"added-virgiltheaeneid","d":"The Aeneid joins a survivor’s journey to the founding story of an empire. Set its obligations and losses beside Homer before meeting Virgil again as Dante’s guide.","s":false},{"id":"added-ursulakleguinlavinia","d":"A marginal figure from the Aeneid confronts the poem that gives her existence, making adaptation a question of authority.","s":false,"o":true},{"id":"2696","d":"The Canterbury Tales lets storytellers compete over the kind of story worth telling. Read the General Prologue and the Knight’s, Miller’s, Wife of Bath’s, Pardoner’s and Nun’s Priest’s tales; those selections constitute this rung.","s":true,"o":true},{"id":"added-mifinleytheworldofodysseus","d":"A historian asks what social world the Homeric poems can disclose; distinguish reconstruction from direct evidence.","s":false,"o":true},{"id":"6655","d":"The Divine Comedy makes an afterlife into a vast architecture of judgement, memory and poetic ambition. Read all three canticles, using notes to follow historical references without losing the poem’s encounters.","s":false},{"id":"added-erichauerbachdantepoetofthesecularworld","d":"Auerbach connects individual lives and theological order, offering a precise argument to check against a canto.","s":false},{"id":"15997","d":"Paradise Lost gives argument, temptation and disobedience the scale of epic. After Dante’s ordered cosmos, attend to how Milton’s sentences make moral deliberation an experience in time.","s":false},{"id":"added-stanleyfishsurprisedbysin","d":"An influential reading of Paradise Lost makes the reader's errors part of the poem's action; test that claim on yourself.","s":false,"o":true},{"id":"added-matthewhollisthewastelandabiographyofapoem","d":"Composition and revision place the modern long poem inside a material history of decisions and collaborators.","s":false,"o":true},{"id":"wc-walcott-omeros","d":"A Caribbean epic in loose terza rima that gives Homer's names (Achille, Hector, Helen) to St Lucian fishermen. After Dante and Milton, ask whether the epic form can be borrowed without borrowing its hierarchy.","s":false,"w":true},{"id":"added-tseliotthewasteland","d":"The Waste Land assembles voices, quotations and abrupt transitions. Its placement lets you hear fragments of earlier traditions without treating allusions as a crossword to solve.","s":false},{"id":"added-annecarsonautobiographyofred","d":"A classical fragment becomes a modern verse narrative, showing inheritance as transformation before Eliot's final synthesis.","s":false},{"id":"added-tseliotfourquartets","d":"Four Quartets revisits time, language and spiritual attention through recurring motifs. It ends the path by making repetition and return, rather than heroic action, sustain the long poem.","s":false}]},{"id":"american-voices","group":"03 · Language, form and modernism","title":"American voices, partial histories","question":"Who gets to tell the story of a place?","why":"American fiction is full of partial testimony: stories told by people who can't see the whole, or who are hiding something. Douglass and Melville set the terms with a slave narrative and a slave revolt seen through a witness who misreads everything. Hawthorne, Hurston, Morrison and Ellison each build a voice against the history that tried to erase it; Morrison's Playing in the Dark names what the canon left out. Reed turns the archive into farce. Faulkner's Absalom ends the path as the hardest case of reconstruction from fragments.","assignment":"Build a source chart for one episode in Absalom, Absalom!: who reports it, when, and with what basis? Add 1,000 words comparing its uncertainty with a passage from Invisible Man.","criteria":"Separate witnessed fact, hearsay, inference and invention. Explain an effect of that uncertainty on the reader rather than merely noting that narrators are unreliable. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"373755","sources":[],"rungs":[{"id":"510540","d":"Narrative of the Life of Frederick Douglass turns personal testimony into an argument about slavery and self-possession. It establishes the stakes of who controls the account of a life.","s":false},{"id":"added-harrietjacobsincidentsinthelifeofaslavegirl","d":"Jacobs negotiates the demands of an audience while narrating enslavement; compare her rhetorical position with Douglass's.","s":false,"o":true},{"id":"12296","d":"The Scarlet Letter organises communal judgement around a public mark. Its narrator and frame make the authority to interpret that mark part of the story.","s":false},{"id":"added-hermanmelvilletheconfidenceman","d":"A boat becomes a market in credibility, carrying Melville's problem of interpretation into social comedy.","s":false,"o":true},{"id":"added-hermanmelvillebenitocereno","d":"Benito Cereno follows a visitor whose assumptions interfere with what he sees. It is a compact exercise in reading the distance between perception and evidence.","s":false},{"id":"added-charleswchesnuttthemarrowoftradition","d":"Racial violence is narrated through interlocking social positions, challenging the claim that a town has one public history.","s":false,"o":true},{"id":"7848","d":"Moby-Dick lets a voyage gather sermons, drama, classification and speculation. It broadens your sense of how a narrator can assemble a world without mastering it.","s":false},{"id":"added-jamesweldonjohnsontheautobiographyofanexcoloredman","d":"A fictional autobiography makes racial identity and retrospective self-justification mutually unstable.","s":false,"o":true},{"id":"37415","d":"Their Eyes Were Watching God gives Janie’s life a frame of telling and listening. Its relation between narration and speech is a useful counterpoint to the voices that surround her.","s":false},{"id":"11334","d":"A search for family history depends on voices and stories that official records cannot organize for the protagonist.","s":false},{"id":"15622","d":"Native Son follows a young man inside material constraints and damaging acts. It makes the relation between social explanation and individual responsibility difficult to settle.","s":false,"o":true},{"id":"added-jamesbaldwinthefirenexttime","d":"Baldwin's essays connect intimate address to national argument, offering a nonfiction model of voice under pressure.","s":false,"o":true},{"id":"added-tonimorrisonplayinginthedark","d":"Morrison asks how Blackness structures white American fiction; test her critical method against an earlier rung.","s":false},{"id":"29745548","d":"Invisible Man follows a narrator through institutions that repeatedly assign him a role. Its voice contests those roles while also examining his participation in them.","s":false},{"id":"11650","d":"A narrator imagines another man's life into a national story, making the authority of that imagination part of the problem.","s":false,"o":true},{"id":"10975","d":"The Sound and the Fury distributes a family’s decline across radically different narrative forms. Keep track of temporal cues before attempting to unify the accounts.","s":false},{"id":"173754979","d":"A familiar American story is retold through a voice it subordinated; ask which changes are formal, not merely corrective.","s":false},{"id":"added-henrylouisgatesjrthesignifyingmonkey","d":"A demanding account of rhetorical repetition and revision gives a vocabulary for the dialogue among these works.","s":false,"o":true},{"id":"wc-reed-mumbo-jumbo","d":"A detective farce about a 1920s 'anti-plague' called Jes Grew, complete with footnotes, photographs and a bibliography. It treats American cultural history as a contested archive: a sharp counterweight to Faulkner's single family archive.","s":false,"w":true},{"id":"373755","d":"Absalom, Absalom! reconstructs a family history through successive tellers and speculative scenes. It ends the path by making the act of assembling a history as consequential as the history assembled.","s":false}]},{"id":"central-europe","group":"03 · Language, form and modernism","title":"A world arguing with its own decline","question":"Can a novel think without becoming a treatise?","why":"Central Europe between 1900 and 1945 produced a literature that analysed its own collapse while it was happening. Zweig remembers the world that ended; Musil, Broch and Walser write about schooling, values and servitude as that world comes apart. Roth's Radetzky March is the elegy, Bernhard's Loser the bitter aftermath, and Schorske the cultural history that ties them together. Mann's sanatorium and Musil's unfinished novel both stage long arguments about ideas. Notice who wins those arguments, and why the novels keep refusing to say.","assignment":"Choose an argument between characters in The Man Without Qualities. In 1,000 words, explain how the scene changes when you attend to the speakers’ interests, setting and style.","criteria":"State the argument accurately, then show what the dramatic situation adds. Compare one scene from The Magic Mountain and avoid treating either novel as a list of its author’s opinions. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"527756","sources":[{"title":"The Man Without Qualities, Volume 2 — Penguin Random House","url":"https://www.penguinrandomhouse.com/books/119161/the-man-without-qualities-vol-2-by-robert-musil/9780679768029/","note":"Edition information for the continuation and posthumous material."}],"rungs":[{"id":"59151","d":"Chess Story compresses isolation, mental discipline and obsession into a frame narrative. It starts the path with an argument embodied in an encounter rather than an essay.","s":false},{"id":"added-stefanzweigtheworldofyesterday","d":"An exile remembers the cultural world the novels dissect, giving their irony a competing elegiac perspective.","s":false},{"id":"added-robertmusiltheconfusionsofyoungtorless","d":"The Confusions of Young Törless studies cruelty and intellectual uncertainty in a school. It introduces Musil’s interest in the distance between analytical intelligence and ethical action.","s":false},{"id":"added-hermannbrochthedeathofvirgil","d":"A dying poet's consciousness becomes a sustained argument about art and responsibility, extending the block's thinking novel.","s":false,"o":true},{"id":"added-hermannbrochthesleepwalkers","d":"Three historical moments trace a crisis of values through changing fictional forms, beside Mann's enclosed society.","s":false},{"id":"513275","d":"Jakob von Gunten presents an education in service through an elusive diary voice. It offers a stranger institutional setting and an unstable relation to submission.","s":false},{"id":"added-josephroththeemperorstomb","d":"The aftermath of imperial collapse makes nostalgia into a lived political and emotional problem.","s":false,"o":true},{"id":"added-josephroththeradetzkymarch","d":"The Radetzky March follows a family within the waning Habsburg order. It supplies a narrative of institutions and inherited roles to set beside Musil’s analytical society.","s":false},{"id":"added-heinrichbolltheclown","d":"A performer judges postwar respectability from its margins, giving social critique an intensely interested voice.","s":false,"o":true},{"id":"added-guntergrassthetindrum","d":"A narrator's refusal to grow turns national history into a grotesque personal performance whose testimony demands suspicion.","s":false,"o":true},{"id":"92570","d":"The Loser turns artistic comparison into an obsessive monologue. Its repetition tests whether thinking on the page can also be a means of avoiding thought.","s":false},{"id":"added-carleschorskefindesieclevienna","d":"Studies of politics and culture supply specific historical connections rather than a general atmosphere of decline.","s":false},{"id":"added-allanjanikandstephentoulminwittgensteinsvienna","d":"Philosophical problems are placed within an urban culture concerned with representation and language.","s":false,"o":true},{"id":"88077","d":"The Magic Mountain brings illness, time and ideological argument into a sanatorium. Observe how duration and social arrangement make the debates part of a lived environment.","s":false},{"id":"added-ivanklimathespiritofprague","d":"Essays on writing under political pressure connect the Central European sentence to the conditions of its production.","s":false,"o":true},{"id":"16631","d":"A divided self encounters a theatrical account of its own possibilities, a smaller-scale contrast to Musil's multiplicity.","s":false,"o":true},{"id":"16634","d":"The Glass Bead Game imagines an intellectual order through the life of one of its masters. It sharpens the question of what cultivated intelligence owes to the world outside its institution.","s":false,"o":true},{"id":"added-gordonbrookshepherdtheaustriansathousandyearodyssey","d":"A broad national history supplies a chronological scaffold for institutions and loyalties that the novels assume.","s":false,"o":true},{"id":"527756","d":"The Man Without Qualities examines a society through conversations, conceptual experiments and suspended possibilities. It is terminal because following the thought requires attending to the novel’s irony and unfinished movement at once.","s":false}]},{"id":"unreliable","group":"03 · Language, form and modernism","title":"Confession, memory and the alibi","question":"When does telling the truth become a way of hiding?","why":"Every narrator here is giving evidence in their own defence. James and Ford teach you to doubt a governess and a cuckold; Camus's penitent judge and Christie's narrator show how far confession can mislead. Carrère writes about a real impostor; Ishiguro's painter revises his past. Booth's Rhetoric of Fiction gives you the critical vocabulary for all of it. Pale Fire is the extreme case. The Remains of the Day comes last because its narrator is so courteous that his evasions are easy to miss.","assignment":"Write 900 words on a passage where Stevens’s interpretation differs from yours. Compare it with one narrator earlier in the path.","criteria":"Identify what the text actually establishes, what you infer, and what remains undecidable. Give a plausible alternative to your reading and explain why you prefer yours. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"28921","sources":[],"rungs":[{"id":"12948","d":"The Turn of the Screw makes a governess’s account inseparable from the evidence it presents. Begin by noticing how difficult it is to step outside the frame she supplies.","s":false},{"id":"added-fordmadoxfordthegoodsoldier","d":"A narrator revises the meaning of events as he tells them, making order itself a mechanism of concealment.","s":false},{"id":"774027","d":"La chute presents confession as a performance addressed to a largely silent listener. Ask when apparent candour becomes a way of implicating someone else.","s":false},{"id":"added-agathachristiethemurderofrogerackroyd","d":"A tightly controlled account tests what a narrator can technically disclose while still misleading the reader.","s":false},{"id":"9574908","d":"The Tunnel follows a painter’s account of obsession and violence. Its insistence on explanation gives you a concentrated study of a narrator trying to control judgement.","s":false,"o":true},{"id":"added-ianmcewanatonement","d":"An interpretation becomes an accusation, then a problem for the act of writing that tries to repair it.","s":false,"o":true},{"id":"10746542","d":"The Sense of an Ending makes later information disturb a settled memory of youth. It distinguishes ordinary retrospective simplification from deliberate falsification.","s":false,"o":true},{"id":"added-francesayatestheartofmemory","d":"Historical memory techniques make remembering a constructed practice, not simply a transparent retrieval of experience.","s":false,"o":true},{"id":"added-daniellschacterthesevensinsofmemory","d":"A psychologist distinguishes ways memory fails, helping separate deliberate deception from ordinary reconstruction.","s":false,"o":true},{"id":"340244","d":"L’Adversaire examines a life constructed through deception and the writer’s attempt to narrate it. It introduces the ethical limits of giving another person a coherent story.","s":false},{"id":"added-patriciahighsmiththetalentedmrripley","d":"Intimate access to calculation invites sympathy without providing an honest confession.","s":false,"o":true},{"id":"166997","d":"Stoner follows a quiet academic life through a comparatively restrained narrator. Use it as a control: sympathy and selective attention do not automatically make narration unreliable.","s":false,"o":true},{"id":"added-kazuoishiguroanartistofthefloatingworld","d":"Retrospective dignity depends on uncertain accounts of public responsibility, a focused companion to the terminal Ishiguro.","s":false},{"id":"added-waynecbooththerhetoricoffiction","d":"Booth gives an influential vocabulary for narrative distance and reliability; see where your examples exceed it.","s":false},{"id":"497499","d":"The Door looks back on an unequal relationship through guilt and incomprehension. It tests the extent to which retrospective acknowledgement repairs a narrator’s limitations.","s":false},{"id":"added-julianbarnesflaubertsparrot","d":"A literary investigation becomes a personal evasion, making the collector of facts a suspect interpreter.","s":false,"o":true},{"id":"7805","d":"Pale Fire gives you a 999-line poem and an editor’s foreword, commentary and index that increasingly compete with it. Read the poem first, then the apparatus; on a second pass, test the editor’s claims against the lines he cites. Your five-star Lolita makes Nabokov’s seductive narrative control a particularly good fit here.","s":false},{"id":"55840401","d":"Letters organize a young narrator's partial understanding; compare innocent withholding with the adult alibis in the block.","s":false,"o":true},{"id":"28921","d":"The Remains of the Day follows a butler whose professional vocabulary shapes his account of a life. Its reserve makes the reader responsible for hearing what a fluent explanation cannot comfortably say.","s":false}]},{"id":"joyce","group":"03 · Language, form and modernism","title":"Joyce: from a street to a world","question":"How can style become part of what happens?","why":"Joyce built Ulysses from Dublin outward. Start with Dubliners and Portrait so you know the city and Stephen, reread The Odyssey for the scaffolding, then watch Flann O'Brien and Henry Roth take Joyce's methods in different directions. Proust is the other great modernist experiment with memory and time. Blamires and Lawrence are your guides: one follows the plot episode by episode, the other tracks the shifts in style. By Ulysses, you should be ready to say why each episode is written the way it is.","assignment":"Choose one episode of Ulysses and explain in 1,200 words why its particular form matters. Include a short account of how the episode would change if narrated in the style of Dubliners.","criteria":"Ground the comparison in two passages. Identify one effect on time, knowledge or sympathy; do not settle for naming a technique or listing Homeric correspondences. Include a passage from an imaginative work and an argument or observation from a nonfiction work; distinguish illustration from evidence.","terminal":"338798","sources":[{"title":"The New Bloomsday Book — Routledge","url":"https://www.routledge.com/The-New-Bloomsday-Book-A-Guide-Through-Ulysses/Blamires/p/book/9780415138581","note":"Harry Blamires’s running guide; consult alongside the novel."}],"rungs":[{"id":"added-marylavintalesfrombectivebridge","d":"Lavin's intimate social observation provides a later Irish comparison for the silences and missed recognitions of Dubliners.","s":false,"o":true},{"id":"11012","d":"Dubliners finds consequential hesitations inside ordinary urban lives. Track how a story’s closing perception changes the scene that led to it.","s":false},{"id":"added-ednaobrienthecountrygirls","d":"Two young women encounter the constraints of provincial Ireland, changing the gendered terms of the artist's escape narrative.","s":false,"o":true},{"id":"7588","d":"A Portrait of the Artist as a Young Man makes its prose change alongside Stephen’s developing sensibility. It prepares you to treat style as a variable within a novel.","s":false},{"id":"added-jamesjoyceexiles","d":"Joyce's play makes freedom and possessiveness into dialogue, a useful departure from the developing prose techniques.","s":false,"o":true},{"id":"added-daviddicksondublinthemakingofacapitalcity","d":"Urban history supplies streets, institutions and social divisions that Joyce's fiction rearranges into experience.","s":false,"o":true},{"id":"1381","d":"The Odyssey supplies a narrative of wandering and return that Ulysses transforms. Read it for its own storytelling first; resemblance does not require one-to-one equivalence.","s":false},{"id":"added-flannobrienatswimtwobirds","d":"Stories rebel against the storyteller, offering an Irish experiment that does not simply imitate Joyce's interiority.","s":false},{"id":"added-flannobrienthedalkeyarchive","d":"A comic encounter with literary reputation turns Joyce himself into fictional material.","s":false,"o":true},{"id":"366524","d":"Call It Sleep follows a child’s experience of language, family and city life. It gives an independent comparison for the formal problem of rendering a consciousness inside an urban world.","s":false},{"id":"added-marcelprousttheguermantesway","d":"Continue Proust's social and perceptual experiment beyond Swann, watching how a familiar name changes with acquired knowledge.","s":false,"o":true},{"id":"added-williamhgassonbeingblue","d":"A writer's meditation on a word's associations asks how language can generate a world without a conventional plot.","s":false,"o":true},{"id":"12749","d":"Swann’s Way turns memory and perception into an extended narrative method. Read this first volume as a self-contained rung, not a commitment to finish the entire sequence now.","s":false},{"id":"added-johnmccourttheyearsofbloom","d":"Joyce's Trieste years put his writing within multilingual daily life rather than a myth of solitary genius.","s":false,"o":true},{"id":"added-richardellmannjamesjoyce","d":"A substantial biography distinguishes the author's lived circumstances from the transformations performed by the fiction.","s":false,"o":true},{"id":"added-harryblamiresthenewbloomsdaybook","d":"The New Bloomsday Book offers an episode-by-episode guide to Ulysses. Consult each section after a first attempt at the corresponding episode, then reread the passages that became clearer.","s":false},
